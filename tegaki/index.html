<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手描きサウンドノベル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Yusei+Magic&display=swap">
<style>
/* 和紙と藍墨の絵本：紙の上に手描きの絵、文字は藍墨、山吹は「次にすること」と焦点だけ */
:root {
  --paper: #E9ECE6;      /* 和紙（少し青みのある白） */
  --sheet: #F6F7F3;      /* 紙の上に重ねる一枚 */
  --ink: #1E2B45;        /* 藍墨 */
  --ink-soft: #5D6678;
  --rule: rgba(30, 43, 69, 0.18);
  --yamabuki: #E2A23B;   /* 山吹：主な操作と焦点 */
  --on-yamabuki: #1E2B45;
  --danger: #A8402E;
  --ok: #3E7A52;
  --field: #FFFFFF;
  --night: rgba(16, 22, 36, 0.55);   /* 絵の上に本文を載せる帯（絵の上なので常に暗い） */
  --night-ink: #F1F0EA;
  /* 旧名（スクリプト・他の部品から参照） */
  --bg: var(--paper); --fg: var(--ink); --muted: var(--ink-soft); --accent: var(--yamabuki); --line: var(--rule); --panel: var(--sheet);
  --font-size: 18px;
  --hand: "Yusei Magic", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", var(--sans-base);
  --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --sans-base: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
  --sans: var(--sans-base);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141925; --sheet: #1C2232; --ink: #E4E7E0; --ink-soft: #9AA2B2; --rule: rgba(228, 231, 224, 0.16);
    --yamabuki: #EDB45A; --on-yamabuki: #141925; --danger: #F09A86; --ok: #8FD0A2; --field: #11151F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141925; --sheet: #1C2232; --ink: #E4E7E0; --ink-soft: #9AA2B2; --rule: rgba(228, 231, 224, 0.16);
  --yamabuki: #EDB45A; --on-yamabuki: #141925; --danger: #F09A86; --ok: #8FD0A2; --field: #11151F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  background: var(--sheet);
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  padding: 8px 14px;
}
button:hover { border-color: var(--ink-soft); }
button.primary { background: var(--yamabuki); border-color: var(--yamabuki); color: var(--on-yamabuki); font-weight: 600; }
button.primary:hover { filter: brightness(1.05); }
:focus-visible { outline: 2.5px solid var(--yamabuki); outline-offset: 2px; }
.hidden { display: none !important; }

/* ---------- 起動画面 ---------- */
#home {
  min-height: 100vh;
  max-width: 620px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 30px;
}
/* 見本の絵：読んでいる一文が、その場で手描きの場面になる */
#home-hero { margin: 0; display: grid; gap: 12px; }
#home-scene {
  width: 100%; aspect-ratio: 16 / 9; max-width: 100%; display: block;
  border-radius: 6px; background: var(--sheet);
  box-shadow: 0 0 0 1.5px var(--ink), 3px 4px 0 0 var(--rule);
}
#home-hero figcaption {
  font-family: var(--serif); font-size: 15px; line-height: 1.8; color: var(--ink);
  min-height: 1.8em; transition: opacity 0.6s ease;
}
#home-hero figcaption.fading { opacity: 0; }
#home h1 {
  font-family: var(--hand);
  font-weight: 400;
  font-size: clamp(32px, 9vw, 46px);
  line-height: 1.15;
  letter-spacing: 0.02em;
  margin: 0;
  text-wrap: balance;
}
#home .lead { color: var(--ink-soft); font-size: 15px; line-height: 1.85; margin: 10px 0 0; max-width: 34em; }
#drop-zone {
  display: grid;
  gap: 6px;
  border: 2px dashed var(--ink-soft);
  border-radius: 10px;
  padding: 22px 18px;
  cursor: pointer;
  background: var(--sheet);
  transition: background 0.2s, border-color 0.2s;
}
#drop-zone:hover, #drop-zone.dragover { border-color: var(--yamabuki); }
#drop-zone.dragover { background: color-mix(in srgb, var(--yamabuki) 12%, var(--sheet)); }
#drop-zone:focus-within { outline: 2.5px solid var(--yamabuki); outline-offset: 2px; }
#drop-zone .big { font-family: var(--hand); font-size: 22px; }
#drop-zone .small { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
#file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#home section h2, #url-form > label {
  font-family: var(--hand);
  font-size: 19px;
  font-weight: 400;
  margin: 0 0 6px;
}
/* 作品の一覧は罫線の行（帳面の罫） */
.list { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--rule); }
.list > li { border-bottom: 1.5px solid var(--rule); }
.list button {
  width: 100%;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 14px 4px;
  background: none;
  border: 0;
  border-radius: 0;
  font-family: var(--serif);
  font-size: 17px;
}
.list button:hover { background: color-mix(in srgb, var(--yamabuki) 10%, transparent); }
.list .meta { font-family: var(--sans); color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
#home-error { color: var(--danger); font-size: 14px; line-height: 1.6; }
#url-form { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
#url-form .url-row { display: flex; gap: 8px; }
#url-form input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--field); }
#url-form small { color: var(--ink-soft); font-size: 12px; }
.recent-item { display: flex; gap: 6px; align-items: center; }
.recent-item > button:first-child { flex: 1; min-width: 0; }
.recent-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item .del { width: auto; flex: none; padding: 6px 10px; color: var(--ink-soft); font-family: var(--sans); font-size: 13px; }
#home-footer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#home-footer .meta { color: var(--ink-soft); font-size: 12px; }

/* ---------- 読書画面 ---------- */
#reader { position: relative; min-height: 100vh; }
#reader-top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: linear-gradient(rgba(16, 22, 36, 0.75), rgba(16, 22, 36, 0));
  color: var(--night-ink);
  font-size: 13px;
  pointer-events: none;
}
#reader-top > * { pointer-events: auto; }
#reader-top .titles { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#reader-top .work-title { font-family: var(--serif); font-size: 15px; }
#reader-top .chapter-name { color: rgba(241, 240, 234, 0.7); margin-left: 10px; }
#reader-top button { padding: 5px 11px; font-size: 12px; background: rgba(16, 22, 36, 0.5); color: var(--night-ink); border-color: rgba(241, 240, 234, 0.25); }

#text-column {
  position: relative;
  z-index: 10;
  max-width: 760px;
  margin: 0 auto;
  padding: 64px 16px 60vh;
}
#text {
  font-family: var(--serif);
  font-size: var(--font-size);
  line-height: 1.95;
  letter-spacing: 0.03em;
}
#text p { margin: 0 0 0.35em; }
#text .chapter-title {
  font-size: 1.25em;
  font-weight: 500;
  margin: 2.4em 0 1.2em;
  letter-spacing: 0.12em;
}
#text .chapter-title:first-child { margin-top: 0.6em; }
#text .scene-break { text-align: center; opacity: 0.6; margin: 1.6em 0; letter-spacing: 1em; }
#text .end-mark { text-align: center; opacity: 0.6; margin: 3em 0 0; font-size: 0.85em; }

/* ノベルモード：絵を全画面に固定し、本文は半透明の暗い帯の上に流す */
#stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #1b1d22;
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.novel #text-column {
  background: linear-gradient(to right, rgba(16, 22, 36, 0) 0, var(--night) 32px, var(--night) calc(100% - 32px), rgba(16, 22, 36, 0) 100%);
  color: var(--night-ink);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.9);
}
@media (max-width: 700px) {
  body.novel #text-column { background: var(--night); }
}
body.effects-off #stage { display: none; }

/* 挿絵モード：縦持ちのスマホは上4割に絵・下に本文。横向きやPCは左に絵・右に本文 */
body.illust #stage { bottom: auto; height: 40vh; height: 40svh; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); z-index: 15; }
body.illust #text-column { padding-top: calc(40svh + 20px); background: none; box-shadow: none; }
body.illust #reader-top { z-index: 25; }
@media (orientation: landscape) {
  body.illust #stage { right: auto; width: 50vw; height: 100vh; height: 100svh; box-shadow: 6px 0 18px rgba(0, 0, 0, 0.45); }
  body.illust #text-column { margin-left: 50vw; max-width: none; padding: 64px 24px 60vh; }
}
body.illust.effects-off #text-column { padding-top: 64px; margin-left: auto; }
@media (orientation: landscape) { body.illust.effects-off #text-column { margin-left: auto; max-width: 760px; } }
body.effects-off #text-column { background: transparent; box-shadow: none; }

#effects-toggle {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 30;
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 999px;
  background: rgba(16, 22, 36, 0.6);
  color: var(--night-ink);
  border-color: rgba(241, 240, 234, 0.25);
  backdrop-filter: blur(4px);
}
#effects-toggle[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--yamabuki); }
#effects-toggle[aria-pressed="false"] { color: rgba(241, 240, 234, 0.6); }

/* デバッグ表示 */
#debug {
  position: fixed;
  left: 8px;
  bottom: 8px;
  z-index: 40;
  max-width: min(360px, calc(100vw - 120px));
  max-height: 45vh;
  overflow: auto;
  padding: 8px 10px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.78);
  color: #cfe8cf;
  font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
  pointer-events: none;
}
body.debug #text .seg.current { outline: 1px dashed rgba(160, 230, 160, 0.7); outline-offset: 2px; }
body.debug #center-line {
  position: fixed; left: 0; right: 0; top: 50%; height: 0; z-index: 35;
  border-top: 1px dashed rgba(160, 230, 160, 0.35); pointer-events: none;
}

/* 設定画面 */
#settings {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(16, 22, 36, 0.55);
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 24px 16px;
}
#settings .sheet {
  width: 100%; max-width: 560px;
  background: var(--sheet); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 0 rgba(16, 22, 36, 0.25);
  padding: 16px 18px 20px;
}
#settings header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#settings h2 { margin: 0; font-family: var(--hand); font-size: 24px; font-weight: 400; }
#settings fieldset { border: 0; border-top: 1px solid var(--line); margin: 12px 0 0; padding: 12px 0 0; display: flex; flex-direction: column; gap: 12px; }
#settings legend { font-family: var(--hand); font-size: 18px; padding: 0 8px 0 0; }
#settings label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
#settings label.check { flex-direction: row; align-items: flex-start; gap: 8px; line-height: 1.5; }
#settings label.check input { flex: none; margin: 1px 0 0; }
#settings input[type="text"], #settings input[type="url"], #settings input[type="password"], #settings input[type="number"], #settings select {
  width: 100%; padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--field);
}
#settings input[type="checkbox"] { accent-color: var(--yamabuki); width: 18px; height: 18px; }
#settings small, #settings .note { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
#settings .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#settings .result { font-size: 13px; line-height: 1.6; }
#settings .result.ok { color: var(--ok); }
#settings .result.ng { color: var(--danger); }
#settings [data-show].off { display: none; }
#settings .model-list { display: flex; flex-direction: column; gap: 6px; }
#settings .model-list:empty { display: none; }
#settings .model-list button { text-align: left; font-size: 13px; line-height: 1.5; }
#settings .model-list button.current { border-color: var(--accent); }
#settings .model-list .desc { display: block; color: var(--muted); font-size: 12px; }
#reader-top .settings-btn { margin-left: auto; }
#notice {
  position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 45;
  width: min(92vw, 520px); padding: 10px 14px; border-radius: 8px;
  background: var(--sheet); border: 1.5px solid var(--ink); color: var(--ink);
  font-size: 13px; line-height: 1.6; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
}
</style>
</head>
<body>

<!-- 起動画面 -->
<main id="home">
  <figure id="home-hero">
    <canvas id="home-scene" width="960" height="540" aria-hidden="true"></canvas>
    <figcaption id="home-line">朝の座敷には、障子越しに淡い光がさしていた。</figcaption>
  </figure>
  <header>
    <h1>手描き<br>サウンドノベル</h1>
    <p class="lead">小説を開いてスクロールを止めると、いま読んでいる場面が手描きの絵になって動きます。場所も時間も、登場人物の気持ちも、本文から読み取って描き分けます。</p>
  </header>

  <label id="drop-zone" for="file-input">
    <span class="big">本を開く</span>
    <span class="small">ファイルをここに置くか、タップして選んでください。テキスト（.txt）、Markdown（.md）、青空文庫の zip が読めます。文字コードは自動で見分けます。</span>
    <input id="file-input" type="file" accept=".txt,.md,.markdown,.zip,text/plain,text/markdown,application/zip" onchange="JV.App.onFileInput(this)">
  </label>

  <form id="url-form" onsubmit="JV.App.onUrlSubmit(event)">
    <label for="url-input">青空文庫のURLから読む</label>
    <div class="url-row">
      <input id="url-input" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://www.aozora.gr.jp/cards/…/card….html">
      <button type="submit" id="url-submit" class="primary">読み込む</button>
    </div>
  </form>
  <div id="home-error" class="hidden"></div>

  <section id="recent-section" class="hidden">
    <h2>続きから読む</h2>
    <ul class="list" id="recent-list"></ul>
  </section>

  <section id="samples-section">
    <h2>試しに読む</h2>
    <ul class="list" id="sample-list"></ul>
  </section>

  <footer id="home-footer">
    <button type="button" onclick="JV.SettingsUI.open()">設定</button>
    <span id="route-status" class="meta"></span>
  </footer>
</main>

<!-- 読書画面 -->
<div id="reader" class="hidden">
  <div id="stage" aria-hidden="true"></div>
  <header id="reader-top">
    <button type="button" onclick="JV.App.goHome()">← 戻る</button>
    <div class="titles"><span class="work-title" id="work-title"></span><span class="chapter-name" id="chapter-name"></span></div>
    <button type="button" class="settings-btn" onclick="JV.SettingsUI.open()">設定</button>
  </header>
  <div id="text-column">
    <article id="text"></article>
  </div>
  <button id="effects-toggle" type="button" aria-pressed="true" onclick="JV.App.toggleEffects()">演出 オン</button>
  <div id="center-line"></div>
  <div id="notice" class="hidden" role="status"></div>
  <div id="debug" class="hidden"></div>
</div>


<!-- 設定画面 -->
<div id="settings" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <header>
      <h2 id="settings-title">設定</h2>
      <button type="button" onclick="JV.SettingsUI.close()">閉じる</button>
    </header>

    <fieldset>
      <legend>判定（Jev）</legend>
      <label>呼び出し経路
        <select data-key="route" onchange="JV.SettingsUI.change(this)">
          <option value="mock">モック（APIなし・キーワード判定）</option>
          <option value="openrouter">OpenRouter 経由</option>
          <option value="typesafe">TypeSafe 直接</option>
          <option value="relay">中継サーバー（Cloudflare Workers 等）</option>
        </select>
      </label>
      <label data-show="relay">合言葉
        <input data-key="relayPass" type="password" autocomplete="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>中継サーバー（Netlify など）に設定した合言葉。PC の local_server.py で合言葉を設定していなければ空でかまいません。</small>
      </label>
      <label data-show="direct">APIキー
        <input data-key="apiKey" type="password" autocomplete="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>この端末のブラウザ（localStorage）にだけ保存されます。ページを見られる人にはキーが見えるため、共用の端末では使わないでください。</small>
      </label>
      <label data-show="remote">接続先URL
        <input data-key="endpoint" type="text" inputmode="url" autocapitalize="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small id="endpoint-hint"></small>
      </label>
      <label data-show="remote">モデル版
        <input data-key="model" type="text" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>現在 TypeSafe で使えるのは jev-latest です。判定傾向はしきい値に影響するので、版の付いた名前が一覧に出たらそちらに固定してください。</small>
      </label>
      <div class="row" data-show="remote">
        <button type="button" id="models-btn" onclick="JV.SettingsUI.listModels()">使えるモデルを確認</button>
        <span id="models-result" class="result"></span>
      </div>
      <div class="model-list" id="model-list" data-show="remote"></div>
      <label data-show="remote">選択肢のキー
        <select data-key="asciiKeys" onchange="JV.SettingsUI.change(this)">
          <option value="false">日本語（和室・夜 など）</option>
          <option value="true">英字ID（washitsu・night など）</option>
        </select>
      </label>
      <div class="row" data-show="remote">
        <button type="button" id="conn-test" onclick="JV.SettingsUI.test()">接続テスト</button>
        <span id="conn-result" class="result"></span>
      </div>
      <p class="note" id="route-note"></p>
    </fieldset>

    <fieldset data-show="relay">
      <legend>公開の管理（持ち主だけ）</legend>
      <p class="note">合言葉を入れた持ち主だけが操作できます。止めても再デプロイは要りません（クレジットは減りません）。</p>
      <div class="row">
        <button type="button" onclick="JV.SettingsUI.admin('status')">状況を見る</button>
        <button type="button" onclick="JV.SettingsUI.admin('stop')">一般公開を止める</button>
        <button type="button" onclick="JV.SettingsUI.admin('resume')">再開する</button>
      </div>
      <span id="admin-result" class="result"></span>
    </fieldset>

    <fieldset id="work-settings" class="hidden">
      <legend>この作品</legend>
      <label>主人公
        <select id="protagonist-select" onchange="JV.SettingsUI.changeProtagonist(this)"></select>
        <small>冒頭を読んで自動で判定します（途中から読んでも変わりません）。違っていたらここで直せます。作品ごとに保存されます。</small>
      </label>
    </fieldset>

    <fieldset>
      <legend>演出</legend>
      <label>停止判定の待ち時間（ms）
        <input data-key="stopDelay" type="number" min="150" max="2000" step="50" onchange="JV.SettingsUI.change(this)">
      </label>
      <label>絵を替える感度
        <select data-key="sensitivity" onchange="JV.SettingsUI.change(this)">
          <option value="0.75">低い（しきい値 0.75）</option>
          <option value="0.6">普通（しきい値 0.6）</option>
          <option value="0.45">高い（しきい値 0.45）</option>
        </select>
      </label>
      <label>フェード時間の倍率

<script>
'use strict';
const JV = (window.JV = {});

/* =====================================================================
 * 読込部：文字コード判定
 * ===================================================================== */
JV.Encoding = {
  /** ArrayBuffer を文字列に。BOM → UTF-8(厳密) → Shift_JIS / EUC-JP の順に試す */
  decode(buffer) {
    const u8 = new Uint8Array(buffer);
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(u8);
    } catch (_) { /* UTF-8 ではない */ }
    const sjis = new TextDecoder('shift_jis').decode(u8);
    const euc = new TextDecoder('euc-jp').decode(u8);
    const bad = (s) => (s.match(/\uFFFD/g) || []).length;
    return bad(euc) < bad(sjis) ? euc : sjis;
  },
};

/* =====================================================================
 * 読込部：zip（青空文庫の配布形式）から .txt を取り出す
 * ===================================================================== */
JV.Zip = {
  isZip(buffer) {
    const u8 = new Uint8Array(buffer, 0, Math.min(4, buffer.byteLength));
    return u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 0x03 && u8[3] === 0x04;
  },

  /** 中央ディレクトリを読み、最初の .txt を展開して { name, bytes } を返す */
  async extractText(buffer) {
    const dv = new DataView(buffer);
    // 末尾の「中央ディレクトリ終端」を探す（コメント最大 64KB）
    let eocd = -1;
    for (let i = buffer.byteLength - 22; i >= Math.max(0, buffer.byteLength - 22 - 65535); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('zip ファイルとして読めません');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = [];
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip の目次が壊れています');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const nameBytes = new Uint8Array(buffer, p + 46, nameLen);
      entries.push({ method, csize, local, name: JV.Encoding.decode(nameBytes.slice().buffer) });
      p += 46 + nameLen + extraLen + commentLen;
    }
    const e = entries.find((x) => /\.txt$/i.test(x.name));
    if (!e) throw new Error('zip の中にテキストファイル（.txt）がありません');
    const lnameLen = dv.getUint16(e.local + 26, true);
    const lextraLen = dv.getUint16(e.local + 28, true);
    const data = new Uint8Array(buffer, e.local + 30 + lnameLen + lextraLen, e.csize);
    if (e.method === 0) return { name: e.name.split('/').pop(), bytes: data.slice().buffer };
    if (e.method !== 8) throw new Error(`この圧縮方式（${e.method}）の zip には対応していません`);
    if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザは zip の展開に対応していません。展開した .txt を選んでください');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return { name: e.name.split('/').pop(), bytes: await new Response(stream).arrayBuffer() };
  },
};

/* =====================================================================
 * 読込部：青空文庫のURLから読む（同じサイトの /aozora 経由。Netlify の関数か local_server.py）
 * ===================================================================== */
JV.Aozora = {
  /**
   * 受け付けるURL：
   *   図書カード   https://www.aozora.gr.jp/cards/000879/card92.html
   *   zip          https://www.aozora.gr.jp/cards/000879/files/92_ruby_164.zip
   *   XHTML 本文   https://www.aozora.gr.jp/cards/000879/files/92_14545.html（図書カードに読み替える）
   */
  parse(input) {
    const s = String(input || '').trim();
    const m = s.match(/^(?:https?:\/\/)?(?:www\.)?aozora\.gr\.jp\/(cards\/\d{6})\/(card\d+\.html|files\/[A-Za-z0-9_.-]+)(?:[?#].*)?$/i);
    if (!m) return null;
    const [, dir, rest] = m;
    if (/^card\d+\.html$/i.test(rest)) return { card: `${dir}/${rest.toLowerCase()}` };
    if (/\.zip$/i.test(rest)) return { zip: `${dir}/${rest}` };
    const work = rest.match(/^files\/(\d+)_/);
    if (work) return { card: `${dir}/card${work[1]}.html` };
    return null;
  },

  async get(path) {
    let res;
    try {
      res = await fetch(`aozora?path=${encodeURIComponent(path)}`);
    } catch (err) {
      throw new Error('読み込み用の中継に接続できません');
    }
    if (res.status === 404 && !(res.headers.get('Content-Type') || '').includes('json')) {
      throw new Error('URLからの読み込みは、Netlify に置いたページ（または relay/local_server.py）でだけ使えます');
    }
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch (_) { /* そのまま */ }
      throw new Error(res.status === 404 ? `青空文庫にそのファイルがありません（${msg}）` : msg);
    }
    return res.arrayBuffer();
  },

  /** 図書カードから、ルビ付きテキストの zip の場所を探す */
  findZip(cardHtml, cardPath) {
    const dir = cardPath.replace(/[^/]+$/, '');
    const links = [...cardHtml.matchAll(/href\s*=\s*["']([^"']+\.zip)["']/gi)].map((m) => m[1]);
    if (!links.length) return null;
    const pick = links.find((l) => /ruby/i.test(l)) || links[0];
    // ./files/xxx.zip → cards/NNNNNN/files/xxx.zip
    const abs = pick.replace(/^https?:\/\/(www\.)?aozora\.gr\.jp\//, '');
    if (/^cards\//.test(abs)) return abs;
    return (dir + pick.replace(/^\.\//, '')).replace(/[^/]+\/\.\.\//g, '');
  },

  /** URL → { text, name } */
  async load(url) {
    const t = this.parse(url);
    if (!t) throw new Error('青空文庫の図書カードのURLを入れてください（例 https://www.aozora.gr.jp/cards/000879/card92.html）');
    let zipPath = t.zip;
    if (!zipPath) {
      const html = JV.Encoding.decode(await this.get(t.card));
      zipPath = this.findZip(html, t.card);
      if (!zipPath) throw new Error('図書カードにテキストファイル（zip）が見つかりません。まだテキスト版が公開されていない作品かもしれません');
    }
    const zip = await this.get(zipPath);
    const { name, bytes } = await JV.Zip.extractText(zip);
    return { text: JV.Encoding.decode(bytes), name };
  },
};

/* =====================================================================
 * 正規化部：3形式を「段落の配列＋章の区切り」に揃える
 *
 * 中間表現は行トークンの配列：
 *   { t: 'text', s }   本文の行
 *   { t: 'blank' }     空行
 *   { t: 'heading', s } 章見出し
 *   { t: 'break' }     場面区切り（◇・＊・水平線など）
 * ===================================================================== */
JV.Parser = {
  LONG_PARAGRAPH: 400,   // これを超える段落は句点で分けて判定する
  UNIT_MIN: 160,         // 判定単位の目安の下限（短い段落は束ねる）
  UNIT_MAX: 400,         // 判定単位の目安の上限
  CONTEXT_CHARS: 300,    // 場面判定に添える「直前の文脈」の字数

  /** 場面区切りの記号だけの行か */
  isSeparator(line) {
    const s = line.replace(/[\s　]/g, '');
    if (!s || s.length > 20) return false;
    if (!/^[◇◆＊*※☆★○●□■×・\-─―—〜~＃#]+$/.test(s)) return false;
    // 「・・・」や短いダッシュだけの行は本文（沈黙の表現など）とみなす
    return !/^・+$/.test(s) && !/^[―—─-]{1,2}$/.test(s);
  },

  /** 青空文庫・Web小説で共通に使われるルビ記法を外す（親文字だけ残す） */
  stripRuby(s) {
    return s.replace(/《[^》\n]*》/g, '').replace(/｜/g, '');
  },

  detectFormat(name, text) {
    if (/\.(md|markdown)$/i.test(name)) return 'md';
    if (/^-{20,}\s*$/m.test(text) && /《[^》\n]+》|［＃/.test(text)) return 'aozora';
    if (/［＃[^］\n]*］/.test(text) || /^底本：/m.test(text)) return 'aozora';
    return 'txt';
  },

  parse(rawText, fileName = '') {
    const text = rawText.replace(/\r\n?/g, '\n').replace(/[\u2028\u2029]/g, '\n');
    const format = this.detectFormat(fileName, text);
    const base = fileName.replace(/\.[^.]+$/, '');
    let r;
    if (format === 'aozora') r = this.tokensAozora(text);
    else if (format === 'md') r = this.tokensMarkdown(text);
    else r = this.tokensTxt(text);
    const doc = this.build(r.tokens, r.mode);
    doc.format = format;
    doc.title = r.title || base || '無題';
    doc.author = r.author || '';
    doc.units = this.buildUnits(doc);
    return doc;
  },

  /* ---------- 青空文庫 ---------- */
  tokensAozora(text) {
    let lines = text.split('\n');
    let title = '', author = '';

    // 冒頭の凡例（------- で囲まれた部分）と、その前の作品名・著者名
    const d1 = lines.findIndex((l) => /^-{20,}\s*$/.test(l));
    if (d1 >= 0) {
      const d2 = lines.findIndex((l, i) => i > d1 && /^-{20,}\s*$/.test(l));
      const head = lines.slice(0, d1).map((l) => l.trim()).filter(Boolean);
      title = head[0] || '';
      if (head.length > 1) author = head[head.length - 1];
      lines = lines.slice((d2 >= 0 ? d2 : d1) + 1);
    }
    // 末尾の「底本：」以降
    const tail = lines.findIndex((l) => /^底本[：:]/.test(l));
    if (tail >= 0) lines = lines.slice(0, tail);

    const tokens = [];
    let inHeadingBlock = false;
    let headingBuf = [];
    for (const raw of lines) {
      let line = raw.replace(/\s+$/, '');

      // ［＃ここから中見出し］ … ［＃ここで中見出し終わり］
      if (/［＃ここから[^］]*見出し］/.test(line)) { inHeadingBlock = true; headingBuf = []; continue; }
      if (inHeadingBlock) {
        if (/［＃ここで[^］]*見出し終わり］/.test(line)) {
          inHeadingBlock = false;
          tokens.push({ t: 'heading', s: this.cleanAozoraLine(headingBuf.join('　')).trim() });
          continue;
        }
        headingBuf.push(line);
        continue;
      }

      // 改ページは場面区切りとして扱う
      if (/［＃改(ページ|丁|段|見開き)］/.test(line) && !this.cleanAozoraLine(line).trim()) {
        tokens.push({ t: 'break' });
        continue;
      }

      // 見出し：「○○」は中見出し ／ ［＃中見出し］○○［＃中見出し終わり］
      let heading = null;
      let m = line.match(/［＃「([^」]+)」は[^］]*見出し］/);
      if (m) heading = m[1];
      m = line.match(/［＃(?:同行|窓)?([大中小])見出し］(.+?)［＃(?:同行|窓)?\1見出し終わり］/);
      if (m) heading = m[2];
      if (heading !== null) {
        tokens.push({ t: 'heading', s: this.cleanAozoraLine(heading).trim() });
        continue;
      }

      const hadContent = line.trim() !== '';
      line = this.cleanAozoraLine(line);
      if (line.replace(/[\s　]/g, '') === '') {
        // 注記だけの行は何もない行として捨てる。元から空の行は空行
        if (!hadContent) tokens.push({ t: 'blank' });
        continue;
      }
      if (this.isSeparator(line)) { tokens.push({ t: 'break' }); continue; }
      tokens.push({ t: 'text', s: line });
    }
    return { tokens, mode: 'line', title, author };
  },

  /** 外字注記・ルビ・その他の［＃…］注記を除く */
  cleanAozoraLine(line) {
    let s = line;
    // 外字：Unicode が書かれていればその字に、なければ〓
    s = s.replace(/※［＃[^］]*］/g, (a) => {
      const u = a.match(/U\+([0-9A-Fa-f]{4,6})/);
      return u ? String.fromCodePoint(parseInt(u[1], 16)) : '〓';
    });
    s = this.stripRuby(s);
    s = s.replace(/［＃[^］]*］/g, '');
    // アクセント分解記法〔…〕は括弧だけ外す
    s = s.replace(/〔([^〕]*)〕/g, (a, inner) => (/[A-Za-z]/.test(inner) ? inner : a));
    return s;
  },

  /* ---------- プレーンテキスト ---------- */
  tokensTxt(text) {
    let lines = text.split('\n').map((l) => l.replace(/\s+$/, ''));
    let title = '', author = '';

    // 冒頭の短い1〜2行＋空行 は作品名・著者名とみなす
    const firstBlank = lines.findIndex((l, i) => i > 0 && l.trim() === '');
    if (firstBlank > 0 && firstBlank <= 2) {
      const head = lines.slice(0, firstBlank).map((l) => l.trim());
      if (head.every((h) => h.length > 0 && h.length <= 30 && !/[。「」]/.test(h))) {
        title = head[0];
        if (head[1]) author = head[1];
        lines = lines.slice(firstBlank);
      }
    }

    // 1行1段落の書き方か、途中で折り返して空行で段落を区切る書き方かを判定する。
    // 空行を挟まずに続く行の多くが字下げ・かぎ括弧で始まるなら、それぞれが段落の頭（1行1段落）
    let cont = 0, heads = 0;
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim() || !lines[i - 1].trim()) continue;
      cont++;
      if (/^[\s　「『（(【〈《]/.test(lines[i])) heads++;
    }
    const mode = cont > 0 && heads / cont < 0.5 ? 'block' : 'line';

    const tokens = [];
    for (const raw of lines) {
      const line = this.stripRuby(raw);
      if (line.trim() === '') { tokens.push({ t: 'blank' }); continue; }
      if (this.isSeparator(line)) { tokens.push({ t: 'break' }); continue; }
      if (this.isTxtHeading(line)) { tokens.push({ t: 'heading', s: line.trim().replace(/^[　]+/, '') }); continue; }
      tokens.push({ t: 'text', s: line });
    }
    return { tokens, mode, title, author };
  },

  isTxtHeading(line) {
    const s = line.trim().replace(/^[　]+/, '');
    if (s.length > 40 || /[。、「」]$/.test(s)) return false;
    return /^(第[一二三四五六七八九十百千〇零0-9０-９]+[章話節部回幕編]|序章|終章|序幕|終幕|プロローグ|エピローグ|Prologue|Epilogue|Chapter\s*\d+)([\s　:：].*)?$/i.test(s);
  },

  /* ---------- Markdown ---------- */
  tokensMarkdown(text) {
    let lines = text.split('\n');
    let title = '', author = '';

    // YAML front matter
    if (/^---\s*$/.test(lines[0] || '')) {
      const end = lines.findIndex((l, i) => i > 0 && /^(---|\.\.\.)\s*$/.test(l));
      if (end > 0) {
        for (const l of lines.slice(1, end)) {
          const m = l.match(/^(title|author)\s*:\s*["']?(.*?)["']?\s*$/);
          if (m && m[1] === 'title') title = m[2];
          if (m && m[1] === 'author') author = m[2];
        }
        lines = lines.slice(end + 1);
      }
    }

    const tokens = [];
    let inFence = false;
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i].replace(/\s+$/, '');
      if (/^\s*(```|~~~)/.test(raw)) { inFence = !inFence; continue; }
      if (inFence) { if (raw.trim()) tokens.push({ t: 'text', s: raw }); else tokens.push({ t: 'blank' }); continue; }
      if (raw.trim() === '') { tokens.push({ t: 'blank' }); continue; }
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(raw)) { tokens.push({ t: 'break' }); continue; }
      const h = raw.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (h) { tokens.push({ t: 'heading', s: this.mdInline(h[2]), level: h[1].length }); continue; }
      // Setext 見出し（=== のみ。--- は水平線として扱う）
      if (/^=+\s*$/.test(raw) && tokens.length && tokens[tokens.length - 1].t === 'text') {
        const prev = tokens.pop();
        tokens.push({ t: 'heading', s: prev.s.trim(), level: 1 });
        continue;
      }
      if (/^\s*<!--.*-->\s*$/.test(raw)) continue;
      let s = raw
        .replace(/^\s{0,3}>\s?/, '')                 // 引用
        .replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '');     // 箇条書き
      s = this.mdInline(s);
      if (s.trim() === '') continue;
      if (this.isSeparator(s)) { tokens.push({ t: 'break' }); continue; }
      tokens.push({ t: 'text', s });
    }

    // 先頭の # 見出しが1つだけで作品名と同じ（または作品名がない）なら作品名として扱う
    const h1s = tokens.filter((t) => t.t === 'heading' && t.level === 1);
    const firstContent = tokens.find((t) => t.t !== 'blank');
    if (h1s.length === 1 && firstContent === h1s[0] && (!title || title === h1s[0].s)) {
      title = h1s[0].s;
      tokens.splice(tokens.indexOf(h1s[0]), 1);
    }
    return { tokens, mode: 'block', title, author };
  },

  mdInline(s) {
    return this.stripRuby(s)
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')                 // 画像
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')               // リンク
      .replace(/\[([^\]]+)\]\[[^\]]*\]/g, '$1')              // 参照リンク
      .replace(/<\/?[A-Za-z][^>]*>/g, '')                    // HTMLタグ
      .replace(/(\*\*|__)(.+?)\1/g, '$2')                    // 強調
      .replace(/(\*|_)(?=\S)(.+?)(?<=\S)\1/g, '$2')
      .replace(/~~(.+?)~~/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g, '$1')
      .replace(/^\s+(?=\S)/, (sp) => (sp.includes('　') ? sp : ''));
  },

  /* ---------- 行トークン → 段落・章 ---------- */
  build(tokens, mode) {
    const paragraphs = [];
    const chapters = [];
    let blankRun = 0;
    let pendingBreak = false;
    let buf = [];
    let chapter = -1;

    const ensureChapter = () => {
      if (chapter < 0) { chapters.push({ title: '', start: paragraphs.length }); chapter = 0; }
    };
    const pushPara = (s) => {
      ensureChapter();
      const firstInChapter = chapters[chapter].start === paragraphs.length;
      paragraphs.push({ i: paragraphs.length, text: s, chapter, breakBefore: pendingBreak && !firstInChapter });
      pendingBreak = false;
    };
    const flush = () => {
      if (!buf.length) return;
      // 行末が英数字なら空白で、和文ならそのまま繋ぐ
      let s = buf[0];
      for (let k = 1; k < buf.length; k++) s += (/[A-Za-z0-9,.;:!?]$/.test(s) ? ' ' : '') + buf[k].replace(/^\s+/, '');
      pushPara(s);
      buf = [];
    };

    for (const tk of tokens) {
      if (tk.t === 'blank') {
        blankRun++;
        if (mode === 'block') flush();
        if (blankRun >= 2 && paragraphs.length) pendingBreak = true;
        continue;
      }
      blankRun = 0;
      if (tk.t === 'break') { flush(); if (paragraphs.length) pendingBreak = true; continue; }
      if (tk.t === 'heading') {
        flush();
        chapters.push({ title: tk.s, start: paragraphs.length });
        chapter = chapters.length - 1;
        pendingBreak = false;
        continue;
      }
      if (mode === 'block') buf.push(tk.s);
      else pushPara(tk.s);
    }
    flush();
    // 段落を持たない章（見出しが連続した場合など）は、次の章の見出しと統合する
    const merged = [];
    for (let c = 0; c < chapters.length; c++) {
      const ch = chapters[c];
      const next = chapters[c + 1];
      const end = next ? next.start : paragraphs.length;
      if (end === ch.start && next) { next.title = ch.title && next.title ? `${ch.title}　${next.title}` : (ch.title || next.title); continue; }
      if (end === ch.start) continue;
      merged.push(ch);
    }
    const remap = new Map();
    merged.forEach((ch, idx) => remap.set(chapters.indexOf(ch), idx));
    for (const p of paragraphs) p.chapter = remap.has(p.chapter) ? remap.get(p.chapter) : p.chapter;
    merged.forEach((ch, idx) => { ch.i = idx; });
    return { paragraphs, chapters: merged };
  },

  /* ---------- 判定単位 ---------- */
  /** 単位の中のセリフ（「」の中身）。吹き出しの候補。多すぎるときは先頭から 8 つまで */
  quotes(text) { return this.quoteItems(text).map((q) => q.text); },
  /**
   * 吹き出しの候補のセリフ（最大 4 つ、本文の順）。前後の地の文（話し手の手がかり）も付ける。
   * 「」は会話、『』は通知・手紙・電話など。5 つ以上あるときは、！？・長さ・単位の最後のほうを優先して選ぶ
   */
  QUOTE_MAX: 4,
  quoteItems(text) {
    const src = String(text || ''), all = [];
    for (const m of src.matchAll(/「([^「」]{1,120})」|『([^『』]{1,120})』/g)) {
      const t = (m[1] || m[2]).replace(/\s+/g, ' ').trim();
      if (!t) continue;
      // 行の頭から始まるものだけをセリフとみなす（地の文の中の「明日の私」のような名前・題名は除く）
      const prevCh = m.index > 0 ? src[m.index - 1] : '\n';
      if (!/[\n\r 　]/.test(prevCh)) continue;
      const clip = (s) => s.replace(/「[^「」]*」|『[^『』]*』/g, '…').replace(/\s+/g, ' ').trim();
      const before = clip(src.slice(Math.max(0, m.index - 60), m.index)).slice(-40);
      const after = clip(src.slice(m.index + m[0].length, m.index + m[0].length + 60)).slice(0, 40);
      all.push({ text: t, before, after, written: !!m[2], i: all.length });
    }
    if (all.length <= this.QUOTE_MAX) return all;
    const score = (q) => (q.text.match(/[！!？?]/g) || []).length + (q.text.length >= 8 ? 1 : 0) + q.i / all.length;
    return all.slice().sort((a, b) => score(b) - score(a)).slice(0, this.QUOTE_MAX).sort((a, b) => a.i - b.i);
  },
  isDialogue(s) {
    const t = s.replace(/^[\s　]+/, '').replace(/[\s　]+$/, '');
    return /^[「『（(]/.test(t) && /[」』）)]$/.test(t);
  },

  /** 長い段落を句点で分ける（表示は段落のまま、判定だけ細かくする） */
  splitLong(text) {
    if (text.length <= this.LONG_PARAGRAPH) return [text];
    const sentences = text.match(/[^。！？!?]*[。！？!?]+[」』）)]*|[^。！？!?]+$/g) || [text];
    // 均等な長さに分ける（400字＋少し、のように極端に短い切れ端を作らない）
    const target = text.length / Math.ceil(text.length / this.LONG_PARAGRAPH);
    const chunks = [];
    let cur = '';
    for (const s of sentences) {
      if (cur && (cur.length >= target || cur.length + s.length > this.LONG_PARAGRAPH)) { chunks.push(cur); cur = ''; }
      cur += s;
    }
    if (cur) chunks.push(cur);
    return chunks;
  },

  /**
   * 段落 → 表示用の断片（segment）→ 判定単位（unit）
   * Jev に渡す長さをそろえるため、判定単位はおおむね UNIT_MIN〜UNIT_MAX 字にまとめる。
   * - 短い段落は後ろとつなげて UNIT_MIN 字に届くまで束ねる
   * - 会話文は直前の地の文と同じ単位に入れる（会話だけの単位をなるべく作らない）
   * - 章と場面区切りはまたがない
   */
  buildUnits(doc) {
    const segments = [];
    for (const p of doc.paragraphs) {
      const parts = this.splitLong(p.text);
      p.segs = [];
      for (const part of parts) {
        const seg = { i: segments.length, para: p.i, text: part, len: part.replace(/^[\s\u3000]+/, '').length, dialogue: parts.length === 1 && this.isDialogue(part) };
        p.segs.push(seg.i);
        segments.push(seg);
      }
    }
    doc.segments = segments;

    // 章・場面区切りで区切った「段」ごとにまとめる
    const groups = [];
    for (const seg of segments) {
      const p = doc.paragraphs[seg.para];
      const last = groups[groups.length - 1];
      const startsNew = !last || last.chapter !== p.chapter || (p.breakBefore && p.segs[0] === seg.i);
      if (startsNew) groups.push({ chapter: p.chapter, segs: [seg] });
      else last.segs.push(seg);
    }

    const MIN = this.UNIT_MIN, MAX = this.UNIT_MAX;
    const units = [];
    for (const g of groups) {
      const local = [];
      let cur = null;
      for (const seg of g.segs) {
        const fits = cur && cur.len + seg.len <= MAX;
        const join = cur && (
          (cur.len < MIN && fits) ||                         // まだ短い
          (seg.dialogue && fits) ||                          // 会話は直前と一緒に
          (cur.dialogueOnly && cur.len + seg.len <= MAX * 1.5) // 会話だけの単位を残さない
        );
        if (join) {
          cur.segs.push(seg); cur.len += seg.len; cur.dialogueOnly = cur.dialogueOnly && seg.dialogue;
        } else {
          cur = { segs: [seg], len: seg.len, dialogueOnly: seg.dialogue, chapter: g.chapter };
          local.push(cur);
        }
      }
      // 段の最後が短すぎる、または会話だけなら、一つ前にまとめる
      const tail = local[local.length - 1];
      const prev = local[local.length - 2];
      if (tail && prev && (tail.len < MIN / 2 || tail.dialogueOnly) && prev.len + tail.len <= MAX + MIN / 2) {
        prev.segs.push(...tail.segs); prev.len += tail.len;
        local.pop();
      }
      for (const u of local) {
        const unit = { i: units.length, segs: u.segs.map((x) => x.i), chapter: u.chapter };
        u.segs.forEach((x) => { x.unit = unit.i; });
        units.push(unit);
      }
    }

    for (const u of units) {
      u.text = u.segs.map((s) => segments[s].text.replace(/^[\s　]+/, '')).join('\n');
      u.paraStart = segments[u.segs[0]].para;
      u.paraEnd = segments[u.segs[u.segs.length - 1]].para;
    }
    return units;
  },
};

/* =====================================================================
 * 設定（localStorage に保存。画面はステップ5）
 * ===================================================================== */
JV.Settings = {
  KEY: 'jev-viewer-settings',
  DEFAULTS: {
    route: 'mock',         // 呼び出し経路：mock | typesafe | openrouter | relay
    routeChosen: false,    // 経路を自分で選んだか（選んでいなければ、一般公開中の中継を自動で使う）
    apiKey: '',            // APIキー（この端末の localStorage にだけ保存）
    relayPass: '',         // 中継サーバーの合言葉（Netlify の RELAY_PASSPHRASE と同じもの）
    endpoint: '',          // 接続先URLの上書き（空なら経路ごとの既定）
    model: 'jev-latest',   // モデル版。TypeSafe で使えるのは現状 jev-latest のみ（版付きの名前が出たら固定する）
    asciiKeys: false,      // 選択肢のキーを英字IDで送る（日本語キーが通らない場合）
    stopDelay: 400,        // 停止判定の待ち時間(ms)
    sensitivity: 0.6,      // 絵を替える感度（しきい値）。普通=0.6
    fadeScale: 1.0,        // フェード時間の倍率
    silhouettes: true,     // 人物を描く
    bubbles: true,         // セリフの吹き出し
    hideNarrator: false,   // 一人称の作品で主人物（語り手）を出さず相手だけを描く
    effects: true,         // 演出オン／オフ
    debug: false,          // デバッグ表示
    displayMode: 'illust', // 表示モード：illust（挿絵と本文を分ける・既定）| novel（絵を全画面に）
    writingMode: 'horizontal', // 横書き（縦書きは拡張）
    fontSize: 18,          // 文字サイズ(px)
  },
  values: null,

  load() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (_) { saved = {}; }
    this.values = { ...this.DEFAULTS, ...saved };
    // 以前の既定 jev-1.13 は TypeSafe では使えない名前だった（Unknown model）
    if (this.values.model === 'jev-1.13') this.values.model = this.DEFAULTS.model;
    const q = new URLSearchParams(location.search);
    if (q.has('debug')) this.values.debug = q.get('debug') !== '0';
    return this.values;
  },
  get(k) { if (!this.values) this.load(); return this.values[k]; },
  /**
   * 実際に使う呼び出し経路。経路を自分で選んでいない人は、サイトの中継が一般公開中なら
   * 中継（本物の Jev）、そうでなければモックを使う
   */
  route() {
    const stored = this.get('route');
    const pub = JV.App && JV.App.publicRelay;
    if (!this.get('routeChosen') && stored === 'mock' && pub && pub.open) return 'relay';
    return stored;
  },
  set(k, v) {
    if (!this.values) this.load();
    this.values[k] = v;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.values)); } catch (_) { /* 保存できなくても動かす */ }
  },
};

/* =====================================================================
 * 設定画面
 * ===================================================================== */
JV.SettingsUI = {
  // 変えたら判定をやり直す項目
  JUDGE_KEYS: new Set(['route', 'apiKey', 'relayPass', 'endpoint', 'model', 'asciiKeys']),
  dirtyJudge: false,

  open() {
    this.dirtyJudge = false;
    this.fill();
    document.getElementById('settings').classList.remove('hidden');
  },

  close() {
    document.getElementById('settings').classList.add('hidden');
    document.getElementById('conn-result').textContent = '';
    document.getElementById('data-result').textContent = '';
    JV.App.onSettingsClosed(this.dirtyJudge, this.dirtyScene);
    this.dirtyScene = false;
  },

  /** 読書中なら「この作品」の欄（主人公）を出す */
  fillWork() {
    const app = JV.App;
    const reading = app.doc && !document.getElementById('reader').classList.contains('hidden');
    document.getElementById('work-settings').classList.toggle('hidden', !reading);
    if (!reading) return;
    const sel = document.getElementById('protagonist-select');
    const judged = JV.Schema.byId('work', 'protagonist', app.work && app.work.protagonist);
    sel.textContent = '';
    const add = (value, label) => { const o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o); };
    add('', `自動（判定：${judged ? judged.label : '判定中'}）`);
    for (const o of JV.Schema.options('work', 'protagonist')) if (o.id !== 'unknown') add(o.id, o.label);
    sel.value = app.protagonistOverride || '';
  },

  async changeProtagonist(el) {
    await JV.App.setProtagonist(el.value);
    this.dirtyScene = true;
  },

  fill() {
    this.fillWork();
    for (const el of document.querySelectorAll('#settings [data-key]')) {
      const v = el.dataset.key === 'route' ? JV.Settings.route() : JV.Settings.get(el.dataset.key);
      if (el.type === 'checkbox') el.checked = !!v;
      else if (el.tagName === 'SELECT') {
        el.value = String(v);
        if (el.selectedIndex < 0) el.value = el.options[0].value;
      } else el.value = v == null ? '' : v;
    }
    this.refreshRoute();
  },

  change(el) {
    const key = el.dataset.key;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') {
      v = Number(el.value);
      const min = Number(el.min), max = Number(el.max);
      if (!Number.isFinite(v)) v = JV.Settings.DEFAULTS[key];
      v = Math.min(max, Math.max(min, v));
      el.value = v;
    } else if (key === 'sensitivity' || key === 'fadeScale') v = Number(el.value);
    else if (key === 'asciiKeys') v = el.value === 'true';
    else v = el.value.trim();
    JV.Settings.set(key, v);
    if (key === 'route') JV.Settings.set('routeChosen', true);
    if (this.JUDGE_KEYS.has(key)) { this.dirtyJudge = true; document.getElementById('conn-result').textContent = ''; }
    if (key === 'route') this.refreshRoute();
    JV.App.applySettings();
  },

  refreshRoute() {
    const route = JV.Settings.route();
    const remote = route !== 'mock';
    document.querySelectorAll('#settings [data-show="remote"]').forEach((e) => e.classList.toggle('off', !remote));
    document.querySelectorAll('#settings [data-show="direct"]').forEach((e) => e.classList.toggle('off', !remote || route === 'relay'));
    document.querySelectorAll('#settings [data-show="relay"]').forEach((e) => e.classList.toggle('off', route !== 'relay'));
    const def = (JV.Adapters.remote.ROUTES[route] || {}).url;
    const ep = document.querySelector('#settings [data-key="endpoint"]');
    ep.placeholder = def;
    document.getElementById('endpoint-hint').textContent = route === 'relay'
      ? '空欄なら、このページを配信しているサーバーの /v1/systemone（Netlify の関数や relay/local_server.py）。別の場所の中継（Cloudflare Workers など）を使うときだけURLを入れます。'
      : `空欄なら既定${route === 'openrouter' ? '（仮・要確認）' : ''}：${def}`;
    const notes = {
      mock: 'APIを呼ばず、キーワード一致の偽の判定で動きます。画面と演出の確認用です。',
      openrouter: 'OpenRouter での Jev の指定方法とブラウザからの直接呼び出し（CORS）は未確認です。まず「接続テスト」で確かめてください。通らない場合は中継サーバーを使います。',
      typesafe: 'TypeSafe の API（/v1/systemone）を直接呼びます。新規登録は停止中のため既存アカウント向けです。',
      relay: '中継サーバー経由で呼びます。APIキーは中継側に置きます。Netlify に置いたこのページなら、合言葉を入れるだけで使えます（PC で動かすなら relay/local_server.py）。',
    };
    document.getElementById('route-note').textContent = notes[route] || '';
  },

  /** 小さな作品判定を1回送って、届くか・形式が合うかを確かめる */
  async test() {
    const out = document.getElementById('conn-result');
    const btn = document.getElementById('conn-test');
    const route = JV.Settings.route();
    if (route === 'mock') { out.className = 'result'; out.textContent = 'モックでは不要です。'; return; }
    if (JV.Judge.adapter() !== JV.Adapters.remote) {
      out.className = 'result ng';
      out.textContent = 'APIキーを入力してください。';
      return;
    }
    btn.disabled = true;
    out.className = 'result';
    out.textContent = '送信中…';
    const t0 = performance.now();
    try {
      const qs = JV.Judge.questions('work');
      const ans = await JV.Adapters.remote.judge('汽車が停車場に着いた。私は外套の襟を立てて、雪の降る往来へ出た。', qs);
      const ms = Math.round(performance.now() - t0);
      const era = ans.era, bad = [];
      for (const k of Object.keys(qs)) if (!ans[k] || !(ans[k].choice in qs[k].criteria)) bad.push(k);
      if (bad.length) throw new JV.Adapters.RemoteError(`応答は届きましたが、形式が想定と違います（${bad.join(', ')}）`, 'format', ans);
      out.className = 'result ok';
      out.textContent = `接続できました（${ms}ms）。era = ${era.choice}（${Number(era.confidence).toFixed(2)}）`;
    } catch (err) {
      const hint = {
        network: '→ CORS で拒否されている場合は、中継サーバー経由に切り替えてください。',
        auth: '→ APIキーと経路の組み合わせを確認してください。',
        notfound: '→ 接続先URLまたはこの経路での Jev の呼び方が違う可能性があります。',
        format: '→ 経路の応答形式が TypeSafe と違います。デバッグ表示で中身を確認してください。',
        rate: '→ 少し待ってから再試行してください。',
      }[err.kind] || '';
      const msg = err.message || '';
      let relayHint = '';
      if (route === 'relay') {
        if (err.status === 404 || err.status === 405 || err.status === 501) relayHint = '→ このページは中継サーバーから配信されていないようです。Netlify のURL（または local_server.py が表示したURL）で開き直してください。';
        else if (err.status === 403 && (/passphrase/.test(msg) || (err.detail && ['closed', 'stopped', 'limit'].includes(err.detail.code)))) {
          relayHint = (JV.Settings.get('relayPass') || '').trim()
            ? '→ 合言葉が違います。Netlify の RELAY_PASSPHRASE と同じものを入れてください。'
            : `→ いまは一般公開していません（${JV.App.closedLabel(err.detail && err.detail.code)}）。持ち主は合言葉を入れてください。`;
        }
        else if (err.status === 500 && /not configured/.test(msg)) relayHint = '→ Netlify の環境変数 TYPESAFE_API_KEY と RELAY_PASSPHRASE を設定し、再デプロイしてください。';
        else if (err.kind === 'html' && (err.status === 401 || err.status === 403)) relayHint = '→ Netlify の Project configuration → Access & security で、サイトの保護（Visitor access・Password protection）をオフにしてください。プレビュー（deploy-preview-…）は本番以外の保護で止められることがあります。';
        else if (err.status === 401) relayHint = '→ 中継に設定した TypeSafe の APIキーが通っていません。キーを確認してください。';
      }
      if (/unknown model/i.test(msg)) relayHint = '→ このモデル名は使えません。「使えるモデルを確認」を押して、一覧から選んでください。';
      out.className = 'result ng';
      out.textContent = `失敗：${err.message} ${relayHint || hint}`;
      if (err.detail) console.warn('[jev-viewer] connection test', err.detail);
    } finally {
      btn.disabled = false;
    }
  },

  async listModels() {
    const out = document.getElementById('models-result');
    const box = document.getElementById('model-list');
    const btn = document.getElementById('models-btn');
    box.textContent = '';
    if (JV.Judge.adapter() !== JV.Adapters.remote) { out.className = 'result ng'; out.textContent = 'APIキーを入力してください。'; return; }
    btn.disabled = true;
    out.className = 'result';
    out.textContent = '取得中…';
    try {
      const models = await JV.Adapters.remote.listModels();
      if (!models.length) { out.textContent = '一覧が空でした。'; return; }
      out.className = 'result ok';
      out.textContent = `${models.length} 件。押すとモデル版に入ります（版の付いた名前を選ぶのがおすすめ）。`;
      const current = JV.Settings.get('model');
      for (const m of models) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = m.name === current ? 'current' : '';
        b.textContent = m.name + (m.release_date ? `（${m.release_date}）` : '');
        if (m.description) { const d = document.createElement('span'); d.className = 'desc'; d.textContent = m.description; b.appendChild(d); }
        b.onclick = () => {
          const input = document.querySelector('#settings [data-key="model"]');
          input.value = m.name;
          this.change(input);
          box.querySelectorAll('button').forEach((x) => x.classList.toggle('current', x === b));
          document.getElementById('conn-result').textContent = '';
        };
        box.appendChild(b);
      }
    } catch (err) {
      out.className = 'result ng';
      out.textContent = `失敗：${err.message}`;
    } finally {
      btn.disabled = false;
    }
  },

  /** 一般公開の状況・停止・再開（持ち主の合言葉が必要） */
  async admin(action) {
    const out = document.getElementById('admin-result');
    const pass = (JV.Settings.get('relayPass') || '').trim();
    if (!pass) { out.className = 'result ng'; out.textContent = '上の「合言葉」を入れてください。'; return; }
    out.className = 'result';
    out.textContent = '確認中…';
    try {
      const res = await fetch('v1/relay-admin', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Relay-Passphrase': pass }, body: JSON.stringify({ action }) });
      let st = {};
      try { st = await res.json(); } catch (_) { /* 下で扱う */ }
      if (res.status === 404) throw new Error('このページには公開の管理がありません（Netlify のページで操作してください）');
      if (res.status === 403) throw new Error('合言葉が違います');
      if (!res.ok) throw new Error(st.error || `HTTP ${res.status}`);
      JV.App.publicRelay = { open: st.open, reason: st.reason, until: st.until };
      JV.App.applySettings();
      const state = st.open ? '公開中' : JV.App.closedLabel(st.reason);
      out.className = `result ${st.open ? 'ok' : ''}`;
      out.textContent = `一般公開：${state}（期限 ${st.until || '未設定'}）・今日 ${st.used} / ${st.limit} 回${st.stopped ? '・停止スイッチ：オン' : ''}`;
    } catch (err) {
      out.className = 'result ng';
      out.textContent = `失敗：${err.message}`;
    }
  },

  async clearCache() {
    await JV.Store.clearJudgments();
    JV.Judge.memory.clear();
    document.getElementById('data-result').textContent = '消去しました。';
    this.dirtyJudge = true;
  },

  resetAll() {
    const keep = { apiKey: JV.Settings.get('apiKey') };
    JV.Settings.values = { ...JV.Settings.DEFAULTS, ...keep };
    JV.Settings.set('apiKey', keep.apiKey);
    this.dirtyJudge = true;
    this.fill();
    JV.App.applySettings();
    document.getElementById('data-result').textContent = '既定に戻しました（APIキーは残しています）。';
  },
};

/* =====================================================================
 * 停止検知部：スクロールが一定時間止まったら、画面の縦中央にかかる断片を特定する
 * ===================================================================== */
JV.StopDetector = {
  io: null,
  atCenter: new Set(),
  timer: 0,
  segEls: [],
  lastUnit: null,
  onStop: null,
  onScrollBound: null,

  attach(root, onStop) {
    this.detach();
    this.onStop = onStop;
    this.segEls = Array.from(root.querySelectorAll('.seg'));
    this.ratio = null;
    this.refresh();
    this.onScrollBound = () => this.arm();
    this.onResizeBound = () => { this.refresh(); this.arm(); };
    window.addEventListener('scroll', this.onScrollBound, { passive: true });
    window.addEventListener('scrollend', this.onScrollBound);
    window.addEventListener('resize', this.onResizeBound);
    this.arm();
  },

  /**
   * 本文が見えている範囲の縦中央（px）。ノベルモードは画面の中央、
   * 挿絵モードの縦持ちは「絵の下端〜画面の下端」の中央
   */
  centerY() {
    const h = window.innerHeight;
    const b = document.body;
    if (b.classList.contains('illust') && !b.classList.contains('effects-off') && h > window.innerWidth) {
      const stageBottom = document.getElementById('stage').getBoundingClientRect().bottom;
      return (stageBottom + h) / 2;
    }
    return h / 2;
  },

  /** 高さ0の「中央線」に交差している断片を常に把握しておく（中央線の位置が変わったら作り直す） */
  refresh() {
    if (!this.segEls.length) return;
    const ratio = Math.min(0.95, Math.max(0.05, this.centerY() / window.innerHeight));
    const line = document.getElementById('center-line');
    if (line) line.style.top = `${(ratio * 100).toFixed(2)}%`;
    if (this.io && Math.abs(ratio - this.ratio) < 0.005) return;
    if (this.io) this.io.disconnect();
    this.atCenter.clear();
    this.ratio = ratio;
    const top = (ratio * 100).toFixed(2), bottom = ((1 - ratio) * 100).toFixed(2);
    this.io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) this.atCenter.add(e.target);
        else this.atCenter.delete(e.target);
      }
    }, { rootMargin: `-${top}% 0px -${bottom}% 0px`, threshold: 0 });
    this.segEls.forEach((el) => this.io.observe(el));
  },

  detach() {
    if (this.io) this.io.disconnect();
    this.io = null;
    this.atCenter.clear();
    clearTimeout(this.timer);
    if (this.onScrollBound) {
      window.removeEventListener('scroll', this.onScrollBound);
      window.removeEventListener('scrollend', this.onScrollBound);
      window.removeEventListener('resize', this.onResizeBound);
    }
    this.segEls = [];
    this.onScrollBound = null;
    this.lastUnit = null;
  },

  /** スクロールのたびにタイマーを掛け直す。動いている間は発火しない */
  arm() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.fire(), JV.Settings.get('stopDelay'));
  },

  fire(force = false) {
    const el = this.centerSegment();
    if (!el) return;
    const unit = Number(el.dataset.u);
    if (!force && unit === this.lastUnit) return; // 前回と同じなら何もしない
    this.lastUnit = unit;
    if (this.onStop) this.onStop({ unit, seg: Number(el.dataset.s), el });
  },

  centerSegment() {
    const cy = this.centerY();
    let best = null, bestD = Infinity;
    for (const el of this.atCenter) {
      const r = el.getBoundingClientRect();
      const d = Math.abs((r.top + r.bottom) / 2 - cy);
      if (d < bestD) { best = el; bestD = d; }
    }
    if (best) return best;
    // 段落の隙間や見出しに中央線がある場合：文書順の二分探索で最も近い断片
    const els = this.segEls;
    if (!els.length) return null;
    let lo = 0, hi = els.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (els[mid].getBoundingClientRect().bottom < cy) lo = mid + 1; else hi = mid;
    }
    const cand = [els[lo], els[lo - 1]].filter(Boolean);
    cand.sort((a, b) => {
      const da = Math.min(Math.abs(a.getBoundingClientRect().top - cy), Math.abs(a.getBoundingClientRect().bottom - cy));
      const db = Math.min(Math.abs(b.getBoundingClientRect().top - cy), Math.abs(b.getBoundingClientRect().bottom - cy));
      return da - db;
    });
    return cand[0];
  },
};

JV.Debug = {
  lines: {},
  set(key, text) {
    this.lines[key] = text;

    const el = document.getElementById('debug');

  },
};

  options(group, key) {
    const q = this[group][key];
    if (q.options) return q.options;
    const [g, k] = q.optionsFrom.includes('.') ? q.optionsFrom.split('.') : [group, q.optionsFrom];
    return this[g][k].options;
  },
  byLabel(group, key, label) { return this.options(group, key).find((o) => o.label === label); },
  byId(group, key, id) { return this.options(group, key).find((o) => o.id === id); },

  /** TypeSafe 形式の questions を組み立てる（asciiKeys なら criteria のキーを英字IDにする） */
  /** その時代で使える選択肢か（eras のない選択肢はどの時代でも使う） */
  allowed(o, era) { return !era || !o.eras || o.eras.includes(era); },
  /** その時代にない場所を、近い場所に読み替える（前の時代で判定した結果が残っていたとき） */
  LOC_ALT: { classroom: 'yoshitsu', station: 'street', office: 'yoshitsu', hospital: 'bedroom', shrine: 'garden', church: 'castle', castle: 'yoshitsu', park: 'garden', rooftop: 'street' },
  /** その時代にいない動物（ドラゴンはファンタジーだけ）は、モンスターに読み替える */
  animalFor(id, era) { const o = this.byId('scene', 'animal', id); return !o || this.allowed(o, era) ? id : 'monster'; },
  locFor(id, era) {
    for (let k = 0; k < 4 && id; k++) { const o = this.byId('scene', 'location', id); if (!o || this.allowed(o, era)) return id; id = this.LOC_ALT[id]; }
    return id || 'unknown';
  },
  toQuestions(group, { asciiKeys = false, lines = [], era = null } = {}) {
    const out = {};
    const items = lines.map((l) => (typeof l === 'string' ? { text: l, before: '', after: '' } : l));
    for (const [key, q] of Object.entries(this[group])) {
      if (q.withLines && !items.length) continue;
      if (q.perLine) {
        // 代表のセリフ：この単位のセリフから1つ選ばせる（キーは番号）
        if (items.length > 1) {
          const criteria = {};
          items.forEach((l, i) => { criteria[String(i + 1)] = `「${l.text}」`; });
          out.line = { type: 'choice', instructions: '現在の段落(current)のセリフのうち、場面をいちばんよく表す・いちばん印象に残る一言', criteria };
        }
        // 話し手：セリフごとに、前後の地の文を添えて聞く
        const criteria = {};
        for (const o of this.options(group, key)) criteria[asciiKeys ? o.id : o.label] = asciiKeys ? `${o.label}：${o.desc}` : o.desc;
        items.forEach((l, i) => {
          const where = `${l.before ? `直前の地の文「${l.before}」` : '直前の地の文なし'}／${l.after ? `直後の地の文「${l.after}」` : '直後の地の文なし'}`;
          out[`speaker_${i + 1}`] = { type: 'choice', instructions: `セリフ${i + 1}「${l.text}」（${where}）について：${q.instructions}`, criteria: { ...criteria } };
        });
        continue;
      }
      if (q.type === 'noul') out[key] = { type: 'noul', instructions: q.instructions };
      else if (q.type === 'score') out[key] = { type: 'score', instructions: q.instructions, criteria: q.levels.slice() };
      else {
        // 選択肢は作品の時代で絞る（その時代にない場所は聞かない）
        const criteria = {};
        for (const o of this.options(group, key)) if (this.allowed(o, era)) criteria[asciiKeys ? o.id : o.label] = asciiKeys ? `${o.label}：${o.desc}` : o.desc;
        out[key] = { type: 'choice', instructions: q.instructions, criteria };
      }
    }
    return out;
  },
};

  count(text, kws) {
    let n = 0;
    for (const k of kws) {
      if (k instanceof RegExp) n += (text.match(new RegExp(k.source, 'g')) || []).length;
      else if (text.includes(k)) n += text.split(k).length - 1;
    }
    return n;
  },

  /** 各選択肢の得点 → 確率。fallback（不明・記述なし）には下駄をはかせる */
  choice(labels, scores, fallback, base = 0.05, fallbackBase = 0.6) {
    const w = labels.map((l) => (scores[l] || 0) + (l === fallback ? fallbackBase : base));
    const sum = w.reduce((a, b) => a + b, 0);
    const probabilities = {};
    labels.forEach((l, i) => { probabilities[l] = w[i] / sum; });
    let best = labels[0];
    for (const l of labels) if (probabilities[l] > probabilities[best]) best = l;
    return { choice: best, probabilities, confidence: probabilities[best] };
  },

  scoreFor(table, cur, ctx) {
    const s = {};
    for (const [label, kws] of Object.entries(table)) s[label] = this.count(cur, kws) + 0.35 * this.count(ctx, kws);
    return s;
  },

  async judge(state, questions, { signal } = {}) {
    const [lo, hi] = this.latency;
    await JV.util.sleep(lo + Math.random() * (hi - lo), signal);
    const st = typeof state === 'string' ? { current: state } : state;
    const cur = st.current || '';
    const ctx = st.context_before || '';
    const prev = st.previous_scene || {};
    const K = this.KEYWORDS;
    const labelsOf = (key) => Object.keys(questions[key].criteria);
    // criteria のキーが英字IDでも動くように、表示名 ↔ キーを対応づける
    const answers = {};
    const dialogues = (cur.match(/^[「『]/gm) || []).length;

    // 吹き出し：！や？・気持ちの言葉が多く、ほどよく長いセリフほど「代表」で「大事」
    // 単位の最後のほうのセリフ（場面の引き）も大事にする。あいさつ・相づちは「さりげない」
    const lineKeys = questions.line ? Object.keys(questions.line.criteria) : null;
    const items = JV.Parser.quoteItems(cur);
    const lineTexts = lineKeys ? lineKeys.map((k) => questions.line.criteria[k].replace(/^「|」$/g, '')) : items.map((q) => q.text).slice(0, 1);
    const casual = (t) => /^(いらっしゃ|おはよう|こんにちは|こんばんは|はい|ええ|うん|そう|じゃあ|ありがとう)/.test(t) && t.length <= 14;
    const lineScore = (t, i = 0) => casual(t) ? -1 : (t.match(/[！!？?]/g) || []).length + 0.8 * Object.values(K.emotion).reduce((n, kws) => n + this.count(t, kws), 0) + (t.length >= 8 ? 0.6 : 0) + (/……|っ$/.test(t) ? 0.3 : 0) + (lineTexts.length > 1 ? 0.8 * i / (lineTexts.length - 1) : 0);
    let bestLine = 0;
    lineTexts.forEach((t, i) => { if (lineScore(t, i) > lineScore(lineTexts[bestLine], bestLine)) bestLine = i; });
    for (const key of Object.keys(questions)) {
      const q = questions[key];
      if (key === 'line') {
        const w = lineTexts.map((t, i) => Math.max(0.1, 1.3 + lineScore(t, i)) + (i === bestLine ? 0.5 : 0)), sum = w.reduce((a, b) => a + b, 0);
        const probabilities = {}; lineKeys.forEach((k, i) => { probabilities[k] = w[i] / sum; });
        answers.line = { type: 'choice', choice: lineKeys[bestLine], probabilities, confidence: probabilities[lineKeys[bestLine]] };
