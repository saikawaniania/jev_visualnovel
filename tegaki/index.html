      if (/^speaker_\d+$/.test(key)) {
        // 直後の地の文「と少女が言った」「私は答えた」、直前の「老人が口を開いた」などから話し手を当てる。『』は場面にいない人物
        const it = items[Number(key.split('_')[1]) - 1] || { text: '', before: '', after: '' };
        const keys = labelsOf(key), labels = keys.map((k) => (JV.Schema.byLabel('scene', 'speaker', k) || JV.Schema.byId('scene', 'speaker', k) || { label: k }).label);
        const near = `${it.after.split(/[。]/)[0]} ${it.before.split(/[。]/).pop()}`;
        let pick = '不明';
        if (it.written) pick = '場面にいない人物';
        else if (/^と?(私|僕|俺|わたし|あたし)|(私|僕|俺)は(言|答|叫|聞|つぶや|たず)/.test(it.after) || /(私|僕|俺)は(言|答|叫|聞|つぶや|たず)/.test(near) || /^[^。]{0,12}(言|叫|答|声に出し|つぶやい)[たっ][^。]{0,3}(私|僕|俺)/.test(it.after)) pick = '語り手';
        else {
          const sc = this.scoreFor({ ...K.figure, '老人（男）': ['老人', '爺', '翁', '局長'], '老人（女）': ['老婆', '婆', '魔女'] }, near, '');
          for (const l of Object.keys(sc)) if (sc[l] > 0 && (pick === '不明' || sc[l] > sc[pick])) pick = l;
        }
        const probabilities = {}; labels.forEach((l, i) => { probabilities[keys[i]] = l === pick ? 0.72 : 0.28 / (labels.length - 1); });
        const ch = keys[labels.indexOf(pick)] ?? keys[labels.length - 1];
        answers[key] = { type: 'choice', choice: ch, probabilities, confidence: probabilities[ch] };
        continue;
      }
      if (key === 'line_importance') {
        const bt = lineTexts[bestLine] || '', ls = lineScore(bt, bestLine);
        const sc = ls < 0 ? 0.2 : Math.min(2, 0.9 + ls * 0.45);
        const probabilities = { 0: Math.max(0, 1 - sc) / 2, 1: 0.5, 2: Math.max(0, sc - 1) / 2 + 0.0 }; const z = probabilities[0] + probabilities[1] + probabilities[2];
        for (const k in probabilities) probabilities[k] /= z;
        answers[key] = { type: 'score', score: sc, probabilities, confidence: 0.6 };
        continue;
      }
      if (q.type === 'choice') {
        const keys = labelsOf(key);
        const group = key in JV.Schema.work ? 'work' : 'scene';
        const toLabel = (k) => (JV.Schema.byLabel(group, key, k) ? k : (JV.Schema.byId(group, key, k) || { label: k }).label);
        const labels = keys.map(toLabel);
        let table = K[key];
        if (key === 'figure_main' || key === 'figure_sub' || key === 'protagonist') table = K.figure;
        const narrOnly = key === 'location' || key === 'time' || key === 'weather';
        const strip = (t) => t.replace(/「[^」]*」|『[^』]*』/g, '');
        let scores = table ? this.scoreFor(table, narrOnly ? strip(cur) : cur, key === 'era' || key === 'narration' ? '' : (narrOnly ? strip(ctx) : ctx)) : {};
        let fallback = labels.find((l) => l === '不明' || l === '記述なし');

        if (key === 'protagonist') {
          const narr = cur.replace(/「[^」]*」|『[^』]*』/g, '');
          scores = this.scoreFor(K.figure, narr, '');
          // 一人称の自称は性別の手がかりになる
          if (/僕|俺/.test(narr)) scores['成人男性'] = (scores['成人男性'] || 0) + 2;
          if (/あたし/.test(narr)) scores['成人女性'] = (scores['成人女性'] || 0) + 2;
          fallback = '不明';
        }
        if (key === 'narration') {
          const narr = cur.replace(/「[^」]*」/g, '');
          const first = this.count(narr, ['私', '僕', '俺', 'わたし', 'あたし']);
          scores = { '一人称': first, '三人称': Math.max(0.5, narr.length / 400 - first) };
        }
        if (key === 'people') {
          if (dialogues >= 2) scores['2人'] = (scores['2人'] || 0) + 1.2;
          fallback = '1人';
        }
        if (key === 'pose' && dialogues >= 2) scores['向き合って話す'] = (scores['向き合って話す'] || 0) + 0.8;
        if (key === 'pose') fallback = '立っている';
        if (key === 'animal') fallback = 'いない';
        if (key === 'figure_sub') {
          // 主人物に選ばれたものを除いた2番手
          const main = answers.figure_main ? toLabel(answers.figure_main.choice) : null;
          if (main && main !== '不明') scores[main] = Math.max(0, (scores[main] || 0) - 1.5);
          if (dialogues < 2 && !(scores['成人女性'] || scores['少女'] || scores['老人（女）'])) scores = {};
        }
        const fbBase = fallback === '1人' || fallback === '立っている' ? 0.4 : key === 'weather' ? 0.45 : 0.6;
        const r = this.choice(labels, scores, fallback || labels[0], 0.05, fbBase);
        // 返すときは元のキーに戻す
        const back = (l) => keys[labels.indexOf(l)];
        const probabilities = {};
        for (const l of labels) probabilities[back(l)] = r.probabilities[l];
        answers[key] = { type: 'choice', choice: back(r.choice), probabilities, confidence: r.confidence };
        // 時代の手がかりが一つもなければ「判定できなかった」扱い（あとで読み進めてから判定し直す）
        if (key === 'era' && !Object.values(scores).some((v) => v > 0)) answers[key].confidence = 0.3;
      } else if (q.type === 'score') {
        const n = q.criteria.length;
        const raw = K.mood.slice(0, n).map((kws) => this.count(cur, kws) + 0.35 * this.count(ctx, kws));
        raw[0] += 0.5;
        const sum = raw.reduce((a, b) => a + b, 0);
        const probabilities = {};
        raw.forEach((v, i) => { probabilities[i] = v / sum; });
        const score = raw.reduce((a, v, i) => a + i * (v / sum), 0);
        answers[key] = { type: 'score', score, probabilities, confidence: Math.max(...Object.values(probabilities)) };
      } else if (q.type === 'noul') {
        answers[key] = { type: 'noul', noul: 0 }; // 他の答えを見てから下で決める
      }
    }

    if (questions.scene_changed) {
      const labelOf = (key) => {
        const a = answers[key];
        if (!a) return null;
        return JV.Schema.byLabel('scene', key, a.choice) ? a.choice : (JV.Schema.byId('scene', key, a.choice) || {}).label;
      };
      let p = 0.12 + 0.12 * Math.min(2, this.count(cur, K.transition));
      const loc = labelOf('location');
      const time = labelOf('time');
      if (loc && loc !== '不明' && prev.location && loc !== prev.location && answers.location.confidence > 0.3) p += 0.5;
      if (time && time !== '不明' && prev.time && time !== prev.time && answers.time.confidence > 0.35) p += 0.3;
      if (!prev.location) p += 0.3;
      answers.scene_changed = { type: 'noul', noul: Math.min(0.97, p) };
    }
    if (questions.inner) {
      // 会話がなく、心の動きを表す言葉が多く、場所や動作の言葉が少ないほど「心の中だけ」
      const narr = cur.replace(/「[^」]*」|『[^』]*』/g, '');
      const hits = this.count(narr, K.inner) + 0.6 * Object.values(K.emotion).reduce((n, kws) => n + this.count(narr, kws), 0);
      const outer = Object.values(K.location).reduce((n, kws) => n + this.count(narr, kws), 0) + 0.5 * this.count(narr, [...K.pose['歩く'], ...K.pose['走る']]);
      const per100 = (x) => x / Math.max(1, narr.length / 100);
      const p = 0.08 + 0.3 * per100(hits) - 0.25 * dialogues - 0.15 * per100(outer);
      answers.inner = { type: 'noul', noul: Math.max(0.02, Math.min(0.95, p)) };
    }
    return answers;
  },
};

/**
 * 実Jevアダプタ。経路ごとの違い（URL・ヘッダー・応答の包み方）はここに閉じ込める。
 *   typesafe   : TypeSafe 直接。POST https://api.typesafe.ai/v1/systemone（公式SDKと同じ形式）
 *   openrouter : OpenRouter 経由。TypeSafe と同じ本文を送る（OpenRouter 側の形式は要確認のため URL は設定で変更可）
 *   relay      : 任意の中継（Cloudflare Workers 等）。TypeSafe と同じ本文を送り、キーは中継側に置ける
 */
JV.Adapters.remote = {
  TIMEOUT_MS: 8000,
  ROUTES: {
    typesafe: { label: 'TypeSafe 直接', url: 'https://api.typesafe.ai/v1/systemone' },
    openrouter: { label: 'OpenRouter 経由', url: 'https://openrouter.ai/api/v1/systemone' },
    relay: { label: '中継サーバー', url: '/v1/systemone' }, // 既定はページと同じサーバー（relay/local_server.py）
  },

  get name() { return JV.Settings.route(); },
  cacheKey() { return `${this.name}:${JV.Settings.get('model')}`; },

  endpoint() {
    const route = JV.Settings.route();
    const custom = (JV.Settings.get('endpoint') || '').trim();
    const url = custom || (this.ROUTES[route] || {}).url;
    const key = (JV.Settings.get('apiKey') || '').trim();
    const headers = { 'Content-Type': 'application/json', Accept: 'application/json' };
    if (route === 'relay') {
      // 中継にはキーを渡さない（キーは中継側にある）。合言葉だけ送る
      const pass = (JV.Settings.get('relayPass') || '').trim();
      if (pass) headers['X-Relay-Passphrase'] = pass;
    } else if (key) headers.Authorization = `Bearer ${key}`;
    if (route === 'openrouter') {
      // OpenRouter がアプリの識別に使うヘッダー（任意）
      if (/^https?:/.test(location.href)) headers['HTTP-Referer'] = location.origin;
      headers['X-Title'] = 'Jev Sound Novel Viewer';
    }
    return { url, headers };
  },

  /** 使えるモデルの一覧（GET …/v1/models）。[{ name, description, release_date }] */
  async listModels() {
    const { url, headers } = this.endpoint();
    if (!url) throw new JV.Adapters.RemoteError('接続先URLが設定されていません', 'config');
    const modelsUrl = url.replace(/\/systemone\/?(\?.*)?$/, '/models');
    if (modelsUrl === url) throw new JV.Adapters.RemoteError('この接続先からはモデル一覧のURLが分かりません', 'config');
    delete headers['Content-Type'];
    let res;
    try {
      res = await fetch(modelsUrl, { method: 'GET', headers, mode: 'cors', credentials: 'omit', signal: AbortSignal.timeout ? AbortSignal.timeout(this.TIMEOUT_MS) : undefined });
    } catch (err) {
      throw new JV.Adapters.RemoteError('接続できません。ブラウザからの直接呼び出しが CORS で拒否されたか、ネットワークに届いていません', 'network', String(err));
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (_) { data = text; }
    if (!res.ok) {
      const msg = (data && (data.message || (data.error && (data.error.message || data.error)))) || text.slice(0, 200);
      throw new JV.Adapters.RemoteError(`HTTP ${res.status}: ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`, res.status === 403 || res.status === 401 ? 'auth' : 'http', data, res.status);
    }
    const list = Array.isArray(data) ? data : (data && (data.models || data.data)) || [];
    return list.map((m) => (typeof m === 'string' ? { name: m } : { name: m.name || m.id, description: m.description || '', release_date: m.release_date || '' })).filter((m) => m.name);
  },

  /** 応答から answers を取り出す。TypeSafe 形式のほか、OpenAI 互換の包み方にも一応対応 */
  extractAnswers(data) {
    if (data && data.answers) return data.answers;
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (typeof content === 'string') {
      try { const j = JSON.parse(content); if (j.answers) return j.answers; return j; } catch (_) { /* 下へ */ }
    }
    throw new JV.Adapters.RemoteError('応答に answers がありません（経路の形式を確認してください）', 'format', data);
  },

  async judge(state, questions, { signal } = {}) {
    const { url, headers } = this.endpoint();
    if (!url) throw new JV.Adapters.RemoteError('接続先URLが設定されていません', 'config');
    const ctl = new AbortController();
    const onAbort = () => ctl.abort();
    if (signal) { if (signal.aborted) ctl.abort(); else signal.addEventListener('abort', onAbort, { once: true }); }
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, this.TIMEOUT_MS);
    const body = { model: JV.Settings.get('model') || 'jev-latest', state, questions };
    try {
      let res;
      try {
        res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal, mode: 'cors', credentials: 'omit' });
      } catch (err) {
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        if (timedOut) throw new JV.Adapters.RemoteError(`${this.TIMEOUT_MS}ms 以内に応答がありません`, 'timeout');
        // ブラウザは CORS 拒否とネットワーク断を区別して教えてくれない
        throw new JV.Adapters.RemoteError('接続できません。ブラウザからの直接呼び出しが CORS で拒否されたか、ネットワークに届いていません', 'network', String(err));
      }
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : undefined; } catch (_) { data = text; }
      // JSON ではなくウェブページが返ってきた：その場所に中継がなく、サーバーのログイン画面やエラーページが出ている
      if (data && data.code === 'upstream_auth') {
        throw new JV.Adapters.RemoteError(`中継には届きましたが、TypeSafe が API キーを受け付けませんでした（HTTP ${res.status}）。Netlify の環境変数 TYPESAFE_API_KEY の値（前に Bearer や引用符・空白が付いていないか、キーが有効か）を確かめて、再デプロイしてください。`, 'auth', data, res.status);
      }
      if (typeof data === 'string' && /^\s*<(!doctype|html|head|body)/i.test(data)) {
        throw new JV.Adapters.RemoteError(res.status === 401 || res.status === 403
          ? `接続先が Jev の中継ではなく、ログイン画面を返しました（HTTP ${res.status}）。中継に届く前に止められています。Netlify のサイト保護（パスワードや Netlify へのログイン）がかかっていないか確かめてください。`
          : `接続先が Jev の中継ではなく、ウェブページを返しました（HTTP ${res.status}）。いま開いているページの置き場所には中継サーバーがありません。Netlify に置いたサイトか relay/local_server.py で開くか、設定の呼び出し経路を「モック」にしてください。`, 'html', text.slice(0, 200), res.status);
      }
      if (!res.ok) {
        const msg = (data && (data.error && (data.error.message || data.error) || data.message || data.detail)) || text.slice(0, 200);
        const kind = res.status === 401 || res.status === 403 ? 'auth' : res.status === 429 ? 'rate' : res.status === 404 ? 'notfound' : 'http';
        throw new JV.Adapters.RemoteError(`HTTP ${res.status}: ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`, kind, data, res.status);
      }
      return this.extractAnswers(data);
    } finally {
      clearTimeout(timer);
      if (signal) signal.removeEventListener('abort', onAbort);
    }
  },
};

JV.Adapters.RemoteError = class extends Error {
  constructor(message, kind, detail, status) {
    super(message);
    this.name = 'RemoteError';
    this.kind = kind;       // config | network | timeout | auth | rate | notfound | http | format
    this.detail = detail;
    this.status = status;
  }
};

JV.util = {
  sleep(ms, signal) {
    return new Promise((resolve, reject) => {
      if (signal && signal.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
      const t = setTimeout(() => { if (signal) signal.removeEventListener('abort', onAbort); resolve(); }, ms);
      const onAbort = () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); };
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
    });
  },
  isAbort(err) { return err && (err.name === 'AbortError' || err.name === 'APIUserAbortError'); },
};

/* =====================================================================
 * 舞台：canvas 1枚に、tegaki.js と draw.js で毎コマ手描きの絵を描く。
 * 切り替えは「前の値 → 次の値」の補間で表す：背景と人物はクロスフェード、天候・心象・空気・暗転は数値の補間
 * 人物は別の canvas に描いてから重ねる（半透明のときに線が透けないように）
 * ===================================================================== */
JV.Stage = {
  INDOOR: new Set(['washitsu', 'yoshitsu', 'kitchen', 'genkan', 'classroom', 'shop']),
  el: null, canvas: null, tg: null, ftg: null, gen: 0, shown: null, figKey: '', inner: null,
  lastDraw: 0, dirty: true, frames: 0,

  init() {
    const st = document.getElementById('stage');
    st.innerHTML = '<canvas aria-hidden="true"></canvas>';
    this.el = st;
    this.canvas = st.querySelector('canvas');
    this.reset();
    this.resize();
    if (window.ResizeObserver) new ResizeObserver(() => this.resize()).observe(st);
    window.addEventListener('resize', () => this.resize());
    this.loop();
  },

  /** 画面の大きさに合わせて描画用の canvas を作り直す（重くならないよう長辺 1600px まで） */
  resize() {
    const r = this.el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    const cap = 1600 / Math.max(w, h);
    if (cap < 1) { w = Math.round(w * cap); h = Math.round(h * cap); }
    if (this.tg && this.canvas.width === w && this.canvas.height === h) return;
    this.canvas.width = w; this.canvas.height = h;
    this.tg = Tegaki.create(this.canvas, { style: 'paper', paper: 0.35, vignette: 0.22, grain: 0.05 });
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    this.ftg = Tegaki.create(off, { style: 'paper', post: false });
    this.dirty = true;
  },

  /* ---------- 補間 ---------- */
  tw(from, to, ms) { return { from, to, t0: performance.now(), ms: Math.max(0, ms || 0) }; },
  k(tw) { return tw.ms ? Math.max(0, Math.min(1, (performance.now() - tw.t0) / tw.ms)) : 1; },
  val(tw) { const k = this.k(tw), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; return tw.from + (tw.to - tw.from) * e; },
  set(name, to, ms) { this[name] = this.tw(this.val(this[name]), to, ms); this.dirty = true; },

  reset() {
    this.gen++;
    this.shown = null;
    this.figKey = '';
    this.inner = null;
    this.world = { from: null, to: null, t0: 0, ms: 0 };
    this.figs = { from: null, to: null, t0: 0, ms: 0, mode: 'cross' };
    for (const w of ['rain', 'snow', 'cloudy', 'fog']) this['w_' + w] = this.tw(0, 0, 0);
    this.emo = {};
    for (const id of Draw.EMOTIONS) this.emo[id] = this.tw(0, 0, 0);
    this.mood = this.tw(0, 0, 0);
    this.black = this.tw(0, 0, 0);
    this.line = { from: null, to: null, t0: 0, ms: 0 };
    this.dirty = true;
  },

  fade() { return Number(JV.Settings.get('fadeScale')) || 1; },
  figuresKey(s) { return s.figures ? `${s.figures.layout}|${s.figures.main || ''}|${s.figures.sub || ''}|${s.figures.pose}|${s.figures.animal || ''}` : ''; },

  /** 表情：心の中の気持ち（emotion）があればそれ、なければ緊張感から */
  exprOf(s) {
    if (s.emotion) return s.emotion;
    return s.mood > 0.66 ? 'anxiety' : 'normal';
  },
  worldSnap(s) { const era = s.era || 'modern', loc = s.location || 'none', time = s.time || 'day'; return { location: loc, time, era, key: `${era}|${loc}|${time}` }; },
  figSnap(s) { return { figures: s.figures, era: s.era || 'modern', location: s.location, time: s.time, expr: this.exprOf(s), crowdVariant: s.crowdVariant || 0, key: `${this.figuresKey(s)}|${s.era || 'modern'}` }; },

  /** 背景：場所・時間帯・時代が変わればクロスフェード（ms=0 なら即時） */
  setBackground(s, ms) {
    const snap = this.worldSnap(s);
    if (this.world.to && this.world.to.key === snap.key) return;
    this.world = { from: ms > 0 ? this.world.to : null, to: snap, t0: performance.now(), ms };
    this.dirty = true;
  },
  /** 人物：顔ぶれ・姿勢が変われば入れ替え。mode 'outin' は先に消してから出す */
  setFigures(s, ms, mode = 'cross') {
    const snap = this.figSnap(s);
    if (this.figs.to && this.figs.to.key === snap.key) { this.figs.to = snap; this.dirty = true; return; } // 表情だけはその場で替える
    this.figs = { from: ms > 0 ? this.figs.to : null, to: snap, t0: performance.now(), ms, mode };
    this.figKey = this.figuresKey(s);
    this.dirty = true;
  },
  setTone(s, ms) {
    const w = s.inner ? 'none' : s.weather; // 心象の背景の間は天候を止める
    const indoor = this.INDOOR.has(s.location);
    this.set('w_rain', w === 'rain' && !indoor ? 1 : 0, ms);
    this.set('w_snow', w === 'snow' && !indoor ? 1 : 0, ms);
    this.set('w_cloudy', w === 'cloudy' ? 1 : w === 'rain' || w === 'snow' ? 0.6 : 0, ms);
    this.set('w_fog', w === 'fog' ? (indoor ? 0.3 : 1) : 0, ms);
  },
  /** 心象の背景：心の中だけを描く段落で、気持ちの絵を重ねる。null で消す */
  setInner(id, ms) {
    this.inner = id || null;
    for (const e of Object.keys(this.emo)) this.emo[e] = this.tw(this.val(this.emo[e]), e === this.inner ? 1 : 0, ms);
    this.dirty = true;
  },
  setMood(m, ms) { this.set('mood', this.inner ? 0 : m, ms); },
  /** 吹き出し：同じセリフならそのまま。delay だけ待ってから出す（人物が出そろってから） */
  setLine(line, ms, delay = 0) {
    const key = line ? `${line.speaker}|${line.text}` : '';
    const cur = this.line.to, curKey = cur ? `${cur.speaker}|${cur.text}` : '';
    if (key === curKey) { if (line) this.line.to = line; return; }
    this.line = { from: ms > 0 && this.k(this.line) >= 1 ? cur : null, to: line, t0: performance.now() + delay, ms: Math.max(1, ms) };
    this.dirty = true;
  },

  /** 判定結果から決まった「次の場面」を、変化の種類に応じた演出で見せる */
  async show(plan) {
    const gen = ++this.gen;
    const k = this.fade();
    const s = plan.scene;
    const alive = () => gen === this.gen;
    const figsChanged = this.figuresKey(s) !== this.figKey;

    if (plan.chapter) {
      // 章が変わる：一度黒に落としてから新しい場面
      this.set('black', 1, 450 * k);
      await JV.util.sleep(500 * k);
      if (!alive()) return;
      this.setBackground(s, 0);
      this.setInner(s.inner, 0);
      this.setTone(s, 0);
      this.setMood(s.mood, 0);
      this.setFigures(s, 0);
      this.setLine(s.line, 0);
      this.set('black', 0, 500 * k);
      this.shown = s;
      return;
    }
    if (plan.bg) {
      // 場所が変わる：背景をクロスフェード、人物は一度消してから出す
      this.setBackground(s, 800 * k);
      this.setInner(s.inner, 800 * k);
      this.setTone(s, 800 * k);
      this.setMood(s.mood, 1200 * k);
      this.setFigures(s, figsChanged || this.figs.to ? 1200 * k : 0, 'outin');
      this.setLine(s.line, 300 * k, 1000 * k);
      this.shown = s;
      return;
    }
    // 時間帯が変われば背景もゆっくり。天候・心象・空気も 1,200ms
    if (s.location) this.setBackground(s, 1200 * k);
    if (plan.inner) this.setInner(s.inner, 1200 * k);
    if (plan.tone || plan.inner) this.setTone(s, 1200 * k);
    this.setMood(s.mood, 1200 * k);
    this.setFigures(s, figsChanged ? 400 * k : 0, this.figs.to ? 'outin' : 'cross');
    this.setLine(s.line, 300 * k, figsChanged ? 350 * k : 0);
    this.shown = s;
  },

  /* ---------- 描画 ---------- */
  animating() {
    const busy = (tw) => tw.ms && performance.now() - tw.t0 < tw.ms;
    return busy(this.line) || busy(this.world) || busy(this.figs) || busy(this.mood) || busy(this.black) || busy(this.w_rain) || busy(this.w_snow) || busy(this.w_cloudy) || busy(this.w_fog) || Object.values(this.emo).some(busy);
  },
  loop() {
    const tick = () => {
      requestAnimationFrame(tick);
      if (!this.tg || document.hidden) return;
      const reader = document.getElementById('reader');
      if ((reader && reader.classList.contains('hidden')) || document.body.classList.contains('effects-off')) return;
      const now = performance.now();
      // 手描きの線は 1 秒に 12 回描き直す（フェード中だけ 30 回）
      if (!this.dirty && now - this.lastDraw < (this.animating() ? 33 : 83)) return;
      this.lastDraw = now; this.dirty = false;
      this.frame(now / 1000);
    };
    requestAnimationFrame(tick);
  },
  frame(t) {
    const tg = this.tg, c = tg.ctx, L = Draw.layout(tg);
    // 上のバー（戻る・設定）の下から吹き出しを置く
    L.topInset = 48 * (this.canvas.height / (this.el.clientHeight || this.canvas.height));
    tg.setTime(t);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#1b1d22'; c.fillRect(0, 0, L.W, L.H);
    // 1 背景（場所）
    const wk = this.k(this.world);
    if (this.world.from && wk < 1) { Draw.background(tg, L, this.world.from, t); c.globalAlpha = wk; }
    if (this.world.to) Draw.background(tg, L, this.world.to, t);
    c.globalAlpha = 1;
    // 2 心象
    let innerK = 0;
    for (const [id, tw] of Object.entries(this.emo)) { const a = this.val(tw); if (a > 0.003) { Draw.emotion(tg, L, id, t, a); innerK += a; } }
    innerK = Math.min(1, innerK);
    // 3 人物
    if (JV.Settings.get('silhouettes') && (this.figs.to || this.figs.from)) {
      const fk = this.k(this.figs), out = this.figs.mode === 'outin';
      const aOld = out ? 1 - Math.min(1, fk / 0.2) : 1 - fk, aNew = out ? Math.max(0, Math.min(1, (fk - 0.67) / 0.33)) : fk;
      const time = this.world.to ? this.world.to.time : 'day';
      const draw = (snap, a) => {
        if (!snap || a <= 0.003 || !snap.figures || (snap.figures.layout === 'none' && !snap.figures.animal)) return;
        const f = this.ftg, fc = f.ctx; f.setTime(t);
        fc.setTransform(1, 0, 0, 1, 0, 0); fc.globalAlpha = 1; fc.clearRect(0, 0, L.W, L.H);
        Draw.figures(f, L, Object.assign({}, snap, { time, innerK }), t);
        c.globalAlpha = a; c.drawImage(f.canvas, 0, 0); c.globalAlpha = 1;
      };
      draw(this.figs.from && this.k(this.figs) < 1 ? this.figs.from : null, aOld);
      draw(this.figs.to, this.figs.from && this.k(this.figs) < 1 ? aNew : 1);
    }
    // 4 天候
    const wf = 1 - innerK;
    Draw.weather(tg, L, { rain: this.val(this.w_rain) * wf, snow: this.val(this.w_snow) * wf, cloudy: this.val(this.w_cloudy) * wf, fog: this.val(this.w_fog) * wf }, t);
    // 5 空気（緊張感：色を抜き、周りを暗く）
    const m = this.val(this.mood);
    if (m > 0.01) {
      c.save();
      c.globalCompositeOperation = 'saturation'; c.fillStyle = `rgba(128,128,128,${(0.6 * m).toFixed(3)})`; c.fillRect(0, 0, L.W, L.H);
      c.globalCompositeOperation = 'source-over';
      const g = c.createRadialGradient(L.W / 2, L.H / 2, Math.min(L.W, L.H) * 0.3, L.W / 2, L.H / 2, Math.max(L.W, L.H) * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${(0.55 * m).toFixed(3)})`);
      c.fillStyle = g; c.fillRect(0, 0, L.W, L.H);
      c.restore();
    }
    // 6 吹き出し（新しいセリフは少し大きいところから 1 倍に）
    if (JV.Settings.get('bubbles') !== false) {
      const lk = this.k(this.line), started = performance.now() >= this.line.t0;
      const fig = this.figs.to && Object.assign({}, this.figs.to);
      if (this.line.from && (lk < 1)) Draw.bubble(tg, L, this.line.from, fig, t, started ? 1 - lk : 1);
      if (this.line.to && started) Draw.bubble(tg, L, this.line.to, fig, t, lk, 1 + 0.08 * (1 - lk));
    }
    tg.post();
    // 7 暗転
    const b = this.val(this.black);
    if (b > 0.003) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.fillStyle = `rgba(0,0,0,${b.toFixed(3)})`; c.fillRect(0, 0, L.W, L.H); }
    this.frames++;
  },

  /** テスト・デバッグ用：いま描いている値 */
  state() {
    return {
      world: this.world.to && this.world.to.key, worldFrom: this.world.from && this.k(this.world) < 1 ? this.world.from.key : null,
      figs: this.figs.to && this.figs.to.key, expr: this.figs.to && this.figs.to.expr, inner: this.inner,
      emo: Object.fromEntries(Object.entries(this.emo).map(([k, v]) => [k, +this.val(v).toFixed(2)])),
      rain: +this.val(this.w_rain).toFixed(2), snow: +this.val(this.w_snow).toFixed(2), fog: +this.val(this.w_fog).toFixed(2), cloudy: +this.val(this.w_cloudy).toFixed(2),
      mood: +this.val(this.mood).toFixed(2), black: +this.val(this.black).toFixed(2), frames: this.frames,
      line: this.line.to ? { ...this.line.to } : null,
    };
  },
};

/* =====================================================================
 * 演出の発火ロジック：判定結果 → 次の場面（絵を替えるかどうかはすべてここで決める）
 * ===================================================================== */
JV.Director = {
  scene: null,        // いま表示している（表示が決まった）場面。値は英字ID
  lastBgAt: -Infinity,
  lastChapter: null,
  MIN_BG_MS: 5000,    // 一度替えた背景は最短5秒は替えない

  reset() { this.scene = null; this.lastBgAt = -Infinity; this.lastChapter = null; },

  thresholds() {
    const th = Number(JV.Settings.get('sensitivity')) || 0.6;
    return { th, loc: Math.max(0.2, th - 0.1) };
  },

  /** 判定器の答え（キーが表示名でも英字IDでもよい）を {key: {id, label, p, top}} に揃える */
  normalize(answers) {
    const out = {};
    for (const [key, a] of Object.entries(answers || {})) {
      if (!(key in JV.Schema.scene)) continue;
      if (a.type === 'noul' || 'noul' in a) { out[key] = { p: Number(a.noul) }; continue; }
      if (a.type === 'score' || ('score' in a && !('choice' in a))) {
        const n = JV.Schema.scene[key].levels.length;
        let v = Number(a.score);
        if (v > n - 1) v = n - 1;
        out[key] = { value: Math.max(0, v) / (n - 1), confidence: a.confidence };
        continue;
      }
      const opt = JV.Schema.byLabel('scene', key, a.choice) || JV.Schema.byId('scene', key, a.choice);
      if (!opt) continue; // スキーマ外の値は使わない
      const probs = a.probabilities || {};
      const p = probs[a.choice] != null ? Number(probs[a.choice]) : Number(a.confidence || 0);
      out[key] = { id: opt.id, label: opt.label, p, confidence: a.confidence != null ? Number(a.confidence) : p, probabilities: probs };
    }
    return out;
  },

  /**
   * 話し手（見た目）→ 吹き出しのしっぽを向ける人物（main / sub / other）。
   * 語り手は主人公の見た目に置き換える。描いている2人の見た目と合えばその人、合わなければ画面の外の声
   */
  speakerRole(raw, f, { pro, first, hideNarrator }) {
    if (!raw || raw.choice == null) return 'main';
    const o = JV.Schema.byLabel('scene', 'speaker', raw.choice) || JV.Schema.byId('scene', 'speaker', raw.choice);
    const p = raw.probabilities && raw.probabilities[raw.choice] != null ? Number(raw.probabilities[raw.choice]) : Number(raw.confidence || 0);
    if (!o || o.id === 'unknown' || p < 0.3) return 'main';
    if (o.id === 'other') return 'other';
    let type = o.id;
    if (type === 'narrator') {
      if (hideNarrator && first) return 'other';
      if (!pro) return 'main';
      type = pro;
    }
    if (!f || f.layout === 'none') return 'other';
    const isMain = f.main === type, isSub = (f.layout === 'two') && f.sub === type;
    if (isMain && isSub) return o.id === 'narrator' || type === pro ? (f.main === pro ? 'main' : 'sub') : 'main';
    if (isMain) return 'main';
    if (isSub) return 'sub';
    return 'other';
  },

  /**
   * ルール（仕様 7章）
   * 1. scene_changed ≥ しきい値、または location が前と違い confidence ≥ 0.5 → 背景を替える
   * 2. time・weather はしきい値以上の選択肢だけ反映。それ未満は前の値を引き継ぐ
   * 3. 人物レイヤーは背景と独立。people が「誰もいない」なら人物を消す
   * 4. location が「不明」なら背景は前のまま
   * 5. 一度替えた背景は最短5秒は替えない（章替わりは除く）
   */
  decide(answers, { chapter, era = 'modern', hideNarrator = false, protagonist = 'unknown', narration = 'third', lines = [], now = performance.now() } = {}) {
    const a = this.normalize(answers);
    const { th, loc: locTh } = this.thresholds();
    const prev = this.scene;
    const s = prev ? { ...prev, figures: prev.figures && { ...prev.figures } } : { location: null, time: 'day', weather: 'none', mood: 0, figures: null };
    s.era = era;
    const why = [];
    const isChapter = this.lastChapter !== null && chapter !== this.lastChapter;
    let bg = false;

    // 背景
    const L = a.location, sc = a.scene_changed ? a.scene_changed.p : 0;
    if (!L) why.push('背景：判定なし');
    else if (L.id === 'unknown') why.push('背景維持（場所が不明）');
    else if ((() => { const id = JV.Schema.locFor(L.id, era); if (id !== L.id) { L.id = id; L.label = (JV.Schema.byId('scene', 'location', id) || {}).label || id; } return id; })() !== s.location) {
      const byScene = sc >= th && L.confidence >= 0.25;
      const byLoc = L.confidence >= locTh;
      const first = !s.location && (L.confidence >= 0.3 || sc >= th);
      if (!(byScene || byLoc || first)) why.push(`背景維持（確信度不足 ${L.confidence.toFixed(2)}）`);
      else if (s.location && !isChapter && now - this.lastBgAt < this.MIN_BG_MS) why.push('背景維持（最短表示5秒）');
      else { s.location = L.id; bg = true; why.push(`背景 → ${L.label}${byScene ? '（場面転換）' : ''}`); }
    }
    if (!s.location) { why.push('まだ場所が決まらない'); }

    // 時間帯・天候
    const T = a.time;
    if (T && T.id !== 'unknown' && T.p >= th) s.time = T.id;
    const W = a.weather;
    if (bg && !(W && W.p >= th && W.id !== 'none')) s.weather = 'none'; // 場所が変われば天候は書かれ直すまで晴れ
    if (W && W.p >= th && W.id !== 'none') s.weather = W.id;

    // 空気（緊張感）
    if (a.mood) s.mood = a.mood.value;

    // 心象：心の中だけを描く段落では、背景を気持ちの色に替える。そうでない段落が来たら元の背景に戻す
    const I = a.inner, E = a.emotion;
    // 表情：気持ちが読み取れた段落では、その気持ちの顔にする（心の中だけの段落でなくても）
    s.emotion = E && E.id !== 'unknown' && E.confidence >= 0.35 ? E.id : null;
    const wasInner = s.inner || null;
    if (I && I.p >= th && E && E.id !== 'unknown' && E.confidence >= 0.35) s.inner = E.id;
    else s.inner = null;
    if (s.inner !== wasInner) why.push(s.inner ? `心象 → ${E.label}` : '心象おわり');

    // 人物
    const P = a.people, M = a.figure_main, S = a.figure_sub, Po = a.pose;
    const f = s.figures ? { ...s.figures } : { layout: 'one', main: null, sub: null, pose: 'stand' };
    if (P && P.confidence >= locTh) f.layout = P.id;
    // 主人公（作品判定で冒頭から決めた見た目）。途中から読んでも変わらない
    const pro = protagonist && protagonist !== 'unknown' ? protagonist : null;
    const first = narration === 'first';
    const mainSure = M && M.id !== 'unknown' && M.confidence >= 0.35;
    if (mainSure && !(first && f.layout === 'one' && M.confidence < 0.6 && pro)) f.main = M.id;
    else if (pro && (first || !f.main || f.main === 'unknown')) f.main = pro;
    if (!f.main) f.main = 'unknown';
    if (f.layout === 'two' || f.layout === 'many') {
      if (S && S.id !== 'unknown' && S.confidence >= 0.35) f.sub = S.id;
      // 一人称で2人なら、片方は語り手のはず
      if (first && pro && f.layout === 'two' && f.main !== pro) f.sub = pro;
      if (!f.sub) f.sub = 'unknown';
    }
    if (Po && Po.confidence >= 0.4) f.pose = Po.id;
    if (f.pose === 'talk' && f.layout === 'one') f.pose = 'stand';
    // 一人称の作品で「主人物を出さない」設定：語り手を描かず、相手だけを描く
    if (hideNarrator) {
      if (f.layout === 'one') f.main = null;
      if (f.layout === 'two') {
        const other = pro && f.main === pro ? f.sub : (pro && f.sub === pro ? f.main : f.sub);
        f.main = other; f.sub = null; f.layout = 'one';
      }
      if (f.layout === 'many') f.main = null;
    }
    // 動物（登場人物とは別。読み取れた段落だけ出す）
    const An = a.animal;
    f.animal = An && An.id !== 'none' && An.confidence >= 0.4 ? JV.Schema.animalFor(An.id, era) : null;
    if (f.animal !== (prev && prev.figures ? prev.figures.animal || null : null)) why.push(f.animal ? `動物 → ${An.label}` : '動物おわり');
    s.figures = f;

    // 吹き出し：代表のセリフを1つ。重要度が「さりげない」寄りなら出さない
    s.line = null;
    if (lines.length) {
      const raw = answers && answers.line;
      const idx = lines.length === 1 ? 0 : raw && raw.choice != null ? parseInt(String(raw.choice).replace(/\D/g, ''), 10) - 1 : -1;
      const text = lines[idx];
      const imp = a.line_importance ? a.line_importance.value : 0.5;
      if (text && imp >= 0.25) {
        s.line = { text, importance: imp, speaker: this.speakerRole(answers && answers[`speaker_${idx + 1}`], s.figures, { pro, first, hideNarrator }) };
        why.push(`吹き出し「${text.slice(0, 12)}${text.length > 12 ? '…' : ''}」（${s.line.speaker}・重要度 ${imp.toFixed(2)}）`);
      } else if (text) why.push(`吹き出しなし（重要度 ${imp.toFixed(2)}）`);
    }
    if (!s.location) s.figures = { ...f, layout: 'none' };

    const tone = !prev || s.time !== prev.time || s.weather !== prev.weather;
    const chapterFlag = isChapter && !!s.location;
    this.lastChapter = chapter;
    if (bg) this.lastBgAt = now;
    if (chapterFlag && !bg && prev) this.lastBgAt = now;
    this.scene = s;
    const figures = JV.Stage.figuresKey(s) !== (prev ? JV.Stage.figuresKey(prev) : '');
    const inner = (s.inner || null) !== ((prev && prev.inner) || null);
    return { scene: s, bg: bg || (chapterFlag && !!s.location), tone, figures, inner, chapter: chapterFlag && !!prev, why };
  },
};

/* =====================================================================
 * 保存：IndexedDB（作品ハッシュ単位の判定結果と、最近読んだ作品）
 * 使えない環境（プライベートモード等）ではメモリだけで動く
 * ===================================================================== */
JV.Store = {
  DB: 'jev-viewer',
  VERSION: 1,
  dbp: null,

  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise((resolve) => {
      if (!window.indexedDB) { resolve(null); return; }
      let req;
      try { req = indexedDB.open(this.DB, this.VERSION); } catch (_) { resolve(null); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('judgments')) {
          const js = db.createObjectStore('judgments', { keyPath: 'k' });
          js.createIndex('hash', 'hash');
        }
        if (!db.objectStoreNames.contains('works')) {
          const ws = db.createObjectStore('works', { keyPath: 'hash' });
          ws.createIndex('updatedAt', 'updatedAt');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    });
    return this.dbp;
  },

  async tx(store, mode, fn) {
    const db = await this.open();
    if (!db) return undefined;
    return new Promise((resolve) => {
      let out;
      try {
        const t = db.transaction(store, mode);
        const r = fn(t.objectStore(store));
        if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => resolve(out);
        t.onerror = () => resolve(undefined);
        t.onabort = () => resolve(undefined);
      } catch (_) { resolve(undefined); }
    });
  },

  get(store, key) { return this.tx(store, 'readonly', (s) => s.get(key)); },
  put(store, value) { return this.tx(store, 'readwrite', (s) => s.put(value)); },
  del(store, key) { return this.tx(store, 'readwrite', (s) => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', (s) => s.getAll()); },

  /** ある作品の判定結果を消す（hash を省略すると全部） */
  async clearJudgments(hash) {
    if (!hash) return this.tx('judgments', 'readwrite', (s) => s.clear());
    const db = await this.open();
    if (!db) return undefined;
    return new Promise((resolve) => {
      const t = db.transaction('judgments', 'readwrite');
      const req = t.objectStore('judgments').index('hash').openKeyCursor(IDBKeyRange.only(hash));
      req.onsuccess = () => { const c = req.result; if (c) { t.objectStore('judgments').delete(c.primaryKey); c.continue(); } };
      t.oncomplete = () => resolve();
      t.onerror = () => resolve();
    });
  },

  /** 作品ハッシュ：SHA-256（使えなければ FNV-1a を2本） */
  async hash(text) {
    try {
      if (crypto && crypto.subtle) {
        const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(d).slice(0, 16), (b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (_) { /* 下へ */ }
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ text.length;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 ^ c, 0x5bd1e995) >>> 0;
    }
    return `f${h1.toString(16).padStart(8, '0')}${h2.toString(16).padStart(8, '0')}`;
  },
};

/* =====================================================================
 * 判定の呼び出し：作品判定（1回）と場面判定（停止ごと）
 * キャッシュ：メモリ → IndexedDB → 判定器。キーは「作品ハッシュ｜判定器｜判定単位」
 * ===================================================================== */
JV.Judge = {
  SCHEMA_VERSION: 5,    // 質問・state・判定単位の作り方を変えたら上げる（古いキャッシュを使わないため）
  PREFETCH: 3,           // 停止した段落の後ろを何単位先読みするか
  memory: new Map(),
  inflight: new Map(),   // key → { promise, ctl, unit }
  hashKey: '',
  stats: { calls: 0, memoryHits: 0, dbHits: 0, aborted: 0 },

  /** 設定から判定器を選ぶ。キー（中継ならURL）が未設定ならモック */
  adapter() {
    const route = JV.Settings.route();
    if (route === 'mock' || !JV.Adapters.remote.ROUTES[route]) return JV.Adapters.mock;
    // 中継はキーをサーバー側に置けるので、キーなしでも使う。
    // ただし合言葉なしで一般公開の中継を使う場合、公開が終わっていたらモックに戻す
    if (route === 'relay') {
      const pub = JV.App && JV.App.publicRelay;
      const hasPass = !!(JV.Settings.get('relayPass') || '').trim();
      return !hasPass && pub && !pub.open ? JV.Adapters.mock : JV.Adapters.remote;
    }
    const ready = !!(JV.Settings.get('apiKey') || '').trim();
    return ready ? JV.Adapters.remote : JV.Adapters.mock;
  },
  adapterKey() {
    const a = this.adapter();
    return `${a.cacheKey ? a.cacheKey() : a.name}${JV.Settings.get('asciiKeys') ? ':id' : ''}@s${this.SCHEMA_VERSION}`;
  },
  questions(group, lines = [], era = null) { return JV.Schema.toQuestions(group, { asciiKeys: !!JV.Settings.get('asciiKeys'), lines, era }); },
  key(unit) { return `${this.hashKey}|${this.adapterKey()}|${unit}`; },

  setWork(hash) {
    this.abortExcept(new Set());
    this.hashKey = hash;
    this.memory.clear();
  },

  /** 指定の単位以外の進行中リクエストを中断する */
  abortExcept(keep) {
    for (const [k, f] of this.inflight) {
      if (!keep.has(f.unit)) { f.ctl.abort(); this.inflight.delete(k); this.stats.aborted++; }
    }
  },

  /** 場面判定（キャッシュ付き）。同じ単位が判定中ならその結果を待つ */
  async scene(doc, unit, work, prevScene) {
    const k = `${this.key(unit)}|${work.era || 'modern'}`; // 時代で場所の選択肢が変わるので、時代ごとに覚える
    const hit = this.memory.get(k);
    if (hit) { this.stats.memoryHits++; return { ...hit, cached: 'memory' }; }
    const running = this.inflight.get(k);
    if (running) return running.promise;

    const ctl = new AbortController();
    const promise = (async () => {
      const saved = this.hashKey ? await JV.Store.get('judgments', k) : undefined;
      if (saved && saved.answers) {
        const r = { answers: saved.answers, ms: saved.ms, source: saved.source };
        this.memory.set(k, r);
        this.stats.dbHits++;
        return { ...r, cached: 'db' };
      }
      if (ctl.signal.aborted) throw new DOMException('Aborted', 'AbortError');
      this.stats.calls++;
      const r = await this.judgeScene(doc, unit, work, prevScene, { signal: ctl.signal });
      this.memory.set(k, r);
      if (this.hashKey) JV.Store.put('judgments', { k, hash: this.hashKey, unit, answers: r.answers, ms: r.ms, source: r.source, at: Date.now() });
      return r;
    })();
    this.inflight.set(k, { promise, ctl, unit });
    promise.then(() => {}, () => {}).finally(() => { const f = this.inflight.get(k); if (f && f.ctl === ctl) this.inflight.delete(k); });
    return promise;
  },

  /** 作品判定（キャッシュ付き） */
  async work(doc) {
    const k = this.key('work');
    const saved = this.hashKey ? await JV.Store.get('judgments', k) : undefined;
    if (saved && saved.work) return { ...saved.work, cached: true };
    const w = await this.judgeWork(doc);
    this.saveWork(w);
    return w;
  },
  saveWork(w) {
    if (this.hashKey) JV.Store.put('judgments', { k: this.key('work'), hash: this.hashKey, unit: -1, work: { era: w.era, eraOk: w.eraOk, narration: w.narration, protagonist: w.protagonist, raw: w.raw }, at: Date.now() });
  },

  /* 時代の判定し直し：最初の判定で時代が決まらなかった（失敗・確信度が低い）ときだけ、読み進めてからもう一度 */
  ERA_MIN: 0.5,          // これ未満の確信度は「決まらなかった」
  ERA_RETRY_CHARS: 1500, // 前の判定からこれだけ読み進めたら判定し直す
  ERA_RETRY_MAX: 3,      // 判定し直す回数の上限
  ERA_JEV_CHARS: 1500,   // Jev に送るのは新しく読んだ部分の最後のこれだけ（最初の判定の約半分。重くしない）
  eraOf(answers) {
    const a = answers && answers.era;
    const o = a && (JV.Schema.byLabel('work', 'era', a.choice) || JV.Schema.byId('work', 'era', a.choice));
    return o && Number(a.confidence ?? 1) >= this.ERA_MIN ? o.id : null;
  },
  /**
   * 読んだところまで（from〜to 字）で時代だけを判定し直す。
   * Jev が使えるなら新しく読んだ部分の最後の 1,500 字だけを送る。Jev で決まらなければ、
   * 読んだところ全部をモック（キーワード）で調べる（API を使わないので重くない）。決まらなければ null
   */
  async rejudgeEra(doc, from, to, { signal } = {}) {
    const all = doc.units.map((u) => u.text).join('\n');
    const q = { era: this.questions('work').era };
    const adapter = this.adapter();
    if (adapter !== JV.Adapters.mock) {
      try {
        const era = this.eraOf(await adapter.judge(all.slice(Math.max(from, to - this.ERA_JEV_CHARS), to), q, { signal }));
        if (era) return { era, source: 'Jev' };
      } catch (err) { if (JV.util.isAbort(err)) throw err; }
    }
    const era = this.eraOf(await JV.Adapters.mock.judge(all.slice(0, to), q, { signal }));
    return era ? { era, source: 'キーワード' } : null;
  },

  /** 作品判定：冒頭約3,000字 */
  async judgeWork(doc, { signal } = {}) {
    const head = doc.paragraphs.map((p) => p.text.replace(/^[\s　]+/, '')).join('\n').slice(0, 3000);
    const answers = await this.adapter().judge(head, this.questions('work'), { signal });
    const pick = (key, fallback) => {
      const a = answers[key];
      const o = a && (JV.Schema.byLabel('work', key, a.choice) || JV.Schema.byId('work', key, a.choice));
      return o ? o.id : fallback;
    };
    const era = this.eraOf(answers);
    return { era: era || 'modern', eraOk: !!era, eraTo: head.length, narration: pick('narration', 'third'), protagonist: pick('protagonist', 'unknown'), raw: answers };
  },

  /** 場面判定の state：時代・前の場面・直前2段落・現段落 */
  sceneState(doc, unit, work, prevScene) {
    const lab = (key, id) => { const o = id && JV.Schema.byId('scene', key, id); return o ? o.label : '不明'; };
    const era = JV.Schema.byId('work', 'era', work.era);
    const pro = JV.Schema.byId('work', 'protagonist', work.protagonist);
    const narr = JV.Schema.byId('work', 'narration', work.narration);
    return {
      era: era ? era.label : '近代日本',
      // 作品判定（冒頭から）で分かった主人公。一人称の「私」が誰かを場面判定に伝える
      protagonist: `${pro ? pro.label : '不明'}（${narr && narr.id === 'first' ? '一人称の語り手' : '三人称の中心人物'}）`,
      previous_scene: { location: lab('location', prevScene && prevScene.location), time: lab('time', prevScene && prevScene.time) },
      context_before: JV.Reader.contextBefore(unit),
      current: doc.units[unit].text,
    };
  },

  async judgeScene(doc, unit, work, prevScene, { signal } = {}) {
    const state = this.sceneState(doc, unit, work, prevScene);
    const t0 = performance.now();
    const answers = await this.adapter().judge(state, this.questions('scene', JV.Parser.quoteItems(doc.units[unit].text), work.era), { signal });
    return { answers, ms: Math.round(performance.now() - t0), source: this.adapter().name };
  },

  /** デバッグ表示用：判定結果と確率を短く */
  describe(answers) {
    const lines = [];
    for (const [key, a] of Object.entries(answers || {})) {
      if (a.type === 'noul' || 'noul' in a) { lines.push(`${key}: ${Number(a.noul).toFixed(2)}`); continue; }
      if (a.type === 'score' || !('choice' in a)) { lines.push(`${key}: ${Number(a.score).toFixed(2)}`); continue; }
      const top = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]).slice(0, 3)
        .map(([k, p]) => `${k} ${p.toFixed(2)}`).join('  ');
      lines.push(`${key}: ${top}`);
    }
    return lines.join('\n');
  },
};

/* =====================================================================
 * 読書画面：本文の描画
 * ===================================================================== */
JV.Reader = {
  doc: null,

  render(doc) {
    this.doc = doc;
    const root = document.getElementById('text');
    root.textContent = '';
    const frag = document.createDocumentFragment();
    let lastChapter = -1;
    for (const p of doc.paragraphs) {
      if (p.chapter !== lastChapter) {
        lastChapter = p.chapter;
        const title = doc.chapters[p.chapter] && doc.chapters[p.chapter].title;
        if (title) {
          const h = document.createElement('h2');
          h.className = 'chapter-title';
          h.dataset.chapter = p.chapter;
          h.textContent = title;
          frag.appendChild(h);
        }
      }
      if (p.breakBefore) {
        const b = document.createElement('div');
        b.className = 'scene-break';
        b.textContent = '◇';
        frag.appendChild(b);
      }
      const el = document.createElement('p');
      el.className = 'para';
      el.dataset.p = p.i;
      for (const si of p.segs) {
        const seg = doc.segments[si];
        const span = document.createElement('span');
        span.className = 'seg';
        span.dataset.s = seg.i;
        span.dataset.u = seg.unit;
        span.textContent = seg.text;
        el.appendChild(span);
      }
      frag.appendChild(el);
    }
    const end = document.createElement('div');
    end.className = 'end-mark';
    end.textContent = '（おわり）';
    frag.appendChild(end);
    root.appendChild(frag);

    document.getElementById('work-title').textContent = doc.title + (doc.author ? `　${doc.author}` : '');
    this.setChapterName(0);
  },

  setChapterName(ci) {
    const ch = this.doc && this.doc.chapters[ci];
    document.getElementById('chapter-name').textContent = ch && ch.title ? ch.title : '';
  },

  /** 判定単位 u の断片に印をつける（デバッグ表示時に枠線） */
  markCurrent(u) {
    document.querySelectorAll('#text .seg.current').forEach((el) => el.classList.remove('current'));
    document.querySelectorAll(`#text .seg[data-u="${u}"]`).forEach((el) => el.classList.add('current'));
  },

  /**
   * 判定単位 u の直前の文脈（場面判定の context_before 用）。長さをそろえるため字数で区切る
   * （約 CONTEXT_CHARS 字。章はまたがない。文の途中から始まらないよう、なるべく文頭で切る）
   */
  contextBefore(u, chars = JV.Parser.CONTEXT_CHARS) {
    const doc = this.doc;
    const unit = doc.units[u];
    const first = unit.segs[0];
    const parts = [];
    let len = 0;
    for (let i = first - 1; i >= 0 && len < chars; i--) {
      const seg = doc.segments[i];
      if (doc.paragraphs[seg.para].chapter !== unit.chapter) break;
      const t = seg.text.replace(/^[\s　]+/, '');
      parts.unshift(t);
      len += t.length + 1;
    }
    let text = parts.join('\n');
    if (text.length > chars) {
      text = text.slice(text.length - chars);
      const cut = text.search(/[。！？」』\n]/);
      if (cut >= 0 && cut < chars * 0.3) text = text.slice(cut + 1);
    }
    return text.replace(/^\n+/, '');
  },
};

/* =====================================================================
 * 起動画面の見本：サンプルの一文と、その場面の手描きの絵を順に見せる
 * ===================================================================== */
JV.HomeScene = {
  SCENES: [
    { line: '朝の座敷には、障子越しに淡い光がさしていた。', location: 'washitsu', time: 'morning', era: 'modern', figures: { layout: 'one', main: 'man', pose: 'sit' }, expr: 'calm' },
    { line: '夜更けの停車場は、雪になっていた。', location: 'station', time: 'night', era: 'modern', figures: { layout: 'two', main: 'man', sub: 'woman', pose: 'stand' }, expr: 'anxiety', snow: 1 },
    { line: '夕方になると、浜辺に人影はなくなった。', location: 'seaside', time: 'evening', era: 'present', figures: { layout: 'one', main: 'woman', pose: 'walk' }, expr: 'sadness' },
    { line: '昼近くになって、ようやく霧が晴れた。', location: 'forest', time: 'day', era: 'modern', figures: { layout: 'two', main: 'boy', sub: 'girl', pose: 'walk' }, expr: 'joy' },
  ],
  HOLD: 5200, FADE: 900,
  i: 0, prev: null, t0: 0, tg: null, last: 0,
  init() {
    const c = document.getElementById('home-scene');
    if (!c || !window.Tegaki || !window.Draw) return;
    this.canvas = c;
    this.still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.t0 = performance.now();
    const tick = () => { requestAnimationFrame(tick); this.tick(); };
    requestAnimationFrame(tick);
  },
  resize() {
    const r = this.canvas.getBoundingClientRect();
    const w = Math.max(320, Math.min(1280, Math.round((r.width || 600) * Math.min(window.devicePixelRatio || 1, 1.5))));
    const h = Math.round(w * 9 / 16);
    if (this.tg && this.canvas.width === w) return;
    this.canvas.width = w; this.canvas.height = h;
    this.tg = Tegaki.create(this.canvas, { style: 'paper', paper: 0.4, vignette: 0.18, grain: 0.05, fps: this.still ? 0 : 12 });
    this.last = 0;
  },
  draw(sc, t) {
    const tg = this.tg, L = Draw.layout(tg);
    Draw.background(tg, L, sc, t);
    Draw.figures(tg, L, { figures: sc.figures, era: sc.era, time: sc.time, location: sc.location, expr: sc.expr, subExpr: 'normal' }, t);
    if (sc.snow) Draw.weather(tg, L, { snow: sc.snow, rain: 0, cloudy: 0.5, fog: 0 }, t);
  },
  tick() {
    const home = document.getElementById('home');
    if (!this.tg || document.hidden || (home && home.classList.contains('hidden'))) return;
    const now = performance.now();
    if (this.still) { if (this.last) return; } else if (now - this.last < 83) return;
    this.last = now;
    // 場面を順に替える（動きを減らす設定では最初の場面のまま）
    if (!this.still && now - this.t0 > this.HOLD) {
      this.prev = this.SCENES[this.i]; this.i = (this.i + 1) % this.SCENES.length; this.t0 = now;
      const cap = document.getElementById('home-line');
      cap.classList.add('fading');
      setTimeout(() => { cap.textContent = this.SCENES[this.i].line; cap.classList.remove('fading'); }, 450);
    }
    const tg = this.tg, c = tg.ctx, t = now / 1000, k = Math.min(1, (now - this.t0) / this.FADE);
    tg.setTime(t);
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, tg.W, tg.H);
    if (this.prev && k < 1) { this.draw(this.prev, t); c.globalAlpha = k; }
    this.draw(this.SCENES[this.i], t);
    c.globalAlpha = 1;
    tg.post();
  },
};

/* =====================================================================
 * アプリ全体
 * ===================================================================== */
JV.App = {
  SAMPLES: [
    { file: 'samples/ame_no_teishaba.txt', label: '雨の停車場', note: '青空文庫の形式' },
    { file: 'samples/shuden_no_ato.txt', label: '終電のあとで', note: '現代劇' },
    { file: 'samples/ryu_no_yubinya.md', label: '竜の郵便屋', note: 'ファンタジー' },
    { file: 'samples/doukutsu_no_kage.md', label: '洞窟の影', note: 'ファンタジー・剣と魔物' },
    { file: 'samples/otera_no_neko.txt', label: 'お寺の猫', note: '現代劇・猫とおばけ' },
  ],

  init() {
    JV.Settings.load();
    JV.Stage.init();
    JV.HomeScene.init();
    this.applySettings();
    this.fetchPublicStatus();
    JV.Debug.set('assets', '描画: 手描き（tegaki.js・canvas）');
    this.renderSamples();
    this.renderRecent();
    this.setupDrop();
    window.addEventListener('popstate', () => { if (!location.hash) this.showHome(); });
    // デバッグ表示の切り替え（D キー。設定画面からも切り替えられる）
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('settings').classList.contains('hidden')) { JV.SettingsUI.close(); return; }
      if (e.key.toLowerCase() === 'd' && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
        JV.Settings.set('debug', !JV.Settings.get('debug'));
        JV.Debug.render();
      }
    });
    JV.Debug.render();
  },

  toggleEffects() {
    JV.Settings.set('effects', !JV.Settings.get('effects'));
    this.applyEffects();
    if (!this.doc || document.getElementById('reader').classList.contains('hidden')) return;
    if (JV.Settings.get('effects')) {
      // オフの間の場面は見ていないので、いまの位置から組み立て直す
      JV.Director.reset();
      JV.Stage.reset();
      JV.StopDetector.fire(true);
    } else JV.Judge.abortExcept(new Set());
  },

  /** 設定を画面に反映（文字サイズ・人物・デバッグなど） */
  applySettings() {
    document.documentElement.style.setProperty('--font-size', `${Number(JV.Settings.get('fontSize')) || 18}px`);
    const illust = JV.Settings.get('displayMode') === 'illust';
    document.body.classList.toggle('illust', illust);
    document.body.classList.toggle('novel', !illust);
    JV.StopDetector.refresh();
    this.applyEffects();
    JV.Debug.render();
    const a = JV.Judge.adapter();
    const route = JV.Settings.route();
    const r = JV.Adapters.remote.ROUTES[route];
    const pub = this.publicRelay;
    const isPublic = a === JV.Adapters.remote && route === 'relay' && !(JV.Settings.get('relayPass') || '').trim();
    let status;
    if (isPublic && pub && pub.open) status = `判定：Jev（一般公開中${pub.until ? `・${pub.until.slice(5).replace('-', '/')}まで` : ''}）`;
    else if (a !== JV.Adapters.remote || !r) status = route === 'mock' || !r ? '判定：簡易（キーワード）' : `判定：簡易（${pub && !pub.open ? this.closedLabel(pub.reason) : `${r.label} は未設定`}）`;
    else status = `判定：${r.label}・${JV.Settings.get('model')}`;
    const el = document.getElementById('route-status');
    if (el) el.textContent = status;
  },

  /** 判定器に関わる設定が変わったら、作品判定からやり直す */
  onSettingsClosed(judgeChanged, sceneChanged) {
    if (!this.doc || document.getElementById('reader').classList.contains('hidden')) return;
    if (sceneChanged && !judgeChanged) {
      // 主人公を直した：判定はそのまま、絵だけ組み立て直す
      JV.Director.reset();
      JV.Stage.reset();
    }
    if (judgeChanged) {
      JV.Judge.abortExcept(new Set());
      JV.Judge.memory.clear();
      this.startWorkJudgment();
    }
    JV.StopDetector.fire(true);
  },

  applyEffects() {
    const on = JV.Settings.get('effects');
    document.body.classList.toggle('effects-off', !on);
    document.body.classList.toggle('no-silhouettes', !JV.Settings.get('silhouettes'));
    JV.StopDetector.refresh(); // 挿絵モードでは演出の有無で本文の中央が変わる
    const b = document.getElementById('effects-toggle');
    b.setAttribute('aria-pressed', String(on));
    b.textContent = on ? '演出 オン' : '演出 オフ';
  },

  /** スクロール停止時：画面中央の判定単位が変わったときだけ呼ばれる */
  onStop({ unit }) {
    const doc = this.doc;
    const u = doc.units[unit];
    this.currentUnit = unit;
    JV.Reader.markCurrent(unit);
    JV.Reader.setChapterName(u.chapter);
    JV.Debug.set('unit', `単位 #${unit}（段落 ${u.paraStart}${u.paraEnd !== u.paraStart ? `〜${u.paraEnd}` : ''}・${u.text.length}字・章 ${u.chapter}）\n${u.text.slice(0, 60).replace(/\n/g, ' / ')}${u.text.length > 60 ? '…' : ''}`);
    this.saveProgress(unit);
    if (JV.Settings.get('effects')) this.judgeAndShow(unit);
  },

  /** サイトの中継が一般公開中かを調べる（Netlify のときだけ。GitHub Pages や file:// では何もしない） */
  async fetchPublicStatus() {
    if (!/^https?:$/.test(location.protocol)) return;
    try {
      const pass = (JV.Settings.get('relayPass') || '').trim();
      const res = await fetch('v1/relay-status', { cache: 'no-store', headers: pass ? { 'X-Relay-Passphrase': pass } : {} });
      if (!res.ok || !(res.headers.get('Content-Type') || '').includes('json')) return;
      const st = await res.json();
      if (typeof st.open !== 'boolean') return;
      this.publicRelay = st;
      this.applySettings();
    } catch (_) { /* 中継のない場所 */ }
  },

  closedLabel(reason) {
    return { closed: '一般公開は終了', stopped: '一般公開は一時停止中', limit: '今日の上限に到達' }[reason] || '一般公開なし';
  },

  /**
   * 合言葉なしで中継を使っていて「公開していない」と断られたら、モック（キーワード判定）に切り替えて知らせる。
   * 処理したら true
   */
  handlePublicClosed(err) {
    const code = err && err.status === 403 && err.detail && err.detail.code;
    if (!['closed', 'stopped', 'limit'].includes(code)) return false;
    this.publicRelay = { ...(this.publicRelay || {}), open: false, reason: code };
    this.applySettings();
    const msg = {
      closed: '一般公開の期間が終わったため、簡易判定（キーワード）で表示しています。',
      stopped: '一般公開を一時停止しているため、簡易判定（キーワード）で表示しています。',
      limit: '今日の利用上限に達したため、簡易判定（キーワード）で表示しています。明日また本物の判定が使えます。',
    }[code];
    this.notify(msg);
    JV.Debug.set('judge', `中継：${this.closedLabel(code)} → 簡易判定に切り替え`);
    if (this.doc) {
      JV.Judge.abortExcept(new Set());
      this.startWorkJudgment();
      JV.StopDetector.fire(true);
    }
    return true;
  },

  notify(msg, ms = 8000) {
    const el = document.getElementById('notice');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(this.noticeTimer);
    this.noticeTimer = setTimeout(() => el.classList.add('hidden'), ms);
  },

  /** 主人公の見た目：作品ごとの手動指定 → 作品判定 → 不明 */
  protagonist() {
    return this.protagonistOverride || (this.work && this.work.protagonist) || 'unknown';
  },

  /** 設定画面から主人公を手動で指定（'' で自動に戻す）。作品ごとに保存 */
  async setProtagonist(id) {
    this.protagonistOverride = id || '';
    if (this.hash) {
      const rec = await JV.Store.get('works', this.hash);
      if (rec) { rec.protagonist = this.protagonistOverride; JV.Store.put('works', rec); }
    }
  },

  /** 作品を開いたときに1回だけ：時代・語りの人称・主人公 */
  startWorkJudgment() {
    const doc = this.doc;
    this.work = { era: 'modern', eraOk: false, narration: 'third', protagonist: 'unknown' };
    this.eraRetry = { tries: 0, from: 0, busy: false };
    this.workReady = this.hashReady
      .then(() => JV.Judge.work(doc))
      .then((w) => {
        if (this.doc !== doc) return;
        this.work = w;
        // 前の版で保存した判定には eraOk がない：そのときは決まったものとして扱う
        if (w.eraOk === undefined) w.eraOk = true;
        this.eraRetry.from = Math.min(w.eraTo || 3000, 3000);
        const pro = JV.Schema.byId('work', 'protagonist', this.protagonist());
        JV.Debug.set('work', `作品: ${JV.Schema.byId('work', 'era', w.era).label}・${JV.Schema.byId('work', 'narration', w.narration).label}・主人公 ${pro ? pro.label : '不明'}${this.protagonistOverride ? '（手動）' : ''}${w.cached ? '（キャッシュ）' : ''}${w.eraOk ? '' : '・時代は未確定（読み進めてから判定し直す）'}`);
      })
      .catch((err) => {
        if (this.handlePublicClosed(err)) return;
        JV.Debug.set('work', `作品判定エラー: ${err.message || err}（近代日本・三人称として扱い、時代は読み進めてから判定し直す）`);
      });
  },

  /** 時代が決まっていなければ、読み進めた量に応じて裏で判定し直す。決まったら絵を組み立て直す */
  maybeRetryEra(unit) {
    const doc = this.doc, R = this.eraRetry, J = JV.Judge;
    if (!doc || !R || this.work.eraOk || R.busy || R.tries >= J.ERA_RETRY_MAX) return;
    let to = 0;
    for (let i = 0; i <= unit && i < doc.units.length; i++) to += doc.units[i].text.length + 1;
    if (to < R.from + J.ERA_RETRY_CHARS) return;
    R.busy = true; R.tries++;
    const from = R.from;
    J.rejudgeEra(doc, from, to).then((r) => {
      if (this.doc !== doc) return;
      R.from = to;
      if (!r) { JV.Debug.set('work', `時代の判定し直し ${R.tries}回目：まだ決まらない（${JV.Schema.byId('work', 'era', this.work.era).label}のまま）`); return; }
      const changed = r.era !== this.work.era;
      this.work = { ...this.work, era: r.era, eraOk: true };
      J.saveWork(this.work);
      JV.Debug.set('work', `時代を判定し直した（${r.source}・${R.tries}回目）：${JV.Schema.byId('work', 'era', r.era).label}`);
      if (changed) { JV.Director.reset(); JV.Stage.reset(); JV.StopDetector.fire(true); }
    }).catch((err) => {
      if (!JV.util.isAbort(err)) JV.Debug.set('work', `時代の判定し直しエラー: ${err.message || err}`);
    }).finally(() => { R.busy = false; });
  },

  /**
   * 停止した単位を判定して見せ、後ろの3単位を裏で先読みする。
   * 新しい停止が来たら、その単位と先読み範囲以外の進行中リクエストは中断する。
   */
  async judgeAndShow(unit) {
    const doc = this.doc;
    const ahead = [];
    for (let i = 1; i <= JV.Judge.PREFETCH && unit + i < doc.units.length; i++) ahead.push(unit + i);
    JV.Judge.abortExcept(new Set([unit, ...ahead]));
    try {
      await this.workReady;
      if (this.doc !== doc) return;
      this.maybeRetryEra(unit);
      const r = await JV.Judge.scene(doc, unit, this.work, JV.Director.scene);
      if (this.doc !== doc || this.currentUnit !== unit || !JV.Settings.get('effects')) return;
      this.present(unit, r);
      // 先読み：いま決まった場面を「前の場面」として渡す
      const prev = JV.Director.scene;
      for (const n of ahead) {
        JV.Judge.scene(doc, n, this.work, prev).catch((err) => {
          if (!JV.util.isAbort(err)) JV.Debug.set('prefetch', `先読みエラー #${n}: ${err.message || err}`);
        });
      }
    } catch (err) {
      if (JV.util.isAbort(err)) return;
      if (this.handlePublicClosed(err)) return;
      JV.Debug.set('judge', `判定エラー: ${err.message || err}（前の絵を維持）`);
    }
  },

  /** 判定結果 → 場面を決めて演出 */
  present(unit, r) {
    const u = this.doc.units[unit];
    const plan = JV.Director.decide(r.answers, {
      chapter: u.chapter,
      era: this.work.era,
      hideNarrator: this.work.narration === 'first' && JV.Settings.get('hideNarrator'),
      protagonist: this.protagonist(),
      narration: this.work.narration,
      lines: JV.Parser.quotes(u.text),
    });
    if (JV.Settings.get('effects')) JV.Stage.show(plan);
    const changes = [plan.chapter && '章替わり', plan.tone && '色調・天候', plan.figures && '人物', plan.inner && '心象'].filter(Boolean);
    const src = r.cached ? `キャッシュ(${r.cached === 'db' ? 'IndexedDB' : 'メモリ'})` : `${r.ms}ms`;
    const st = JV.Judge.stats;
    JV.Debug.set('judge', `判定 #${unit}（${r.source}・${src}）\n${JV.Judge.describe(r.answers)}\n→ ${[...plan.why, ...changes].join(' / ') || '変化なし'}`);
    JV.Debug.set('stats', `呼び出し ${st.calls}・メモリ ${st.memoryHits}・DB ${st.dbHits}・中断 ${st.aborted}・判定中 ${JV.Judge.inflight.size}`);
  },

  /** 読んだ位置を最近読んだ作品に記録（1秒に1回まで） */
  saveProgress(unit) {
    this.progressUnit = unit;
    if (this.progressTimer) return;
    this.progressTimer = setTimeout(async () => {
      this.progressTimer = 0;
      const hash = this.hash;
      if (!hash) return;
      const rec = await JV.Store.get('works', hash);
      if (rec) { rec.lastUnit = this.progressUnit; rec.updatedAt = Date.now(); JV.Store.put('works', rec); }
    }, 1000);
  },

  async renderRecent() {
    const works = ((await JV.Store.all('works')) || []).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 10);
    const sec = document.getElementById('recent-section');
    const ul = document.getElementById('recent-list');
    ul.textContent = '';
    sec.classList.toggle('hidden', works.length === 0);
    for (const w of works) {
      const li = document.createElement('li');
      li.className = 'recent-item';
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="name"></span><span class="meta"></span>';
      b.children[0].textContent = w.title + (w.author ? `　${w.author}` : '');
      const d = new Date(w.updatedAt);
      const pct = w.unitCount ? Math.round(((w.lastUnit || 0) + 1) / w.unitCount * 100) : 0;
      b.children[1].textContent = `${d.getMonth() + 1}/${d.getDate()}・${pct}%`;
      b.onclick = () => this.openText(w.text, w.name, { resumeUnit: w.lastUnit });
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '履歴と判定キャッシュを削除';
      del.setAttribute('aria-label', `${w.title} を履歴から削除`);
      del.textContent = '×';
      del.onclick = async () => { await JV.Store.del('works', w.hash); await JV.Store.clearJudgments(w.hash); this.renderRecent(); };
      li.append(b, del);
      ul.appendChild(li);
    }
  },

  renderSamples() {
    const ul = document.getElementById('sample-list');
    ul.textContent = '';
    for (const s of this.SAMPLES) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span></span><span class="meta"></span>';
      b.children[0].textContent = s.label;
      b.children[1].textContent = s.note;
      b.onclick = () => this.openSample(s);
      li.appendChild(b);
      ul.appendChild(li);
    }
  },

  setupDrop() {
    const zone = document.getElementById('drop-zone');
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    ['dragenter', 'dragover'].forEach((ev) => zone.addEventListener(ev, (e) => { stop(e); zone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach((ev) => zone.addEventListener(ev, (e) => { stop(e); zone.classList.remove('dragover'); }));
    zone.addEventListener('drop', (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) this.openFile(f);
    });
    // ゾーン外へのドロップでブラウザがファイルを開いてしまうのを防ぐ
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());
  },

  onFileInput(input) {
    const f = input.files && input.files[0];
    if (f) this.openFile(f);
    input.value = '';
  },

  async openFile(file) {
    try {
      const buf = await file.arrayBuffer();
      if (JV.Zip.isZip(buf)) {
        const { name, bytes } = await JV.Zip.extractText(buf);
        this.openText(JV.Encoding.decode(bytes), name);
        return;
      }
      this.openText(JV.Encoding.decode(buf), file.name);
    } catch (err) {
      this.showError(`ファイルを読み込めませんでした：${err.message || err}`);
    }
  },

  async onUrlSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('url-input');
    const btn = document.getElementById('url-submit');
    const url = input.value.trim();
    if (!url) return;
    btn.disabled = true;
    btn.textContent = '読み込み中…';
    this.hideError();
    try {
      const { text, name } = await JV.Aozora.load(url);
      input.value = '';
      this.openText(text, name);
    } catch (err) {
      this.showError(err.message || String(err));
    } finally {
      btn.disabled = false;
      btn.textContent = '読み込む';
    }
  },

  async openSample(s) {
    try {
      const res = await fetch(s.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      this.openText(JV.Encoding.decode(buf), s.file.split('/').pop());
    } catch (err) {
      this.showError(`サンプルを読み込めませんでした（file:// で開いている場合は、ローカルサーバー経由で開くかファイルを直接選んでください）：${err.message || err}`);
    }
  },

  openText(text, name, { resumeUnit = null } = {}) {
    const doc = JV.Parser.parse(text, name);
    if (!doc.paragraphs.length) { this.showError('本文が見つかりませんでした。'); return; }
    this.doc = doc;
    this.hash = '';
    this.hideError();
    JV.Reader.render(doc);
    JV.Debug.clear();
    JV.Director.reset();
    JV.Stage.reset();
    // 作品ハッシュ → キャッシュの切り替えと、最近読んだ作品への登録
    JV.Judge.setWork('');
    this.hashReady = JV.Store.hash(text).then(async (hash) => {
      if (this.doc !== doc) return;
      this.hash = hash;
      JV.Judge.setWork(hash);
      const old = await JV.Store.get('works', hash);
      this.protagonistOverride = (old && old.protagonist) || '';
      await JV.Store.put('works', {
        hash, name, text, title: doc.title, author: doc.author, format: doc.format,
        unitCount: doc.units.length, lastUnit: old ? old.lastUnit : 0, updatedAt: Date.now(),
        protagonist: this.protagonistOverride,
      });
    });
    this.startWorkJudgment();
    this.showReader();
    if (resumeUnit > 0 && resumeUnit < doc.units.length) {
      const el = document.querySelector(`#text .seg[data-u="${resumeUnit}"]`);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2 + 4);
    }
    JV.StopDetector.attach(document.getElementById('text'), (e) => this.onStop(e));
  },

  showReader() {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('reader').classList.remove('hidden');
    if (location.hash !== '#read') history.pushState(null, '', '#read');
    window.scrollTo(0, 0);
  },

  goHome() {
    if (location.hash === '#read') history.back();
    else this.showHome();
  },

  showHome() {
    JV.StopDetector.detach();
    JV.Judge.abortExcept(new Set());
    document.getElementById('reader').classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
    window.scrollTo(0, 0);
    this.renderRecent();
  },

  showError(msg) {
    const el = document.getElementById('home-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  },
  hideError() { document.getElementById('home-error').classList.add('hidden'); },
};

if (location.hash) history.replaceState(null, '', location.pathname + location.search);
JV.App.init();
</script>
</body>
