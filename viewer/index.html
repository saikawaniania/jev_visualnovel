<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev サウンドノベル・ビューア</title>
<style>
:root {
  --bg: #0d0f14;
  --fg: #e8e6e1;
  --muted: #9a978f;
  --accent: #c9a86a;
  --panel: rgba(16, 18, 24, 0.92);
  --line: rgba(255, 255, 255, 0.12);
  --font-size: 18px;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
  --sans: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;
}
button:hover { background: rgba(255, 255, 255, 0.12); }
.hidden { display: none !important; }

/* ---------- 起動画面 ---------- */
#home {
  min-height: 100vh;
  max-width: 640px;
  margin: 0 auto;
  padding: 48px 16px 64px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
#home h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 26px;
  letter-spacing: 0.08em;
  margin: 0;
}
#home .lead { color: var(--muted); font-size: 14px; line-height: 1.8; margin: 8px 0 0; }
#drop-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 180px;
  border: 2px dashed rgba(201, 168, 106, 0.5);
  border-radius: 12px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
#drop-zone.dragover { background: rgba(201, 168, 106, 0.08); border-color: var(--accent); }
#drop-zone .big { font-size: 17px; }
#drop-zone .small { font-size: 13px; color: var(--muted); }
#file-input { display: none; }
#home section h2 {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin: 0 0 10px;
}
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list button {
  width: 100%;
  text-align: left;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
}
.list .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
#home-error { color: #f0a0a0; font-size: 14px; }
#url-form { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
#url-form .url-row { display: flex; gap: 8px; }
#url-form input { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: #0f1115; }
#url-form small { color: var(--muted); font-size: 12px; }
.recent-item { display: flex; gap: 6px; }
.recent-item > button:first-child { flex: 1; min-width: 0; }
.recent-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item .del { width: auto; flex: none; padding: 0 14px; color: var(--muted); }
#home-footer { display: flex; gap: 12px; align-items: center; }
#home-footer .meta { color: var(--muted); font-size: 12px; }

/* ---------- 読書画面 ---------- */
#reader { position: relative; min-height: 100vh; }
#reader-top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0));
  font-size: 13px;
  pointer-events: none;
}
#reader-top > * { pointer-events: auto; }
#reader-top .titles { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#reader-top .work-title { font-family: var(--serif); font-size: 15px; }
#reader-top .chapter-name { color: var(--muted); margin-left: 10px; }
#reader-top button { padding: 4px 10px; font-size: 12px; background: rgba(0, 0, 0, 0.4); }

#text-column {
  position: relative;
  z-index: 10;
  max-width: 760px;
  margin: 0 auto;
  padding: 64px 16px 60vh;
}
#text {
  font-family: var(--serif);
  font-size: var(--font-size);
  line-height: 1.95;
  letter-spacing: 0.03em;
}
#text p { margin: 0 0 0.35em; }
#text .chapter-title {
  font-size: 1.25em;
  font-weight: 500;
  margin: 2.4em 0 1.2em;
  letter-spacing: 0.12em;
}
#text .chapter-title:first-child { margin-top: 0.6em; }
#text .scene-break { text-align: center; color: var(--muted); margin: 1.6em 0; letter-spacing: 1em; }
#text .end-mark { text-align: center; color: var(--muted); margin: 3em 0 0; font-size: 0.85em; }

/* ノベルモード：絵を全画面に固定し、本文は半透明の暗い帯の上に流す */
#stage {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #1b1d22;
}
#stage .layer { position: absolute; inset: 0; pointer-events: none; }
#stage canvas.layer { width: 100%; height: 100%; }
/* 1 背景（2枚でクロスフェード）。仮素材は場所名入りのグラデーション */
#stage .bgs { z-index: 0; }  /* クロスフェード用の z-index を背景の中に閉じ込める */
#stage .bg { opacity: 0; background-size: cover; background-position: center; }
#stage .bg-label {
  position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
  font-family: var(--serif); font-size: clamp(28px, 9vw, 72px); letter-spacing: 0.3em;
  color: rgba(255, 255, 255, 0.10); white-space: nowrap;
}
/* 2 色調（時間帯） */
#stage .tint { opacity: 0; }
#stage .tint-morning { background: rgba(150, 190, 255, 0.28); mix-blend-mode: soft-light; }
#stage .tint-evening { background: linear-gradient(to bottom, rgba(255, 120, 40, 0.55), rgba(190, 70, 60, 0.35)); mix-blend-mode: multiply; }
/* 夜：真っ黒にしない。紺で沈めつつ、空を月明かりで少し明るく残し、黒いシルエットが空に浮かぶようにする */
#stage .tint-night { background: rgb(88, 108, 178); mix-blend-mode: multiply; }
#stage .tint-night-dim {
  background:
    radial-gradient(ellipse 120% 70% at 50% 0%, rgba(150, 170, 230, 0.38), rgba(150, 170, 230, 0) 70%),
    linear-gradient(to bottom, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 16, 0.18));
  mix-blend-mode: screen;
}
/* 夜はシルエットに細い縁の光を付けて、暗い背景でも輪郭が見えるようにする */
#stage.is-night .fig img { filter: drop-shadow(0 0 1.5px rgba(200, 212, 255, 0.6)) drop-shadow(0 0 12px rgba(150, 170, 240, 0.35)); }
#stage.is-night .fig.pos-left img, #stage.is-night .figures.face-right .fig img { filter: drop-shadow(0 0 1.5px rgba(200, 212, 255, 0.6)) drop-shadow(0 0 12px rgba(150, 170, 240, 0.35)); }
/* 3 天候（曇り・霧。雨雪は canvas） */
#stage .cloudy { opacity: 0; background: rgba(110, 115, 125, 0.30); mix-blend-mode: multiply; }
#stage .fog { opacity: 0; background: linear-gradient(to top, rgba(225, 228, 232, 0.75), rgba(220, 224, 230, 0.35) 55%, rgba(220, 224, 230, 0.15)); }
/* 4 人物シルエット */
#stage .figures { opacity: 0; }
body.no-silhouettes #stage .figures { display: none; }
#stage .fig { position: absolute; bottom: 0; height: 72vh; transform: translateX(-50%); }
#stage .fig img { height: 100%; width: auto; display: block; }
#stage .fig.pos-solo { left: 60%; }
#stage .fig.pos-right { left: 70%; }
#stage .fig.pos-left { left: 30%; }
/* シルエットは画面左向きに描く前提（manifest の silFacing: "right" なら逆）。主人物と向かい合わせる */
#stage .fig.pos-left img { transform: scaleX(-1); }
#stage .figures.face-right .fig img { transform: scaleX(-1); }
#stage .figures.face-right .fig.pos-left img, #stage .figures.face-right .fig.pos-crowd img { transform: none; }
#stage .fig.pos-front { left: 62%; height: 76vh; }
#stage .fig.pos-crowd { left: 45%; bottom: 7vh; height: 46vh; opacity: 0.6; filter: blur(0.6px); }
/* 5 空気（周辺減光。彩度は .scene の filter） */
#stage .vignette { opacity: 0.15; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.9) 100%); }
#stage .blackout { background: #000; opacity: 0; }
body.novel #text-column {
  background: linear-gradient(to right, rgba(8, 10, 14, 0) 0, rgba(8, 10, 14, 0.5) 32px, rgba(8, 10, 14, 0.5) calc(100% - 32px), rgba(8, 10, 14, 0) 100%);
  color: #f3f1ec;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.9);
}
@media (max-width: 700px) {
  body.novel #text-column { background: rgba(8, 10, 14, 0.5); }
}
body.effects-off #stage { display: none; }
body.effects-off #text-column { background: transparent; box-shadow: none; }

#effects-toggle {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 30;
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
}
#effects-toggle[aria-pressed="false"] { color: var(--muted); }

/* デバッグ表示 */
#debug {
  position: fixed;
  left: 8px;
  bottom: 8px;
  z-index: 40;
  max-width: min(360px, calc(100vw - 120px));
  max-height: 45vh;
  overflow: auto;
  padding: 8px 10px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.78);
  color: #cfe8cf;
  font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
  pointer-events: none;
}
body.debug #text .seg.current { outline: 1px dashed rgba(160, 230, 160, 0.7); outline-offset: 2px; }
body.debug #center-line {
  position: fixed; left: 0; right: 0; top: 50%; height: 0; z-index: 35;
  border-top: 1px dashed rgba(160, 230, 160, 0.35); pointer-events: none;
}

/* 設定画面 */
#settings {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0, 0, 0, 0.6);
  display: flex; justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 24px 16px;
}
#settings .sheet {
  width: 100%; max-width: 560px;
  background: #16181e; border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px 20px;
}
#settings header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#settings h2 { margin: 0; font-size: 18px; font-weight: 600; }
#settings fieldset { border: 0; border-top: 1px solid var(--line); margin: 12px 0 0; padding: 12px 0 0; display: flex; flex-direction: column; gap: 12px; }
#settings legend { color: var(--accent); font-size: 13px; letter-spacing: 0.1em; padding: 0 8px 0 0; }
#settings label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
#settings label.check { flex-direction: row; align-items: center; gap: 8px; }
#settings input[type="text"], #settings input[type="url"], #settings input[type="password"], #settings input[type="number"], #settings select {
  width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: #0f1115;
}
#settings small, #settings .note { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
#settings .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#settings .result { font-size: 13px; line-height: 1.6; }
#settings .result.ok { color: #9fd89f; }
#settings .result.ng { color: #f0a0a0; }
#settings [data-show].off { display: none; }
#settings .model-list { display: flex; flex-direction: column; gap: 6px; }
#settings .model-list:empty { display: none; }
#settings .model-list button { text-align: left; font-size: 13px; line-height: 1.5; }
#settings .model-list button.current { border-color: var(--accent); }
#settings .model-list .desc { display: block; color: var(--muted); font-size: 12px; }
#reader-top .settings-btn { margin-left: auto; }
</style>
</head>
<body>

<!-- 起動画面 -->
<main id="home">
  <header>
    <h1>サウンドノベル・ビューア</h1>
    <p class="lead">青空文庫形式・テキスト・Markdown のファイルを開くと、スクロールを止めた箇所の場面に合わせて背景と人物シルエットが切り替わります。</p>
  </header>

  <label id="drop-zone" for="file-input">
    <span class="big">ファイルをここにドロップ</span>
    <span class="small">またはタップして選択（.txt ／ .md ／ 青空文庫の .zip、Shift_JIS・UTF-8 対応）</span>
    <input id="file-input" type="file" accept=".txt,.md,.markdown,.zip,text/plain,text/markdown,application/zip" onchange="JV.App.onFileInput(this)">
  </label>

  <form id="url-form" onsubmit="JV.App.onUrlSubmit(event)">
    <label for="url-input">青空文庫のURLから読む</label>
    <div class="url-row">
      <input id="url-input" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://www.aozora.gr.jp/cards/…/card….html">
      <button type="submit" id="url-submit">読み込む</button>
    </div>
    <small>作品の図書カードのURLを貼り付けてください。</small>
  </form>
  <div id="home-error" class="hidden"></div>

  <section id="recent-section" class="hidden">
    <h2>最近読んだ作品</h2>
    <ul class="list" id="recent-list"></ul>
  </section>

  <section id="samples-section">
    <h2>サンプル</h2>
    <ul class="list" id="sample-list"></ul>
  </section>

  <footer id="home-footer">
    <button type="button" onclick="JV.SettingsUI.open()">設定</button>
    <span id="route-status" class="meta"></span>
  </footer>
</main>

<!-- 読書画面 -->
<div id="reader" class="hidden">
  <div id="stage" aria-hidden="true"></div>
  <header id="reader-top">
    <button type="button" onclick="JV.App.goHome()">← 戻る</button>
    <div class="titles"><span class="work-title" id="work-title"></span><span class="chapter-name" id="chapter-name"></span></div>
    <button type="button" class="settings-btn" onclick="JV.SettingsUI.open()">設定</button>
  </header>
  <div id="text-column">
    <article id="text"></article>
  </div>
  <button id="effects-toggle" type="button" aria-pressed="true" onclick="JV.App.toggleEffects()">演出 オン</button>
  <div id="center-line"></div>
  <div id="debug" class="hidden"></div>
</div>


<!-- 設定画面 -->
<div id="settings" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <header>
      <h2 id="settings-title">設定</h2>
      <button type="button" onclick="JV.SettingsUI.close()">閉じる</button>
    </header>

    <fieldset>
      <legend>判定（Jev）</legend>
      <label>呼び出し経路
        <select data-key="route" onchange="JV.SettingsUI.change(this)">
          <option value="mock">モック（APIなし・キーワード判定）</option>
          <option value="openrouter">OpenRouter 経由</option>
          <option value="typesafe">TypeSafe 直接</option>
          <option value="relay">中継サーバー（Cloudflare Workers 等）</option>
        </select>
      </label>
      <label data-show="relay">合言葉
        <input data-key="relayPass" type="password" autocomplete="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>中継サーバー（Netlify など）に設定した合言葉。PC の local_server.py で合言葉を設定していなければ空でかまいません。</small>
      </label>
      <label data-show="direct">APIキー
        <input data-key="apiKey" type="password" autocomplete="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>この端末のブラウザ（localStorage）にだけ保存されます。ページを見られる人にはキーが見えるため、共用の端末では使わないでください。</small>
      </label>
      <label data-show="remote">接続先URL
        <input data-key="endpoint" type="text" inputmode="url" autocapitalize="off" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small id="endpoint-hint"></small>
      </label>
      <label data-show="remote">モデル版
        <input data-key="model" type="text" spellcheck="false" onchange="JV.SettingsUI.change(this)">
        <small>現在 TypeSafe で使えるのは jev-latest です。判定傾向はしきい値に影響するので、版の付いた名前が一覧に出たらそちらに固定してください。</small>
      </label>
      <div class="row" data-show="remote">
        <button type="button" id="models-btn" onclick="JV.SettingsUI.listModels()">使えるモデルを確認</button>
        <span id="models-result" class="result"></span>
      </div>
      <div class="model-list" id="model-list" data-show="remote"></div>
      <label data-show="remote">選択肢のキー
        <select data-key="asciiKeys" onchange="JV.SettingsUI.change(this)">
          <option value="false">日本語（和室・夜 など）</option>
          <option value="true">英字ID（washitsu・night など）</option>
        </select>
      </label>
      <div class="row" data-show="remote">
        <button type="button" id="conn-test" onclick="JV.SettingsUI.test()">接続テスト</button>
        <span id="conn-result" class="result"></span>
      </div>
      <p class="note" id="route-note"></p>
    </fieldset>

    <fieldset>
      <legend>演出</legend>
      <label>停止判定の待ち時間（ms）
        <input data-key="stopDelay" type="number" min="150" max="2000" step="50" onchange="JV.SettingsUI.change(this)">
      </label>
      <label>絵を替える感度
        <select data-key="sensitivity" onchange="JV.SettingsUI.change(this)">
          <option value="0.75">低い（しきい値 0.75）</option>
          <option value="0.6">普通（しきい値 0.6）</option>
          <option value="0.45">高い（しきい値 0.45）</option>
        </select>
      </label>
      <label>フェード時間の倍率
        <select data-key="fadeScale" onchange="JV.SettingsUI.change(this)">
          <option value="0.5">0.5</option>
          <option value="0.75">0.75</option>
          <option value="1">1.0</option>
          <option value="1.5">1.5</option>
          <option value="2">2.0</option>
        </select>
      </label>
      <label class="check"><input data-key="silhouettes" type="checkbox" onchange="JV.SettingsUI.change(this)"> 人物シルエットを表示</label>
      <label class="check"><input data-key="hideNarrator" type="checkbox" onchange="JV.SettingsUI.change(this)"> 一人称の作品では語り手を描かず、相手だけを描く</label>
    </fieldset>

    <fieldset>
      <legend>表示</legend>
      <label>表示モード
        <select data-key="displayMode" onchange="JV.SettingsUI.change(this)">
          <option value="novel">ノベル（絵を全画面、本文を半透明の帯に）</option>
          <option value="illust" disabled>挿絵（拡張予定）</option>
        </select>
      </label>
      <label>書字方向
        <select data-key="writingMode" onchange="JV.SettingsUI.change(this)">
          <option value="horizontal">横書き</option>
          <option value="vertical" disabled>縦書き（拡張予定）</option>
        </select>
      </label>
      <label>文字サイズ（px）
        <input data-key="fontSize" type="number" min="12" max="32" step="1" onchange="JV.SettingsUI.change(this)">
      </label>
      <label class="check"><input data-key="debug" type="checkbox" onchange="JV.SettingsUI.change(this)"> デバッグ表示（判定結果と確率）</label>
    </fieldset>

    <fieldset>
      <legend>データ</legend>
      <div class="row">
        <button type="button" onclick="JV.SettingsUI.clearCache()">判定キャッシュを消去</button>
        <button type="button" onclick="JV.SettingsUI.resetAll()">設定を既定に戻す</button>
        <span id="data-result" class="result"></span>
      </div>
    </fieldset>
  </div>
</div>

<script>
'use strict';
const JV = (window.JV = {});

/* =====================================================================
 * 読込部：文字コード判定
 * ===================================================================== */
JV.Encoding = {
  /** ArrayBuffer を文字列に。BOM → UTF-8(厳密) → Shift_JIS / EUC-JP の順に試す */
  decode(buffer) {
    const u8 = new Uint8Array(buffer);
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(u8);
    } catch (_) { /* UTF-8 ではない */ }
    const sjis = new TextDecoder('shift_jis').decode(u8);
    const euc = new TextDecoder('euc-jp').decode(u8);
    const bad = (s) => (s.match(/�/g) || []).length;
    return bad(euc) < bad(sjis) ? euc : sjis;
  },
};

/* =====================================================================
 * 読込部：zip（青空文庫の配布形式）から .txt を取り出す
 * ===================================================================== */
JV.Zip = {
  isZip(buffer) {
    const u8 = new Uint8Array(buffer, 0, Math.min(4, buffer.byteLength));
    return u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 0x03 && u8[3] === 0x04;
  },

  /** 中央ディレクトリを読み、最初の .txt を展開して { name, bytes } を返す */
  async extractText(buffer) {
    const dv = new DataView(buffer);
    // 末尾の「中央ディレクトリ終端」を探す（コメント最大 64KB）
    let eocd = -1;
    for (let i = buffer.byteLength - 22; i >= Math.max(0, buffer.byteLength - 22 - 65535); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('zip ファイルとして読めません');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = [];
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip の目次が壊れています');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const nameBytes = new Uint8Array(buffer, p + 46, nameLen);
      entries.push({ method, csize, local, name: JV.Encoding.decode(nameBytes.slice().buffer) });
      p += 46 + nameLen + extraLen + commentLen;
    }
    const e = entries.find((x) => /\.txt$/i.test(x.name));
    if (!e) throw new Error('zip の中にテキストファイル（.txt）がありません');
    const lnameLen = dv.getUint16(e.local + 26, true);
    const lextraLen = dv.getUint16(e.local + 28, true);
    const data = new Uint8Array(buffer, e.local + 30 + lnameLen + lextraLen, e.csize);
    if (e.method === 0) return { name: e.name.split('/').pop(), bytes: data.slice().buffer };
    if (e.method !== 8) throw new Error(`この圧縮方式（${e.method}）の zip には対応していません`);
    if (typeof DecompressionStream === 'undefined') throw new Error('このブラウザは zip の展開に対応していません。展開した .txt を選んでください');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return { name: e.name.split('/').pop(), bytes: await new Response(stream).arrayBuffer() };
  },
};

/* =====================================================================
 * 読込部：青空文庫のURLから読む（同じサイトの /aozora 経由。Netlify の関数か local_server.py）
 * ===================================================================== */
JV.Aozora = {
  /**
   * 受け付けるURL：
   *   図書カード   https://www.aozora.gr.jp/cards/000879/card92.html
   *   zip          https://www.aozora.gr.jp/cards/000879/files/92_ruby_164.zip
   *   XHTML 本文   https://www.aozora.gr.jp/cards/000879/files/92_14545.html（図書カードに読み替える）
   */
  parse(input) {
    const s = String(input || '').trim();
    const m = s.match(/^(?:https?:\/\/)?(?:www\.)?aozora\.gr\.jp\/(cards\/\d{6})\/(card\d+\.html|files\/[A-Za-z0-9_.-]+)(?:[?#].*)?$/i);
    if (!m) return null;
    const [, dir, rest] = m;
    if (/^card\d+\.html$/i.test(rest)) return { card: `${dir}/${rest.toLowerCase()}` };
    if (/\.zip$/i.test(rest)) return { zip: `${dir}/${rest}` };
    const work = rest.match(/^files\/(\d+)_/);
    if (work) return { card: `${dir}/card${work[1]}.html` };
    return null;
  },

  async get(path) {
    let res;
    try {
      res = await fetch(`aozora?path=${encodeURIComponent(path)}`);
    } catch (err) {
      throw new Error('読み込み用の中継に接続できません');
    }
    if (res.status === 404 && !(res.headers.get('Content-Type') || '').includes('json')) {
      throw new Error('URLからの読み込みは、Netlify に置いたページ（または relay/local_server.py）でだけ使えます');
    }
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch (_) { /* そのまま */ }
      throw new Error(res.status === 404 ? `青空文庫にそのファイルがありません（${msg}）` : msg);
    }
    return res.arrayBuffer();
  },

  /** 図書カードから、ルビ付きテキストの zip の場所を探す */
  findZip(cardHtml, cardPath) {
    const dir = cardPath.replace(/[^/]+$/, '');
    const links = [...cardHtml.matchAll(/href\s*=\s*["']([^"']+\.zip)["']/gi)].map((m) => m[1]);
    if (!links.length) return null;
    const pick = links.find((l) => /ruby/i.test(l)) || links[0];
    // ./files/xxx.zip → cards/NNNNNN/files/xxx.zip
    const abs = pick.replace(/^https?:\/\/(www\.)?aozora\.gr\.jp\//, '');
    if (/^cards\//.test(abs)) return abs;
    return (dir + pick.replace(/^\.\//, '')).replace(/[^/]+\/\.\.\//g, '');
  },

  /** URL → { text, name } */
  async load(url) {
    const t = this.parse(url);
    if (!t) throw new Error('青空文庫の図書カードのURLを入れてください（例 https://www.aozora.gr.jp/cards/000879/card92.html）');
    let zipPath = t.zip;
    if (!zipPath) {
      const html = JV.Encoding.decode(await this.get(t.card));
      zipPath = this.findZip(html, t.card);
      if (!zipPath) throw new Error('図書カードにテキストファイル（zip）が見つかりません。まだテキスト版が公開されていない作品かもしれません');
    }
    const zip = await this.get(zipPath);
    const { name, bytes } = await JV.Zip.extractText(zip);
    return { text: JV.Encoding.decode(bytes), name };
  },
};

/* =====================================================================
 * 正規化部：3形式を「段落の配列＋章の区切り」に揃える
 *
 * 中間表現は行トークンの配列：
 *   { t: 'text', s }   本文の行
 *   { t: 'blank' }     空行
 *   { t: 'heading', s } 章見出し
 *   { t: 'break' }     場面区切り（◇・＊・水平線など）
 * ===================================================================== */
JV.Parser = {
  LONG_PARAGRAPH: 400,   // これを超える段落は句点で分けて判定する
  MAX_UNIT_CHARS: 800,   // 会話を束ねた判定単位の上限

  /** 場面区切りの記号だけの行か */
  isSeparator(line) {
    const s = line.replace(/[\s　]/g, '');
    if (!s || s.length > 20) return false;
    if (!/^[◇◆＊*※☆★○●□■×・\-─―—〜~＃#]+$/.test(s)) return false;
    // 「・・・」や短いダッシュだけの行は本文（沈黙の表現など）とみなす
    return !/^・+$/.test(s) && !/^[―—─-]{1,2}$/.test(s);
  },

  /** 青空文庫・Web小説で共通に使われるルビ記法を外す（親文字だけ残す） */
  stripRuby(s) {
    return s.replace(/《[^》\n]*》/g, '').replace(/｜/g, '');
  },

  detectFormat(name, text) {
    if (/\.(md|markdown)$/i.test(name)) return 'md';
    if (/^-{20,}\s*$/m.test(text) && /《[^》\n]+》|［＃/.test(text)) return 'aozora';
    if (/［＃[^］\n]*］/.test(text) || /^底本：/m.test(text)) return 'aozora';
    return 'txt';
  },

  parse(rawText, fileName = '') {
    const text = rawText.replace(/\r\n?/g, '\n').replace(/[\u2028\u2029]/g, '\n');
    const format = this.detectFormat(fileName, text);
    const base = fileName.replace(/\.[^.]+$/, '');
    let r;
    if (format === 'aozora') r = this.tokensAozora(text);
    else if (format === 'md') r = this.tokensMarkdown(text);
    else r = this.tokensTxt(text);
    const doc = this.build(r.tokens, r.mode);
    doc.format = format;
    doc.title = r.title || base || '無題';
    doc.author = r.author || '';
    doc.units = this.buildUnits(doc);
    return doc;
  },

  /* ---------- 青空文庫 ---------- */
  tokensAozora(text) {
    let lines = text.split('\n');
    let title = '', author = '';

    // 冒頭の凡例（------- で囲まれた部分）と、その前の作品名・著者名
    const d1 = lines.findIndex((l) => /^-{20,}\s*$/.test(l));
    if (d1 >= 0) {
      const d2 = lines.findIndex((l, i) => i > d1 && /^-{20,}\s*$/.test(l));
      const head = lines.slice(0, d1).map((l) => l.trim()).filter(Boolean);
      title = head[0] || '';
      if (head.length > 1) author = head[head.length - 1];
      lines = lines.slice((d2 >= 0 ? d2 : d1) + 1);
    }
    // 末尾の「底本：」以降
    const tail = lines.findIndex((l) => /^底本[：:]/.test(l));
    if (tail >= 0) lines = lines.slice(0, tail);

    const tokens = [];
    let inHeadingBlock = false;
    let headingBuf = [];
    for (const raw of lines) {
      let line = raw.replace(/\s+$/, '');

      // ［＃ここから中見出し］ … ［＃ここで中見出し終わり］
      if (/［＃ここから[^］]*見出し］/.test(line)) { inHeadingBlock = true; headingBuf = []; continue; }
      if (inHeadingBlock) {
        if (/［＃ここで[^］]*見出し終わり］/.test(line)) {
          inHeadingBlock = false;
          tokens.push({ t: 'heading', s: this.cleanAozoraLine(headingBuf.join('　')).trim() });
          continue;
        }
        headingBuf.push(line);
        continue;
      }

      // 改ページは場面区切りとして扱う
      if (/［＃改(ページ|丁|段|見開き)］/.test(line) && !this.cleanAozoraLine(line).trim()) {
        tokens.push({ t: 'break' });
        continue;
      }

      // 見出し：「○○」は中見出し ／ ［＃中見出し］○○［＃中見出し終わり］
      let heading = null;
      let m = line.match(/［＃「([^」]+)」は[^］]*見出し］/);
      if (m) heading = m[1];
      m = line.match(/［＃(?:同行|窓)?([大中小])見出し］(.+?)［＃(?:同行|窓)?\1見出し終わり］/);
      if (m) heading = m[2];
      if (heading !== null) {
        tokens.push({ t: 'heading', s: this.cleanAozoraLine(heading).trim() });
        continue;
      }

      const hadContent = line.trim() !== '';
      line = this.cleanAozoraLine(line);
      if (line.replace(/[\s　]/g, '') === '') {
        // 注記だけの行は何もない行として捨てる。元から空の行は空行
        if (!hadContent) tokens.push({ t: 'blank' });
        continue;
      }
      if (this.isSeparator(line)) { tokens.push({ t: 'break' }); continue; }
      tokens.push({ t: 'text', s: line });
    }
    return { tokens, mode: 'line', title, author };
  },

  /** 外字注記・ルビ・その他の［＃…］注記を除く */
  cleanAozoraLine(line) {
    let s = line;
    // 外字：Unicode が書かれていればその字に、なければ〓
    s = s.replace(/※［＃[^］]*］/g, (a) => {
      const u = a.match(/U\+([0-9A-Fa-f]{4,6})/);
      return u ? String.fromCodePoint(parseInt(u[1], 16)) : '〓';
    });
    s = this.stripRuby(s);
    s = s.replace(/［＃[^］]*］/g, '');
    // アクセント分解記法〔…〕は括弧だけ外す
    s = s.replace(/〔([^〕]*)〕/g, (a, inner) => (/[A-Za-z]/.test(inner) ? inner : a));
    return s;
  },

  /* ---------- プレーンテキスト ---------- */
  tokensTxt(text) {
    let lines = text.split('\n').map((l) => l.replace(/\s+$/, ''));
    let title = '', author = '';

    // 冒頭の短い1〜2行＋空行 は作品名・著者名とみなす
    const firstBlank = lines.findIndex((l, i) => i > 0 && l.trim() === '');
    if (firstBlank > 0 && firstBlank <= 2) {
      const head = lines.slice(0, firstBlank).map((l) => l.trim());
      if (head.every((h) => h.length > 0 && h.length <= 30 && !/[。「」]/.test(h))) {
        title = head[0];
        if (head[1]) author = head[1];
        lines = lines.slice(firstBlank);
      }
    }

    // 1行1段落の書き方か、途中で折り返して空行で段落を区切る書き方かを判定する。
    // 空行を挟まずに続く行の多くが字下げ・かぎ括弧で始まるなら、それぞれが段落の頭（1行1段落）
    let cont = 0, heads = 0;
    for (let i = 1; i < lines.length; i++) {
      if (!lines[i].trim() || !lines[i - 1].trim()) continue;
      cont++;
      if (/^[\s　「『（(【〈《]/.test(lines[i])) heads++;
    }
    const mode = cont > 0 && heads / cont < 0.5 ? 'block' : 'line';

    const tokens = [];
    for (const raw of lines) {
      const line = this.stripRuby(raw);
      if (line.trim() === '') { tokens.push({ t: 'blank' }); continue; }
      if (this.isSeparator(line)) { tokens.push({ t: 'break' }); continue; }
      if (this.isTxtHeading(line)) { tokens.push({ t: 'heading', s: line.trim().replace(/^[　]+/, '') }); continue; }
      tokens.push({ t: 'text', s: line });
    }
    return { tokens, mode, title, author };
  },

  isTxtHeading(line) {
    const s = line.trim().replace(/^[　]+/, '');
    if (s.length > 40 || /[。、「」]$/.test(s)) return false;
    return /^(第[一二三四五六七八九十百千〇零0-9０-９]+[章話節部回幕編]|序章|終章|序幕|終幕|プロローグ|エピローグ|Prologue|Epilogue|Chapter\s*\d+)([\s　:：].*)?$/i.test(s);
  },

  /* ---------- Markdown ---------- */
  tokensMarkdown(text) {
    let lines = text.split('\n');
    let title = '', author = '';

    // YAML front matter
    if (/^---\s*$/.test(lines[0] || '')) {
      const end = lines.findIndex((l, i) => i > 0 && /^(---|\.\.\.)\s*$/.test(l));
      if (end > 0) {
        for (const l of lines.slice(1, end)) {
          const m = l.match(/^(title|author)\s*:\s*["']?(.*?)["']?\s*$/);
          if (m && m[1] === 'title') title = m[2];
          if (m && m[1] === 'author') author = m[2];
        }
        lines = lines.slice(end + 1);
      }
    }

    const tokens = [];
    let inFence = false;
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i].replace(/\s+$/, '');
      if (/^\s*(```|~~~)/.test(raw)) { inFence = !inFence; continue; }
      if (inFence) { if (raw.trim()) tokens.push({ t: 'text', s: raw }); else tokens.push({ t: 'blank' }); continue; }
      if (raw.trim() === '') { tokens.push({ t: 'blank' }); continue; }
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(raw)) { tokens.push({ t: 'break' }); continue; }
      const h = raw.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (h) { tokens.push({ t: 'heading', s: this.mdInline(h[2]), level: h[1].length }); continue; }
      // Setext 見出し（=== のみ。--- は水平線として扱う）
      if (/^=+\s*$/.test(raw) && tokens.length && tokens[tokens.length - 1].t === 'text') {
        const prev = tokens.pop();
        tokens.push({ t: 'heading', s: prev.s.trim(), level: 1 });
        continue;
      }
      if (/^\s*<!--.*-->\s*$/.test(raw)) continue;
      let s = raw
        .replace(/^\s{0,3}>\s?/, '')                 // 引用
        .replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '');     // 箇条書き
      s = this.mdInline(s);
      if (s.trim() === '') continue;
      if (this.isSeparator(s)) { tokens.push({ t: 'break' }); continue; }
      tokens.push({ t: 'text', s });
    }

    // 先頭の # 見出しが1つだけで作品名と同じ（または作品名がない）なら作品名として扱う
    const h1s = tokens.filter((t) => t.t === 'heading' && t.level === 1);
    const firstContent = tokens.find((t) => t.t !== 'blank');
    if (h1s.length === 1 && firstContent === h1s[0] && (!title || title === h1s[0].s)) {
      title = h1s[0].s;
      tokens.splice(tokens.indexOf(h1s[0]), 1);
    }
    return { tokens, mode: 'block', title, author };
  },

  mdInline(s) {
    return this.stripRuby(s)
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')                 // 画像
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')               // リンク
      .replace(/\[([^\]]+)\]\[[^\]]*\]/g, '$1')              // 参照リンク
      .replace(/<\/?[A-Za-z][^>]*>/g, '')                    // HTMLタグ
      .replace(/(\*\*|__)(.+?)\1/g, '$2')                    // 強調
      .replace(/(\*|_)(?=\S)(.+?)(?<=\S)\1/g, '$2')
      .replace(/~~(.+?)~~/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g, '$1')
      .replace(/^\s+(?=\S)/, (sp) => (sp.includes('　') ? sp : ''));
  },

  /* ---------- 行トークン → 段落・章 ---------- */
  build(tokens, mode) {
    const paragraphs = [];
    const chapters = [];
    let blankRun = 0;
    let pendingBreak = false;
    let buf = [];
    let chapter = -1;

    const ensureChapter = () => {
      if (chapter < 0) { chapters.push({ title: '', start: paragraphs.length }); chapter = 0; }
    };
    const pushPara = (s) => {
      ensureChapter();
      const firstInChapter = chapters[chapter].start === paragraphs.length;
      paragraphs.push({ i: paragraphs.length, text: s, chapter, breakBefore: pendingBreak && !firstInChapter });
      pendingBreak = false;
    };
    const flush = () => {
      if (!buf.length) return;
      // 行末が英数字なら空白で、和文ならそのまま繋ぐ
      let s = buf[0];
      for (let k = 1; k < buf.length; k++) s += (/[A-Za-z0-9,.;:!?]$/.test(s) ? ' ' : '') + buf[k].replace(/^\s+/, '');
      pushPara(s);
      buf = [];
    };

    for (const tk of tokens) {
      if (tk.t === 'blank') {
        blankRun++;
        if (mode === 'block') flush();
        if (blankRun >= 2 && paragraphs.length) pendingBreak = true;
        continue;
      }
      blankRun = 0;
      if (tk.t === 'break') { flush(); if (paragraphs.length) pendingBreak = true; continue; }
      if (tk.t === 'heading') {
        flush();
        chapters.push({ title: tk.s, start: paragraphs.length });
        chapter = chapters.length - 1;
        pendingBreak = false;
        continue;
      }
      if (mode === 'block') buf.push(tk.s);
      else pushPara(tk.s);
    }
    flush();
    // 段落を持たない章（見出しが連続した場合など）は、次の章の見出しと統合する
    const merged = [];
    for (let c = 0; c < chapters.length; c++) {
      const ch = chapters[c];
      const next = chapters[c + 1];
      const end = next ? next.start : paragraphs.length;
      if (end === ch.start && next) { next.title = ch.title && next.title ? `${ch.title}　${next.title}` : (ch.title || next.title); continue; }
      if (end === ch.start) continue;
      merged.push(ch);
    }
    const remap = new Map();
    merged.forEach((ch, idx) => remap.set(chapters.indexOf(ch), idx));
    for (const p of paragraphs) p.chapter = remap.has(p.chapter) ? remap.get(p.chapter) : p.chapter;
    merged.forEach((ch, idx) => { ch.i = idx; });
    return { paragraphs, chapters: merged };
  },

  /* ---------- 判定単位 ---------- */
  isDialogue(s) {
    const t = s.replace(/^[\s　]+/, '').replace(/[\s　]+$/, '');
    return /^[「『（(]/.test(t) && /[」』）)]$/.test(t);
  },

  /** 長い段落を句点で分ける（表示は段落のまま、判定だけ細かくする） */
  splitLong(text) {
    if (text.length <= this.LONG_PARAGRAPH) return [text];
    const sentences = text.match(/[^。！？!?]*[。！？!?]+[」』）)]*|[^。！？!?]+$/g) || [text];
    const chunks = [];
    let cur = '';
    for (const s of sentences) {
      if (cur && cur.length + s.length > this.LONG_PARAGRAPH) { chunks.push(cur); cur = ''; }
      cur += s;
    }
    if (cur) chunks.push(cur);
    return chunks;
  },

  /**
   * 段落 → 表示用の断片（segment）→ 判定単位（unit）
   * 会話文だけの段落は直前の地の文と束ねる（段の先頭なら直後の地の文と）。
   */
  buildUnits(doc) {
    const segments = [];
    for (const p of doc.paragraphs) {
      const parts = this.splitLong(p.text);
      p.segs = [];
      for (const part of parts) {
        const seg = { i: segments.length, para: p.i, text: part, dialogue: parts.length === 1 && this.isDialogue(part) };
        p.segs.push(seg.i);
        segments.push(seg);
      }
    }
    doc.segments = segments;

    const units = [];
    let cur = null;
    let pendingDialogue = [];
    const boundary = (seg) => {
      const p = doc.paragraphs[seg.para];
      return !cur || cur.chapter !== p.chapter || (p.breakBefore && p.segs[0] === seg.i);
    };
    const newUnit = (seg) => {
      cur = { i: units.length, segs: [], chapter: doc.paragraphs[seg.para].chapter, len: 0 };
      units.push(cur);
    };
    const add = (seg) => { cur.segs.push(seg.i); cur.len += seg.text.length; seg.unit = cur.i; };

    for (const seg of segments) {
      const isBoundary = boundary(seg);
      if (isBoundary && pendingDialogue.length) {
        // 段の終わりまで会話だけだった → 会話だけで1単位
        newUnit(pendingDialogue[0]);
        pendingDialogue.forEach(add);
        pendingDialogue = [];
      }
      if (seg.dialogue) {
        if (!isBoundary && cur && cur.len + seg.text.length <= this.MAX_UNIT_CHARS) { add(seg); continue; }
        if (!isBoundary && cur) { newUnit(seg); add(seg); continue; }
        // 段の先頭の会話は、直後の地の文とまとめるため保留
        pendingDialogue.push(seg);
        if (pendingDialogue.reduce((n, s) => n + s.text.length, 0) > this.MAX_UNIT_CHARS) {
          newUnit(pendingDialogue[0]);
          pendingDialogue.forEach(add);
          pendingDialogue = [];
        }
        continue;
      }
      if (pendingDialogue.length) {
        newUnit(pendingDialogue[0]);
        pendingDialogue.forEach(add);
        pendingDialogue = [];
        add(seg);
        continue;
      }
      newUnit(seg);
      add(seg);
    }
    if (pendingDialogue.length) { newUnit(pendingDialogue[0]); pendingDialogue.forEach(add); }

    for (const u of units) {
      u.text = u.segs.map((s) => segments[s].text.replace(/^[\s　]+/, '')).join('\n');
      u.paraStart = segments[u.segs[0]].para;
      u.paraEnd = segments[u.segs[u.segs.length - 1]].para;
      delete u.len;
    }
    return units;
  },
};

      else if (el.tagName === 'SELECT') {

      const min = Number(el.min), max = Number(el.max);
      if (!Number.isFinite(v)) v = JV.Settings.DEFAULTS[key];
      v = Math.min(max, Math.max(min, v));
      el.value = v;

    else if (key === 'asciiKeys') v = el.value === 'true';

      }[err.kind] || '';

        if (err.status === 404 || err.status === 405 || err.status === 501) relayHint = '→ このページは中継サーバーから配信されていないようです。Netlify のURL（または local_server.py が表示したURL）で開き直してください。';

        else if (err.status === 500 && /not configured/.test(msg)) relayHint = '→ Netlify の環境変数 TYPESAFE_API_KEY と RELAY_PASSPHRASE を設定し、再デプロイしてください。';

/* =====================================================================
 * 停止検知部：スクロールが一定時間止まったら、画面の縦中央にかかる断片を特定する
 * ===================================================================== */
JV.StopDetector = {
  io: null,
  atCenter: new Set(),
  timer: 0,
  segEls: [],
  lastUnit: null,
  onStop: null,
  onScrollBound: null,

  attach(root, onStop) {
    this.detach();
    this.onStop = onStop;
    this.segEls = Array.from(root.querySelectorAll('.seg'));
    // 高さ0の「中央線」に交差している断片を常に把握しておく
    this.io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) this.atCenter.add(e.target);
        else this.atCenter.delete(e.target);
      }
    }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });
    this.segEls.forEach((el) => this.io.observe(el));
    this.onScrollBound = () => this.arm();
    window.addEventListener('scroll', this.onScrollBound, { passive: true });
    window.addEventListener('scrollend', this.onScrollBound);
    window.addEventListener('resize', this.onScrollBound);
    this.arm();
  },

  detach() {
    if (this.io) this.io.disconnect();
    this.io = null;
    this.atCenter.clear();
    clearTimeout(this.timer);
    if (this.onScrollBound) {
      window.removeEventListener('scroll', this.onScrollBound);
      window.removeEventListener('scrollend', this.onScrollBound);
      window.removeEventListener('resize', this.onScrollBound);
    }
    this.onScrollBound = null;
    this.lastUnit = null;
  },

  /** スクロールのたびにタイマーを掛け直す。動いている間は発火しない */
  arm() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.fire(), JV.Settings.get('stopDelay'));
  },

  fire(force = false) {
    const el = this.centerSegment();
    if (!el) return;
    const unit = Number(el.dataset.u);
    if (!force && unit === this.lastUnit) return; // 前回と同じなら何もしない
    this.lastUnit = unit;
    if (this.onStop) this.onStop({ unit, seg: Number(el.dataset.s), el });
  },

  centerSegment() {
    const cy = window.innerHeight / 2;
    let best = null, bestD = Infinity;
    for (const el of this.atCenter) {
      const r = el.getBoundingClientRect();
      const d = Math.abs((r.top + r.bottom) / 2 - cy);
      if (d < bestD) { best = el; bestD = d; }
    }
    if (best) return best;
    // 段落の隙間や見出しに中央線がある場合：文書順の二分探索で最も近い断片
    const els = this.segEls;
    if (!els.length) return null;
    let lo = 0, hi = els.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (els[mid].getBoundingClientRect().bottom < cy) lo = mid + 1; else hi = mid;
    }
    const cand = [els[lo], els[lo - 1]].filter(Boolean);
    cand.sort((a, b) => {
      const da = Math.min(Math.abs(a.getBoundingClientRect().top - cy), Math.abs(a.getBoundingClientRect().bottom - cy));
      const db = Math.min(Math.abs(b.getBoundingClientRect().top - cy), Math.abs(b.getBoundingClientRect().bottom - cy));
      return da - db;
    });
    return cand[0];
  },
};

  options(group, key) {
    const q = this[group][key];
    return q.options || this[group][q.optionsFrom].options;
  },
  byLabel(group, key, label) { return this.options(group, key).find((o) => o.label === label); },
  byId(group, key, id) { return this.options(group, key).find((o) => o.id === id); },

  /** TypeSafe 形式の questions を組み立てる（asciiKeys なら criteria のキーを英字IDにする） */
  toQuestions(group, { asciiKeys = false } = {}) {
    const out = {};
    for (const [key, q] of Object.entries(this[group])) {
      if (q.type === 'noul') out[key] = { type: 'noul', instructions: q.instructions };
      else if (q.type === 'score') out[key] = { type: 'score', instructions: q.instructions, criteria: q.levels.slice() };
      else {
        const criteria = {};
        for (const o of this.options(group, key)) criteria[asciiKeys ? o.id : o.label] = asciiKeys ? `${o.label}：${o.desc}` : o.desc;
        out[key] = { type: 'choice', instructions: q.instructions, criteria };
      }
    }
    return out;
  },
};

 *   score  → { score（0〜段階数-1の期待値）, probabilities, confidence }
 *   noul   → { noul（0〜1） }
 * ===================================================================== */

      '歩く・走る': ['歩', '走', '駆', '急い', '下りきった', '向かっ'],
      '倒れる・横たわる': ['倒れ', '横たわ', '寝', '眠'],

    },
    mood: [
