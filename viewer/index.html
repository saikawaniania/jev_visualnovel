      ['寂し', '哀し', '悲し', '涙', '独り', 'ひとりきり', '遠ざか', '形見', '思い出', '昔', '見当らな', '不安'],
      ['叫', '震', '恐', '血', '逃げ', '怖', '悲鳴', '嵐', '雷', '激し', '黒い影', '背筋が寒', '顔色が悪'],
    ],
    transition: ['翌朝', 'その夜', '日が暮れ', '昼過ぎ', '夜更け', 'やがて', '着いた', '出た', '乗り込', 'しばらくして', '夕方になる', 'になると', '目が覚め', 'ようやく'],
  },

  count(text, kws) {
    let n = 0;
    for (const k of kws) {
      if (k instanceof RegExp) n += (text.match(new RegExp(k.source, 'g')) || []).length;
      else if (text.includes(k)) n += text.split(k).length - 1;
    }
    return n;
  },

  /** 各選択肢の得点 → 確率。fallback（不明・記述なし）には下駄をはかせる */
  choice(labels, scores, fallback, base = 0.05, fallbackBase = 0.6) {
    const w = labels.map((l) => (scores[l] || 0) + (l === fallback ? fallbackBase : base));
    const sum = w.reduce((a, b) => a + b, 0);
    const probabilities = {};
    labels.forEach((l, i) => { probabilities[l] = w[i] / sum; });
    let best = labels[0];
    for (const l of labels) if (probabilities[l] > probabilities[best]) best = l;
    return { choice: best, probabilities, confidence: probabilities[best] };
  },

  scoreFor(table, cur, ctx) {
    const s = {};
    for (const [label, kws] of Object.entries(table)) s[label] = this.count(cur, kws) + 0.35 * this.count(ctx, kws);
    return s;
  },

  async judge(state, questions, { signal } = {}) {
    const [lo, hi] = this.latency;
    await JV.util.sleep(lo + Math.random() * (hi - lo), signal);
    const st = typeof state === 'string' ? { current: state } : state;
    const cur = st.current || '';
    const ctx = st.context_before || '';
    const prev = st.previous_scene || {};
    const K = this.KEYWORDS;
    const labelsOf = (key) => Object.keys(questions[key].criteria);
    // criteria のキーが英字IDでも動くように、表示名 ↔ キーを対応づける
    const answers = {};
    const dialogues = (cur.match(/^[「『]/gm) || []).length;

    for (const key of Object.keys(questions)) {
      const q = questions[key];
      if (q.type === 'choice') {
        const keys = labelsOf(key);
        const group = key in JV.Schema.work ? 'work' : 'scene';
        const toLabel = (k) => (JV.Schema.byLabel(group, key, k) ? k : (JV.Schema.byId(group, key, k) || { label: k }).label);
        const labels = keys.map(toLabel);
        let table = K[key];
        if (key === 'figure_main' || key === 'figure_sub') table = K.figure;
        const narrOnly = key === 'location' || key === 'time' || key === 'weather';
        const strip = (t) => t.replace(/「[^」]*」|『[^』]*』/g, '');
        let scores = table ? this.scoreFor(table, narrOnly ? strip(cur) : cur, key === 'era' || key === 'narration' ? '' : (narrOnly ? strip(ctx) : ctx)) : {};
        let fallback = labels.find((l) => l === '不明' || l === '記述なし');

        if (key === 'narration') {
          const narr = cur.replace(/「[^」]*」/g, '');
          const first = this.count(narr, ['私', '僕', '俺', 'わたし', 'あたし']);
          scores = { '一人称': first, '三人称': Math.max(0.5, narr.length / 400 - first) };
        }
        if (key === 'people') {
          if (dialogues >= 2) scores['2人'] = (scores['2人'] || 0) + 1.2;
          fallback = '1人';
        }
        if (key === 'pose' && dialogues >= 2) scores['向き合って話す'] = (scores['向き合って話す'] || 0) + 0.8;
        if (key === 'pose') fallback = '立っている';
        if (key === 'figure_sub') {
          // 主人物に選ばれたものを除いた2番手
          const main = answers.figure_main ? toLabel(answers.figure_main.choice) : null;
          if (main && main !== '不明') scores[main] = Math.max(0, (scores[main] || 0) - 1.5);
          if (dialogues < 2 && !(scores['成人女性'] || scores['少女'] || scores['老人'])) scores = {};
        }
        const fbBase = fallback === '1人' || fallback === '立っている' ? 0.4 : key === 'weather' ? 0.45 : 0.6;
        const r = this.choice(labels, scores, fallback || labels[0], 0.05, fbBase);
        // 返すときは元のキーに戻す
        const back = (l) => keys[labels.indexOf(l)];
        const probabilities = {};
        for (const l of labels) probabilities[back(l)] = r.probabilities[l];
        answers[key] = { type: 'choice', choice: back(r.choice), probabilities, confidence: r.confidence };
      } else if (q.type === 'score') {
        const n = q.criteria.length;
        const raw = K.mood.slice(0, n).map((kws) => this.count(cur, kws) + 0.35 * this.count(ctx, kws));
        raw[0] += 0.5;
        const sum = raw.reduce((a, b) => a + b, 0);
        const probabilities = {};
        raw.forEach((v, i) => { probabilities[i] = v / sum; });
        const score = raw.reduce((a, v, i) => a + i * (v / sum), 0);
        answers[key] = { type: 'score', score, probabilities, confidence: Math.max(...Object.values(probabilities)) };
      } else if (q.type === 'noul') {
        answers[key] = { type: 'noul', noul: 0 }; // 他の答えを見てから下で決める
      }
    }

    if (questions.scene_changed) {
      const labelOf = (key) => {
        const a = answers[key];
        if (!a) return null;
        return JV.Schema.byLabel('scene', key, a.choice) ? a.choice : (JV.Schema.byId('scene', key, a.choice) || {}).label;
      };
      let p = 0.12 + 0.12 * Math.min(2, this.count(cur, K.transition));
      const loc = labelOf('location');
      const time = labelOf('time');
      if (loc && loc !== '不明' && prev.location && loc !== prev.location && answers.location.confidence > 0.3) p += 0.5;
      if (time && time !== '不明' && prev.time && time !== prev.time && answers.time.confidence > 0.35) p += 0.3;
      if (!prev.location) p += 0.3;
      answers.scene_changed = { type: 'noul', noul: Math.min(0.97, p) };
    }
    return answers;
  },
};

/**
 * 実Jevアダプタ。経路ごとの違い（URL・ヘッダー・応答の包み方）はここに閉じ込める。
 *   typesafe   : TypeSafe 直接。POST https://api.typesafe.ai/v1/systemone（公式SDKと同じ形式）
 *   openrouter : OpenRouter 経由。TypeSafe と同じ本文を送る（OpenRouter 側の形式は要確認のため URL は設定で変更可）
 *   relay      : 任意の中継（Cloudflare Workers 等）。TypeSafe と同じ本文を送り、キーは中継側に置ける
 */
JV.Adapters.remote = {
  TIMEOUT_MS: 8000,
  ROUTES: {
    typesafe: { label: 'TypeSafe 直接', url: 'https://api.typesafe.ai/v1/systemone' },
    openrouter: { label: 'OpenRouter 経由', url: 'https://openrouter.ai/api/v1/systemone' },
    relay: { label: '中継サーバー', url: '/v1/systemone' }, // 既定はページと同じサーバー（relay/local_server.py）
  },

  get name() { return JV.Settings.get('route'); },
  cacheKey() { return `${this.name}:${JV.Settings.get('model')}`; },

  endpoint() {
    const route = JV.Settings.get('route');
    const custom = (JV.Settings.get('endpoint') || '').trim();
    const url = custom || (this.ROUTES[route] || {}).url;
    const key = (JV.Settings.get('apiKey') || '').trim();
    const headers = { 'Content-Type': 'application/json', Accept: 'application/json' };
    if (route === 'relay') {
      // 中継にはキーを渡さない（キーは中継側にある）。合言葉だけ送る
      const pass = (JV.Settings.get('relayPass') || '').trim();
      if (pass) headers['X-Relay-Passphrase'] = pass;
    } else if (key) headers.Authorization = `Bearer ${key}`;
    if (route === 'openrouter') {
      // OpenRouter がアプリの識別に使うヘッダー（任意）
      if (/^https?:/.test(location.href)) headers['HTTP-Referer'] = location.origin;
      headers['X-Title'] = 'Jev Sound Novel Viewer';
    }
    return { url, headers };
  },

  /** 使えるモデルの一覧（GET …/v1/models）。[{ name, description, release_date }] */
  async listModels() {
    const { url, headers } = this.endpoint();
    if (!url) throw new JV.Adapters.RemoteError('接続先URLが設定されていません', 'config');
    const modelsUrl = url.replace(/\/systemone\/?(\?.*)?$/, '/models');
    if (modelsUrl === url) throw new JV.Adapters.RemoteError('この接続先からはモデル一覧のURLが分かりません', 'config');
    delete headers['Content-Type'];
    let res;
    try {
      res = await fetch(modelsUrl, { method: 'GET', headers, mode: 'cors', credentials: 'omit', signal: AbortSignal.timeout ? AbortSignal.timeout(this.TIMEOUT_MS) : undefined });
    } catch (err) {
      throw new JV.Adapters.RemoteError('接続できません。ブラウザからの直接呼び出しが CORS で拒否されたか、ネットワークに届いていません', 'network', String(err));
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (_) { data = text; }
    if (!res.ok) {
      const msg = (data && (data.message || (data.error && (data.error.message || data.error)))) || text.slice(0, 200);
      throw new JV.Adapters.RemoteError(`HTTP ${res.status}: ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`, res.status === 403 || res.status === 401 ? 'auth' : 'http', data, res.status);
    }
    const list = Array.isArray(data) ? data : (data && (data.models || data.data)) || [];
    return list.map((m) => (typeof m === 'string' ? { name: m } : { name: m.name || m.id, description: m.description || '', release_date: m.release_date || '' })).filter((m) => m.name);
  },

  /** 応答から answers を取り出す。TypeSafe 形式のほか、OpenAI 互換の包み方にも一応対応 */
  extractAnswers(data) {
    if (data && data.answers) return data.answers;
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (typeof content === 'string') {
      try { const j = JSON.parse(content); if (j.answers) return j.answers; return j; } catch (_) { /* 下へ */ }
    }
    throw new JV.Adapters.RemoteError('応答に answers がありません（経路の形式を確認してください）', 'format', data);
  },

  async judge(state, questions, { signal } = {}) {
    const { url, headers } = this.endpoint();
    if (!url) throw new JV.Adapters.RemoteError('接続先URLが設定されていません', 'config');
    const ctl = new AbortController();
    const onAbort = () => ctl.abort();
    if (signal) { if (signal.aborted) ctl.abort(); else signal.addEventListener('abort', onAbort, { once: true }); }
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, this.TIMEOUT_MS);
    const body = { model: JV.Settings.get('model') || 'jev-latest', state, questions };
    try {
      let res;
      try {
        res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal, mode: 'cors', credentials: 'omit' });
      } catch (err) {
        if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
        if (timedOut) throw new JV.Adapters.RemoteError(`${this.TIMEOUT_MS}ms 以内に応答がありません`, 'timeout');
        // ブラウザは CORS 拒否とネットワーク断を区別して教えてくれない
        throw new JV.Adapters.RemoteError('接続できません。ブラウザからの直接呼び出しが CORS で拒否されたか、ネットワークに届いていません', 'network', String(err));
      }
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : undefined; } catch (_) { data = text; }
      if (!res.ok) {
        const msg = (data && (data.error && (data.error.message || data.error) || data.message || data.detail)) || text.slice(0, 200);
        const kind = res.status === 401 || res.status === 403 ? 'auth' : res.status === 429 ? 'rate' : res.status === 404 ? 'notfound' : 'http';
        throw new JV.Adapters.RemoteError(`HTTP ${res.status}: ${typeof msg === 'string' ? msg : JSON.stringify(msg)}`, kind, data, res.status);
      }
      return this.extractAnswers(data);
    } finally {
      clearTimeout(timer);
      if (signal) signal.removeEventListener('abort', onAbort);
    }
  },
};

JV.Adapters.RemoteError = class extends Error {
  constructor(message, kind, detail, status) {
    super(message);
    this.name = 'RemoteError';
    this.kind = kind;       // config | network | timeout | auth | rate | notfound | http | format
    this.detail = detail;
    this.status = status;
  }
};

JV.util = {
  sleep(ms, signal) {
    return new Promise((resolve, reject) => {
      if (signal && signal.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
      const t = setTimeout(() => { if (signal) signal.removeEventListener('abort', onAbort); resolve(); }, ms);
      const onAbort = () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); };
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
    });
  },
  isAbort(err) { return err && (err.name === 'AbortError' || err.name === 'APIUserAbortError'); },
};

/* =====================================================================
 * 素材ライブラリ
 * 実素材がない組み合わせは仮素材（場所名入りのグラデーション・図形のシルエット）で代用する
 * ===================================================================== */
JV.Assets = {
  // assets/manifest.json から読んだ実素材の一覧（キー → URL）。なければ仮素材
  manifest: { bg: {}, sil: {}, crowd: [], fallbackEra: '', silFacing: 'left' },
  broken: new Set(),     // 読み込みに失敗したURL（以後は仮素材で代用）
  BASE: 'assets/',

  // 仮背景の色（上・下）。低彩度で、白文字が乗っても読める明度に揃える
  PALETTE: {
    washitsu: ['#8d8068', '#5e5340'], yoshitsu: ['#86766b', '#56493f'], kitchen: ['#847d69', '#565040'],
    genkan: ['#7d776c', '#514c43'], classroom: ['#8a9078', '#5b604b'], shop: ['#8e7258', '#5d4735'],
    station: ['#79828c', '#4d545b'], street: ['#8c9296', '#5f6466'], alley: ['#6f6c66', '#46443f'],
    garden: ['#7f9272', '#50603f'], field: ['#a1a370', '#6d7550'], forest: ['#61786a', '#35463a'],
    river: ['#84a0ab', '#4f6a73'], seaside: ['#8fb0bd', '#c9bb98'], nightsky: ['#2a3558', '#10152a'],
    none: ['#2b2e36', '#15171c'],
  },

  /**
   * manifest.json を読む。素材はファイル名の規則でキーを決める：
   *   bg/bg_{era}_{location}_{time}.webp   例 bg/bg_modern_washitsu_day.webp
   *   sil/sil_{figure}_{pose}.png          例 sil/sil_woman_sit.png
   *   crowd には群衆シルエットのパスを並べる
   */
  async loadManifest(url = `${this.BASE}manifest.json`) {
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      this.applyManifest(await res.json(), url);
      return true;
    } catch (err) {
      // file:// で開いた場合など。仮素材だけで動く
      this.manifestError = String(err.message || err);
      return false;
    }
  },

  applyManifest(m, url = `${this.BASE}manifest.json`) {
    const base = url.replace(/[^/]*$/, '');
    const abs = (p) => (/^(https?:|data:|\/)/.test(p) ? p : base + p);
    const out = { bg: {}, sil: {}, crowd: [], fallbackEra: m.fallbackEra || '', silFacing: m.silFacing === 'right' ? 'right' : 'left' };
    const skipped = [];
    for (const p of m.bg || []) {
      const k = String(p).match(/bg_([a-z0-9]+)_([a-z0-9]+)_([a-z0-9]+)\.[a-z0-9]+$/i);
      if (k && JV.Schema.byId('scene', 'location', k[2]) && JV.Schema.byId('scene', 'time', k[3])) out.bg[`${k[1]}_${k[2]}_${k[3]}`] = abs(p);
      else skipped.push(p);
    }
    for (const p of m.sil || []) {
      const k = String(p).match(/sil_([a-z0-9]+)_([a-z0-9]+)\.[a-z0-9]+$/i);
      if (k && this.BODY[k[1]] && JV.Schema.byId('scene', 'pose', k[2])) out.sil[`${k[1]}_${k[2]}`] = abs(p);
      else skipped.push(p);
    }
    out.crowd = (m.crowd || []).map(abs);
    this.manifest = out;
    this.broken.clear();
    this.manifestSkipped = skipped;
    return out;
  },

  bgKey(eraId, locId, timeId) { return `${eraId}_${locId}_${timeId}`; },

  /** 背景：era×location×time の絵 → 昼の絵＋色調 → （fallbackEra で同じ順）→ 仮素材 */
  background(eraId, locId, timeId) {
    const bg = this.manifest.bg || {};
    const eras = [eraId, this.manifest.fallbackEra].filter((e, i, a) => e && a.indexOf(e) === i);
    for (const era of eras) {
      for (const [t, ownTime] of [[timeId, true], ['day', timeId === 'day']]) {
        const k = this.bgKey(era, locId, t);
        if (bg[k] && !this.broken.has(bg[k])) return { kind: 'image', url: bg[k], ownTime, key: k };
      }
    }
    return { kind: 'placeholder', key: `ph_${locId}`, locId };
  },

  silhouette(figId, poseId) {
    const own = (this.manifest.sil || {})[`${figId}_${poseId}`];
    return own && !this.broken.has(own) ? (this.cutout.get(own) || own) : this.svgUrl(this.svgFigure(figId, poseId));
  },

  isPlaceholder(url) { return url.startsWith('data:image/svg+xml'); },

  crowd(k = 0) {
    const list = (this.manifest.crowd || []).filter((u) => !this.broken.has(u));
    if (list.length) { const u = list[k % list.length]; return this.cutout.get(u) || u; }
    return this.svgUrl(this.svgCrowd(k));
  },

  /**
   * 白地に黒で描いたシルエット（JPG や白背景の PNG）を、読み込み時に透過シルエットへ変換する。
   * 四隅が不透明な明るい色なら「白地」とみなし、明るさに応じて透明度を付けて黒一色にする。
   * もともと透過している PNG はそのまま使う。結果は URL ごとに覚えておく。
   */
  cutout: new Map(),
  cutoutPending: new Map(),

  prepareSilhouette(url, { trimX = false } = {}) {
    if (!url || url.startsWith('data:') || url.startsWith('blob:') || this.cutout.has(url)) return Promise.resolve();
    if (this.cutoutPending.has(url)) return this.cutoutPending.get(url);
    const job = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const w = img.naturalWidth, h = img.naturalHeight;
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          const d = ctx.getImageData(0, 0, w, h);
          const px = d.data;
          const at = (x, y) => (y * w + x) * 4;
          const corners = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
          const whiteGround = corners.every((i) => px[i + 3] > 250 && (px[i] + px[i + 1] + px[i + 2]) / 3 > 200);
          if (whiteGround) {
            // 地の明るさを基準にして、それより暗いほど不透明にする（JPG のにじみや薄いグレーの地も消える）
            const ground = corners.reduce((a, i) => a + (px[i] + px[i + 1] + px[i + 2]) / 3, 0) / 4;
            const hi = ground - 18, lo = 60;
            for (let i = 0; i < px.length; i += 4) {
              const lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
              const a = lum >= hi ? 0 : lum <= lo ? 255 : Math.round(255 * (hi - lum) / (hi - lo));
              px[i] = 7; px[i + 1] = 8; px[i + 2] = 11; px[i + 3] = a;
            }
            ctx.putImageData(d, 0, 0);
          }
          // 群衆は左右の余白を切り落とす（横長のキャンバスの片側に寄って描かれていても中央に置けるように）。
          // 高さは変えないので、足元の位置と背丈の比率はそのまま
          let out = c;
          if (trimX) {
            let left = w, right = -1;
            for (let x = 0; x < w; x++) {
              for (let y = 0; y < h; y += 2) if (px[(y * w + x) * 4 + 3] > 16) { if (x < left) left = x; right = x; break; }
            }
            if (right >= left && (left > w * 0.03 || right < w * 0.97)) {
              const pad = Math.round(w * 0.02);
              const x0 = Math.max(0, left - pad), x1 = Math.min(w, right + 1 + pad);
              out = document.createElement('canvas');
              out.width = x1 - x0; out.height = h;
              out.getContext('2d').drawImage(c, x0, 0, x1 - x0, h, 0, 0, x1 - x0, h);
            }
          }
          if (!whiteGround && out === c) { this.cutout.set(url, url); resolve(); return; }
          out.toBlob((blob) => {
            this.cutout.set(url, blob ? URL.createObjectURL(blob) : url);
            resolve();
          }, 'image/png');
        } catch (_) {
          this.cutout.set(url, url); // 読めない（別オリジンなど）ときはそのまま
          resolve();
        }
      };
      img.onerror = () => { this.broken.add(url); resolve(); };
      img.src = url;
    }).finally(() => this.cutoutPending.delete(url));
    this.cutoutPending.set(url, job);
    return job;
  },

  /** 場面に出す人物の素材を、表示前に準備する */
  prepareFigures(scene) {
    const f = scene && scene.figures;
    if (!f || f.layout === 'none') return Promise.resolve();
    const urls = [];
    const own = (fig, pose) => fig && (this.manifest.sil || {})[`${fig}_${pose}`];
    urls.push(own(f.main, f.pose), own(f.sub, f.pose === 'lie' ? 'stand' : f.pose));
    const jobs = urls.filter(Boolean).map((u) => this.prepareSilhouette(u));
    if (f.layout === 'many') jobs.push(...(this.manifest.crowd || []).map((u) => this.prepareSilhouette(u, { trimX: true })));
    // 遅くても表示は止めない（最大 1.5 秒待つ）
    return Promise.race([Promise.all(jobs), new Promise((r) => setTimeout(r, 1500))]);
  },

  /** 画像を先に読み込む。失敗したら broken に記録して false */
  preload(url, timeoutMs = 2500) {
    if (!url || url.startsWith('data:')) return Promise.resolve(true);
    return new Promise((resolve) => {
      const img = new Image();
      const t = setTimeout(() => resolve(true), timeoutMs); // 遅いだけなら表示は進める
      img.onload = () => { clearTimeout(t); resolve(true); };
      img.onerror = () => { clearTimeout(t); this.broken.add(url); resolve(false); };
      img.src = url;
    });
  },

  svgUrl(svg) { return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`; },

  /* ---------- 仮シルエット（SVG）：体型6種 × ポーズ5種 ---------- */
  BODY: {
    man:     { h: 1.00, sh: 13.5, hip: 10, head: 7.0 },
    woman:   { h: 0.93, sh: 11.5, hip: 10, head: 6.8, hair: 'long', skirt: true },
    boy:     { h: 0.70, sh: 10.5, hip: 8, head: 7.4 },
    girl:    { h: 0.68, sh: 10.0, hip: 8, head: 7.4, hair: 'twin', skirt: true },
    old:     { h: 0.88, sh: 12.5, hip: 10, head: 6.8, hunch: 14, cane: true },
    unknown: { h: 0.95, sh: 12.5, hip: 11, head: 7.0, cloak: true },
  },

  /** 身長100の座標系で立ち姿を描く（足元 y=100） */
  svgBody(b, pose) {
    const P = [];
    const walk = pose === 'walk', talk = pose === 'talk', sit = pose === 'sit';
    const legA = walk ? 16 : 0;
    const hipY = 52;
    // 脚
    if (sit) {
      P.push(`<path d="M${-b.hip} ${hipY - 2} h${b.hip * 2} v8 h24 v36 h-8 v-28 h${-(b.hip * 2 + 16)} z"/>`);
      P.push(`<rect x="-4" y="${hipY + 6}" width="${b.hip * 2 + 12}" height="4" opacity=".55"/>`); // 腰掛け
    } else if (!b.cloak) {
      P.push(`<g transform="rotate(${legA} -4 ${hipY})"><rect x="-9" y="${hipY - 2}" width="8.5" height="${100 - hipY + 2}" rx="3"/></g>`);
      P.push(`<g transform="rotate(${-legA} 4 ${hipY})"><rect x="0.5" y="${hipY - 2}" width="8.5" height="${100 - hipY + 2}" rx="3"/></g>`);
    }
    // 胴（老人は前かがみ）
    const torso = [];
    torso.push(`<path d="M${-b.sh} 17 Q0 13 ${b.sh} 17 L${b.hip + 1} ${hipY + 2} L${-b.hip - 1} ${hipY + 2} Z"/>`);
    if (b.skirt) torso.push(`<path d="M${-b.hip} ${hipY - 6} L${b.hip} ${hipY - 6} L${b.hip + (sit ? 14 : 9)} ${sit ? hipY + 12 : 80} L${-b.hip - (sit ? 2 : 9)} ${sit ? hipY + 12 : 80} Z"/>`);
    if (b.cloak) torso.push(`<path d="M${-b.sh} 17 Q0 11 ${b.sh} 17 L${b.sh + 8} ${sit ? hipY + 14 : 100} L${-b.sh - 8} ${sit ? hipY + 14 : 100} Z"/>`);
    // 腕
    const armR = walk ? -24 : talk ? -70 : 6;
    const armL = walk ? 24 : -6;
    torso.push(`<g transform="rotate(${armL} ${-b.sh + 2} 19)"><rect x="${-b.sh - 2}" y="17" width="5.5" height="33" rx="2.7"/></g>`);
    torso.push(`<g transform="rotate(${armR} ${b.sh - 2} 19)"><rect x="${b.sh - 3.5}" y="17" width="5.5" height="${talk ? 26 : 33}" rx="2.7"/></g>`);
    // 首・頭・髪
    torso.push(`<rect x="-3" y="11" width="6" height="8"/>`);
    torso.push(`<circle cx="0" cy="${9 - b.head + 7}" r="${b.head}"/>`);
    if (b.cloak) torso.push(`<path d="M${-b.head - 3} ${9} Q0 ${-4} ${b.head + 3} 9 L${b.head + 4} 20 L${-b.head - 4} 20 Z"/>`);
    if (b.hair === 'long') torso.push(`<path d="M${-b.head - 1} 6 Q0 -3 ${b.head + 1} 6 L${b.head + 2} 26 L${-b.head - 2} 26 Z"/>`);
    if (b.hair === 'twin') torso.push(`<circle cx="${-b.head - 2}" cy="12" r="3.4"/><circle cx="${b.head + 2}" cy="12" r="3.4"/>`);
    const hunch = b.hunch || 0;
    P.push(`<g transform="rotate(${hunch} 0 ${hipY})">${torso.join('')}</g>`);
    if (b.cane) P.push(`<rect x="${b.sh + 8}" y="${hipY - 4}" width="2.2" height="${100 - hipY + 4}"/>`);
    return P.join('');
  },

  svgFigure(figId, poseId) {
    const b = this.BODY[figId] || this.BODY.unknown;
    const sit = poseId === 'sit';
    let g;
    if (poseId === 'lie') {
      // 横たわる：立ち姿を倒して足元に寝かせる
      g = `<g transform="translate(${-50 * b.h} ${100 - 15 * b.h}) rotate(-90) scale(${b.h})">${this.svgBody(b, 'stand')}</g>`;
    } else {
      const drop = sit ? 16 : 0; // 座ると頭の位置が下がる
      g = `<g transform="translate(0 ${100 - 100 * b.h + drop * b.h}) scale(${b.h})">${this.svgBody(b, poseId)}</g>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -2 120 104" preserveAspectRatio="xMidYMax meet"><g fill="#07080b" fill-opacity=".92">${g}</g></svg>`;
  },

  svgCrowd(k) {
    const kinds = k % 2 ? ['woman', 'man', 'old', 'man', 'woman', 'boy', 'man'] : ['man', 'woman', 'man', 'girl', 'man', 'woman', 'old'];
    const parts = kinds.map((f, i) => {
      const b = this.BODY[f];
      const x = -150 + i * 50 + (i % 2 ? 8 : -6);
      const s = b.h * (0.86 + ((i * 37) % 10) / 70);
      return `<g transform="translate(${x} ${100 - 100 * s}) scale(${s})">${this.svgBody(b, i % 3 === 1 ? 'walk' : 'stand')}</g>`;
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -2 360 104" preserveAspectRatio="xMidYMax meet"><g fill="#07080b" fill-opacity=".85">${parts.join('')}</g></svg>`;
  },
};

/* =====================================================================
 * 天候レイヤー：canvas の雨・雪パーティクル
 * ===================================================================== */
JV.Weather = {
  canvas: null, ctx: null, type: 'none', level: 0, targetType: 'none', targetLevel: 0,
  fadeMs: 1200, parts: [], raf: 0, last: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(canvas.clientWidth * dpr) || 1;
      canvas.height = Math.round(canvas.clientHeight * dpr) || 1;
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    window.addEventListener('resize', resize);
    resize();
  },

  /** type: 'rain' | 'snow' | 'none'、level: 0〜1 */
  set(type, level, fadeMs) {
    this.targetType = type;
    this.targetLevel = type === 'none' ? 0 : level;
    this.fadeMs = Math.max(1, fadeMs);
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.frame(t)); }
  },

  instant(type, level) {
    this.type = this.targetType = type;
    this.level = this.targetLevel = type === 'none' ? 0 : level;
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame((t) => this.frame(t)); }
  },

  spawn(w, h, anywhere) {
    const snow = this.type === 'snow';
    return {
      x: Math.random() * (w + 200) - 100,
      y: anywhere ? Math.random() * h : -20 - Math.random() * 60,
      v: snow ? 30 + Math.random() * 50 : 700 + Math.random() * 500,
      r: snow ? 1.2 + Math.random() * 2.6 : 10 + Math.random() * 14,
      ph: Math.random() * Math.PI * 2,
    };
  },

  frame(t) {
    const dt = Math.min(0.05, (t - this.last) / 1000);
    this.last = t;
    const step = (dt * 1000) / this.fadeMs;
    if (this.type !== this.targetType) {
      this.level -= step;
      if (this.level <= 0) { this.level = 0; this.type = this.targetType; this.parts = []; }
    } else if (this.level < this.targetLevel) this.level = Math.min(this.targetLevel, this.level + step);
    else if (this.level > this.targetLevel) this.level = Math.max(this.targetLevel, this.level - step);

    const c = this.canvas;
    const w = c.clientWidth, h = c.clientHeight, ctx = this.ctx;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
      c.width = Math.round(w * dpr) || 1;
      c.height = Math.round(h * dpr) || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    ctx.clearRect(0, 0, w, h);
    if (this.type === 'none' || (this.level <= 0 && this.targetLevel <= 0 && this.type === this.targetType)) {
      this.parts = [];
      this.raf = 0;
      return;
    }
    const max = this.type === 'snow' ? 140 : 220;
    const want = Math.round(max * Math.min(1, w / 1000 + 0.3) * this.level);
    while (this.parts.length < want) this.parts.push(this.spawn(w, h, this.parts.length < want / 2));
    if (this.parts.length > want) this.parts.length = want;

    ctx.globalAlpha = Math.min(1, 0.25 + this.level);
    if (this.type === 'rain') {
      ctx.strokeStyle = 'rgba(200, 215, 235, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const p of this.parts) {
        p.y += p.v * dt; p.x -= p.v * dt * 0.18;
        if (p.y > h + 20) Object.assign(p, this.spawn(w, h, false));
        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.r * 0.18, p.y - p.r);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      for (const p of this.parts) {
        p.y += p.v * dt; p.ph += dt; p.x += Math.sin(p.ph) * 18 * dt;
        if (p.y > h + 10) Object.assign(p, this.spawn(w, h, false));
        ctx.moveTo(p.x + p.r, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    this.raf = requestAnimationFrame((tt) => this.frame(tt));
  },
};

/* =====================================================================
 * 合成部：5枚のレイヤー（背景・色調・天候・人物・空気）と章替わりの暗転
 * ===================================================================== */
JV.Stage = {
  el: null, bgEls: [], bgFront: 0, figs: null, gen: 0,
  shown: null,     // いま表示している場面
  figKey: '',

  INDOOR: new Set(['washitsu', 'yoshitsu', 'kitchen', 'genkan', 'classroom', 'shop']),

  init() {
    const st = document.getElementById('stage');
    st.innerHTML = `
      <div class="scene layer">
        <div class="layer bgs" data-layer="bg">
          <div class="layer bg"><div class="bg-label"></div></div>
          <div class="layer bg"><div class="bg-label"></div></div>
        </div>
        <div class="layer tint tint-morning"></div>
        <div class="layer tint tint-evening"></div>
        <div class="layer tint tint-night"></div>
        <div class="layer tint tint-night-dim"></div>
        <div class="layer cloudy"></div>
        <div class="layer figures" data-layer="figures">
          <div class="fig crowd"><img alt=""></div>
          <div class="fig sub"><img alt=""></div>
          <div class="fig main"><img alt=""></div>
        </div>
      </div>
      <canvas class="layer weather" data-layer="weather"></canvas>
      <div class="layer fog"></div>
      <div class="layer vignette" data-layer="mood"></div>
      <div class="layer blackout"></div>`;
    this.el = st;
    this.bgEls = Array.from(st.querySelectorAll('.bg'));
    this.figs = st.querySelector('.figures');
    JV.Weather.init(st.querySelector('canvas.weather'));
    this.reset();
  },

  reset() {
    this.gen++;
    this.shown = null;
    this.figKey = '';
    this.bgEls.forEach((b) => { b.style.transition = 'none'; b.style.opacity = '0'; b.dataset.key = ''; });
    this.figs.style.transition = 'none';
    this.figs.style.opacity = '0';
    this.figs.querySelectorAll('.fig').forEach((f) => { f.style.display = 'none'; });
    this.el.querySelectorAll('.tint, .cloudy, .fog').forEach((t) => { t.style.transition = 'none'; t.style.opacity = '0'; });
    this.setMood(0, 0);
    this.el.querySelector('.blackout').style.opacity = '0';
    JV.Weather.instant('none', 0);
  },

  fade() { return Number(JV.Settings.get('fadeScale')) || 1; },

  /* ---------- 各レイヤー ---------- */
  setBackground(scene, ms) {
    const era = scene.era || 'modern';
    const loc = scene.location || 'none';
    const spec = JV.Assets.background(era, loc, scene.time);
    const next = this.bgEls[this.bgFront ^ 1];
    const cur = this.bgEls[this.bgFront];
    next.dataset.key = spec.key;
    next.dataset.loc = loc;
    const label = next.querySelector('.bg-label');
    if (spec.kind === 'image') {
      next.style.background = `#222 url("${spec.url}") center / cover no-repeat`;
      label.textContent = '';
    } else {
      const [top, bottom] = JV.Assets.PALETTE[loc] || JV.Assets.PALETTE.none;
      next.style.background = `linear-gradient(to bottom, ${top}, ${bottom})`;
      const o = JV.Schema.byId('scene', 'location', loc);
      label.textContent = o ? o.label : '';
    }
    next.style.transition = 'none';
    next.style.opacity = '0';
    next.style.zIndex = '2';
    cur.style.zIndex = '1';
    void next.offsetWidth;
    next.style.transition = `opacity ${ms}ms ease`;
    next.style.opacity = '1';
    this.bgFront ^= 1;
    const gen = this.gen;
    setTimeout(() => { if (gen === this.gen && this.bgEls[this.bgFront] === next) { cur.style.transition = 'none'; cur.style.opacity = '0'; } }, ms + 50);
    // 背景画像が時間帯専用の絵なら、色調レイヤーは弱める
    this.ownTime = spec.kind === 'image' && spec.ownTime;
  },

  setTone(scene, ms) {
    const q = (sel) => this.el.querySelector(sel);
    const own = this.ownTime ? 0.35 : 1;
    const t = scene.time;
    this.el.classList.toggle('is-night', t === 'night');
    const val = { morning: [1, 0, 0, 0], evening: [0, 1, 0, 0], night: [0, 0, 1, 1] }[t] || [0, 0, 0, 0];
    ['.tint-morning', '.tint-evening', '.tint-night', '.tint-night-dim'].forEach((sel, i) => {
      const e = q(sel);
      e.style.transition = `opacity ${ms}ms ease`;
      e.style.opacity = String(val[i] * own);
    });
    const w = scene.weather;
    const indoor = this.INDOOR.has(scene.location);
    const cl = q('.cloudy');
    cl.style.transition = `opacity ${ms}ms ease`;
    cl.style.opacity = w === 'cloudy' || w === 'rain' || w === 'snow' ? (w === 'cloudy' ? '1' : '0.6') : '0';
    const fog = q('.fog');
    fog.style.transition = `opacity ${ms}ms ease`;
    fog.style.opacity = w === 'fog' ? (indoor ? '0.3' : '1') : '0';
    const particles = (w === 'rain' || w === 'snow') && !indoor ? w : 'none';
    JV.Weather.set(particles, 1, ms);
  },

  setMood(m, ms) {
    const v = this.el.querySelector('.vignette');
    const scene = this.el.querySelector('.scene');
    v.style.transition = `opacity ${ms}ms ease`;
    v.style.opacity = String(0.15 + 0.5 * m);
    scene.style.transition = `filter ${ms}ms ease`;
    scene.style.filter = `saturate(${(1 - 0.55 * m).toFixed(3)}) brightness(${(1 - 0.08 * m).toFixed(3)})`;
  },

  figuresKey(s) { return s.figures ? `${s.figures.layout}|${s.figures.main || ''}|${s.figures.sub || ''}|${s.figures.pose}` : ''; },

  /** 人物の配置：1人＝中央やや右、2人＝左右に向かい合わせ（主人物が右）、3人以上＝群衆＋手前に主人物 */
  placeFigures(s) {
    const f = s.figures;
    const [crowd, sub, main] = ['crowd', 'sub', 'main'].map((c) => this.figs.querySelector(`.fig.${c}`));
    [crowd, sub, main].forEach((e) => { e.className = e.className.replace(/\s*pos-\S+/g, ''); e.style.display = 'none'; });
    if (!f || f.layout === 'none') return;
    this.figs.classList.toggle('face-right', JV.Assets.manifest.silFacing === 'right');
    const show = (el, url, pos, fallback) => {
      const img = el.querySelector('img');
      img.onerror = () => { JV.Assets.broken.add(url); img.onerror = null; img.src = fallback(); };
      img.src = url;
      el.classList.add(pos);
      el.style.display = '';
    };
    const pose = f.pose;
    const sil = (fig, p) => () => JV.Assets.silhouette(fig, p);
    const subPose = pose === 'lie' ? 'stand' : pose;
    if (f.layout === 'one' && f.main) show(main, sil(f.main, pose)(), 'pos-solo', sil(f.main, pose));
    if (f.layout === 'two') {
      if (f.main) show(main, sil(f.main, pose)(), 'pos-right', sil(f.main, pose));
      if (f.sub) show(sub, sil(f.sub, subPose)(), 'pos-left', sil(f.sub, subPose));
    }
    if (f.layout === 'many') {
      const v = s.crowdVariant || 0;
      show(crowd, JV.Assets.crowd(v), 'pos-crowd', () => JV.Assets.crowd(v));
      if (f.main) show(main, sil(f.main, pose)(), 'pos-front', sil(f.main, pose));
    }
  },

  async fadeFigures(to, ms) {
    this.figs.style.transition = `opacity ${ms}ms ease`;
    this.figs.style.opacity = String(to);
    await JV.util.sleep(ms);
  },

  /** 判定結果から決まった「次の場面」を、変化の種類に応じた演出で見せる */
  async show(plan) {
    const gen = ++this.gen;
    const k = this.fade();
    const s = plan.scene;
    const alive = () => gen === this.gen;
    const newFigKey = this.figuresKey(s);
    const figsChanged = newFigKey !== this.figKey;

    // 実素材は読み込んでから切り替える（失敗したら仮素材で代用）
    const bgSpec = () => JV.Assets.background(s.era || 'modern', s.location, s.time);
    const front = this.bgEls[this.bgFront];
    const needBg = plan.bg || plan.chapter || (plan.tone && s.location && bgSpec().key !== front.dataset.key);
    if (needBg && s.location) {
      let spec = bgSpec();
      while (spec.kind === 'image' && !(await JV.Assets.preload(spec.url))) spec = bgSpec();
      if (!alive()) return;
    }
    if (figsChanged) {
      await JV.Assets.prepareFigures(s);
      if (!alive()) return;
    }

    if (plan.chapter) {
      // 章が変わる：一度黒に落としてから新しい場面（1,000ms）
      const bo = this.el.querySelector('.blackout');
      bo.style.transition = `opacity ${450 * k}ms ease`;
      bo.style.opacity = '1';
      await JV.util.sleep(500 * k);
      if (!alive()) return;
      this.setBackground(s, 0);
      this.setTone(s, 0);
      JV.Weather.instant((s.weather === 'rain' || s.weather === 'snow') && !this.INDOOR.has(s.location) ? s.weather : 'none', 1);
      this.setMood(s.mood, 0);
      this.placeFigures(s);
      this.figKey = newFigKey;
      this.figs.style.transition = 'none';
      this.figs.style.opacity = s.figures && s.figures.layout !== 'none' ? '1' : '0';
      bo.style.transition = `opacity ${500 * k}ms ease`;
      bo.style.opacity = '0';
      this.shown = s;
      return;
    }

    if (plan.bg) {
      // 場所が変わる：背景をクロスフェード、人物は一度消してから出す（800ms）
      const hadFigs = this.figs.style.opacity !== '0';
      if (hadFigs) this.fadeFigures(0, 200 * k);
      this.setBackground(s, 800 * k);
      this.setTone(s, 800 * k);
      this.setMood(s.mood, 1200 * k);
      this.shown = s;
      await JV.util.sleep(800 * k);
      if (!alive()) return;
      this.placeFigures(s);
      this.figKey = newFigKey;
      if (s.figures && s.figures.layout !== 'none') await this.fadeFigures(1, 400 * k);
      return;
    }

    // 時間帯・天候だけ変わる：色調・天候レイヤーだけゆっくり（1,200ms）。時間帯専用の絵があれば背景も
    if (needBg && s.location) this.setBackground(s, 1200 * k);
    if (plan.tone) this.setTone(s, 1200 * k);
    this.setMood(s.mood, 1200 * k);
    this.shown = s;

    // 人物だけ変わる：シルエットだけフェード（400ms）
    if (figsChanged) {
      const visible = this.figs.style.opacity !== '0';
      if (visible) { await this.fadeFigures(0, 200 * k); if (!alive()) return; }
      this.placeFigures(s);
      this.figKey = newFigKey;
      if (s.figures && s.figures.layout !== 'none') await this.fadeFigures(1, (visible ? 200 : 400) * k);
    }
  },
};

/* =====================================================================
 * 演出の発火ロジック：判定結果 → 次の場面（絵を替えるかどうかはすべてここで決める）
 * ===================================================================== */
JV.Director = {
  scene: null,        // いま表示している（表示が決まった）場面。値は英字ID
  lastBgAt: -Infinity,
  lastChapter: null,
  MIN_BG_MS: 5000,    // 一度替えた背景は最短5秒は替えない

  reset() { this.scene = null; this.lastBgAt = -Infinity; this.lastChapter = null; },

  thresholds() {
    const th = Number(JV.Settings.get('sensitivity')) || 0.6;
    return { th, loc: Math.max(0.2, th - 0.1) };
  },

  /** 判定器の答え（キーが表示名でも英字IDでもよい）を {key: {id, label, p, top}} に揃える */
  normalize(answers) {
    const out = {};
    for (const [key, a] of Object.entries(answers || {})) {
      if (!(key in JV.Schema.scene)) continue;
      if (a.type === 'noul' || 'noul' in a) { out[key] = { p: Number(a.noul) }; continue; }
      if (a.type === 'score' || ('score' in a && !('choice' in a))) {
        const n = JV.Schema.scene[key].levels.length;
        let v = Number(a.score);
        if (v > n - 1) v = n - 1;
        out[key] = { value: Math.max(0, v) / (n - 1), confidence: a.confidence };
        continue;
      }
      const opt = JV.Schema.byLabel('scene', key, a.choice) || JV.Schema.byId('scene', key, a.choice);
      if (!opt) continue; // スキーマ外の値は使わない
      const probs = a.probabilities || {};
      const p = probs[a.choice] != null ? Number(probs[a.choice]) : Number(a.confidence || 0);
      out[key] = { id: opt.id, label: opt.label, p, confidence: a.confidence != null ? Number(a.confidence) : p, probabilities: probs };
    }
    return out;
  },

  /**
   * ルール（仕様 7章）
   * 1. scene_changed ≥ しきい値、または location が前と違い confidence ≥ 0.5 → 背景を替える
   * 2. time・weather はしきい値以上の選択肢だけ反映。それ未満は前の値を引き継ぐ
   * 3. 人物レイヤーは背景と独立。people が「誰もいない」なら人物を消す
   * 4. location が「不明」なら背景は前のまま
   * 5. 一度替えた背景は最短5秒は替えない（章替わりは除く）
   */
  decide(answers, { chapter, era = 'modern', hideNarrator = false, now = performance.now() } = {}) {
    const a = this.normalize(answers);
    const { th, loc: locTh } = this.thresholds();
    const prev = this.scene;
    const s = prev ? { ...prev, figures: prev.figures && { ...prev.figures } } : { location: null, time: 'day', weather: 'none', mood: 0, figures: null };
    s.era = era;
    const why = [];
    const isChapter = this.lastChapter !== null && chapter !== this.lastChapter;
    let bg = false;

    // 背景
    const L = a.location, sc = a.scene_changed ? a.scene_changed.p : 0;
    if (!L) why.push('背景：判定なし');
    else if (L.id === 'unknown') why.push('背景維持（場所が不明）');
    else if (L.id !== s.location) {
      const byScene = sc >= th && L.confidence >= 0.25;
      const byLoc = L.confidence >= locTh;
      const first = !s.location && (L.confidence >= 0.3 || sc >= th);
      if (!(byScene || byLoc || first)) why.push(`背景維持（確信度不足 ${L.confidence.toFixed(2)}）`);
      else if (s.location && !isChapter && now - this.lastBgAt < this.MIN_BG_MS) why.push('背景維持（最短表示5秒）');
      else { s.location = L.id; bg = true; why.push(`背景 → ${L.label}${byScene ? '（場面転換）' : ''}`); }
    }
    if (!s.location) { why.push('まだ場所が決まらない'); }

    // 時間帯・天候
    const T = a.time;
    if (T && T.id !== 'unknown' && T.p >= th) s.time = T.id;
    const W = a.weather;
    if (bg && !(W && W.p >= th && W.id !== 'none')) s.weather = 'none'; // 場所が変われば天候は書かれ直すまで晴れ
    if (W && W.p >= th && W.id !== 'none') s.weather = W.id;

    // 空気（緊張感）
    if (a.mood) s.mood = a.mood.value;

    // 人物
    const P = a.people, M = a.figure_main, S = a.figure_sub, Po = a.pose;
    const f = s.figures ? { ...s.figures } : { layout: 'one', main: null, sub: null, pose: 'stand' };
    if (P && P.confidence >= locTh) f.layout = P.id;
    if (M && M.id !== 'unknown' && M.confidence >= 0.35) f.main = M.id;
    if (!f.main) f.main = 'unknown';
    if (f.layout === 'two' || f.layout === 'many') {
      if (S && S.id !== 'unknown' && S.confidence >= 0.35) f.sub = S.id;
      if (!f.sub) f.sub = 'unknown';
    }
    if (Po && Po.confidence >= 0.4) f.pose = Po.id;
    if (f.pose === 'talk' && f.layout === 'one') f.pose = 'stand';
    // 一人称の作品で「主人物を出さない」設定：相手だけを描く
    if (hideNarrator) {
      if (f.layout === 'one') f.main = null;
      if (f.layout === 'two') { f.main = f.sub; f.sub = null; f.layout = 'one'; }
      if (f.layout === 'many') f.main = null;
    }
    s.figures = f;
    if (!s.location) s.figures = { ...f, layout: 'none' };

    const tone = !prev || s.time !== prev.time || s.weather !== prev.weather;
    const chapterFlag = isChapter && !!s.location;
    this.lastChapter = chapter;
    if (bg) this.lastBgAt = now;
    if (chapterFlag && !bg && prev) this.lastBgAt = now;
    this.scene = s;
    const figures = JV.Stage.figuresKey(s) !== (prev ? JV.Stage.figuresKey(prev) : '');
    return { scene: s, bg: bg || (chapterFlag && !!s.location), tone, figures, chapter: chapterFlag && !!prev, why };
  },
};

/* =====================================================================
 * 保存：IndexedDB（作品ハッシュ単位の判定結果と、最近読んだ作品）
 * 使えない環境（プライベートモード等）ではメモリだけで動く
 * ===================================================================== */
JV.Store = {
  DB: 'jev-viewer',
  VERSION: 1,
  dbp: null,

  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise((resolve) => {
      if (!window.indexedDB) { resolve(null); return; }
      let req;
      try { req = indexedDB.open(this.DB, this.VERSION); } catch (_) { resolve(null); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('judgments')) {
          const js = db.createObjectStore('judgments', { keyPath: 'k' });
          js.createIndex('hash', 'hash');
        }
        if (!db.objectStoreNames.contains('works')) {
          const ws = db.createObjectStore('works', { keyPath: 'hash' });
          ws.createIndex('updatedAt', 'updatedAt');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    });
    return this.dbp;
  },

  async tx(store, mode, fn) {
    const db = await this.open();
    if (!db) return undefined;
    return new Promise((resolve) => {
      let out;
      try {
        const t = db.transaction(store, mode);
        const r = fn(t.objectStore(store));
        if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => resolve(out);
        t.onerror = () => resolve(undefined);
        t.onabort = () => resolve(undefined);
      } catch (_) { resolve(undefined); }
    });
  },

  get(store, key) { return this.tx(store, 'readonly', (s) => s.get(key)); },
  put(store, value) { return this.tx(store, 'readwrite', (s) => s.put(value)); },
  del(store, key) { return this.tx(store, 'readwrite', (s) => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', (s) => s.getAll()); },

  /** ある作品の判定結果を消す（hash を省略すると全部） */
  async clearJudgments(hash) {
    if (!hash) return this.tx('judgments', 'readwrite', (s) => s.clear());
    const db = await this.open();
    if (!db) return undefined;
    return new Promise((resolve) => {
      const t = db.transaction('judgments', 'readwrite');
      const req = t.objectStore('judgments').index('hash').openKeyCursor(IDBKeyRange.only(hash));
      req.onsuccess = () => { const c = req.result; if (c) { t.objectStore('judgments').delete(c.primaryKey); c.continue(); } };
      t.oncomplete = () => resolve();
      t.onerror = () => resolve();
    });
  },

  /** 作品ハッシュ：SHA-256（使えなければ FNV-1a を2本） */
  async hash(text) {
    try {
      if (crypto && crypto.subtle) {
        const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(d).slice(0, 16), (b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (_) { /* 下へ */ }
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ text.length;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 ^ c, 0x5bd1e995) >>> 0;
    }
    return `f${h1.toString(16).padStart(8, '0')}${h2.toString(16).padStart(8, '0')}`;
  },
};

/* =====================================================================
 * 判定の呼び出し：作品判定（1回）と場面判定（停止ごと）
 * キャッシュ：メモリ → IndexedDB → 判定器。キーは「作品ハッシュ｜判定器｜判定単位」
 * ===================================================================== */
JV.Judge = {
  SCHEMA_VERSION: 1,     // 質問の文言を変えたら上げる（古いキャッシュを使わないため）
  PREFETCH: 3,           // 停止した段落の後ろを何単位先読みするか
  memory: new Map(),
  inflight: new Map(),   // key → { promise, ctl, unit }
  hashKey: '',
  stats: { calls: 0, memoryHits: 0, dbHits: 0, aborted: 0 },

  /** 設定から判定器を選ぶ。キー（中継ならURL）が未設定ならモック */
  adapter() {
    const route = JV.Settings.get('route');
    if (route === 'mock' || !JV.Adapters.remote.ROUTES[route]) return JV.Adapters.mock;
    // 中継はキーをサーバー側に置けるので、キーなしでも使う
    const ready = route === 'relay' || !!(JV.Settings.get('apiKey') || '').trim();
    return ready ? JV.Adapters.remote : JV.Adapters.mock;
  },
  adapterKey() {
    const a = this.adapter();
    return `${a.cacheKey ? a.cacheKey() : a.name}${JV.Settings.get('asciiKeys') ? ':id' : ''}@s${this.SCHEMA_VERSION}`;
  },
  questions(group) { return JV.Schema.toQuestions(group, { asciiKeys: !!JV.Settings.get('asciiKeys') }); },
  key(unit) { return `${this.hashKey}|${this.adapterKey()}|${unit}`; },

  setWork(hash) {
    this.abortExcept(new Set());
    this.hashKey = hash;
    this.memory.clear();
  },

  /** 指定の単位以外の進行中リクエストを中断する */
  abortExcept(keep) {
    for (const [k, f] of this.inflight) {
      if (!keep.has(f.unit)) { f.ctl.abort(); this.inflight.delete(k); this.stats.aborted++; }
    }
  },

  /** 場面判定（キャッシュ付き）。同じ単位が判定中ならその結果を待つ */
  async scene(doc, unit, work, prevScene) {
    const k = this.key(unit);
    const hit = this.memory.get(k);
    if (hit) { this.stats.memoryHits++; return { ...hit, cached: 'memory' }; }
    const running = this.inflight.get(k);
    if (running) return running.promise;

    const ctl = new AbortController();
    const promise = (async () => {
      const saved = this.hashKey ? await JV.Store.get('judgments', k) : undefined;
      if (saved && saved.answers) {
        const r = { answers: saved.answers, ms: saved.ms, source: saved.source };
        this.memory.set(k, r);
        this.stats.dbHits++;
        return { ...r, cached: 'db' };
      }
      if (ctl.signal.aborted) throw new DOMException('Aborted', 'AbortError');
      this.stats.calls++;
      const r = await this.judgeScene(doc, unit, work, prevScene, { signal: ctl.signal });
      this.memory.set(k, r);
      if (this.hashKey) JV.Store.put('judgments', { k, hash: this.hashKey, unit, answers: r.answers, ms: r.ms, source: r.source, at: Date.now() });
      return r;
    })();
    this.inflight.set(k, { promise, ctl, unit });
    promise.then(() => {}, () => {}).finally(() => { const f = this.inflight.get(k); if (f && f.ctl === ctl) this.inflight.delete(k); });
    return promise;
  },

  /** 作品判定（キャッシュ付き） */
  async work(doc) {
    const k = this.key('work');
    const saved = this.hashKey ? await JV.Store.get('judgments', k) : undefined;
    if (saved && saved.work) return { ...saved.work, cached: true };
    const w = await this.judgeWork(doc);
    if (this.hashKey) JV.Store.put('judgments', { k, hash: this.hashKey, unit: -1, work: { era: w.era, narration: w.narration, raw: w.raw }, at: Date.now() });
    return w;
  },

  /** 作品判定：冒頭約3,000字 */
  async judgeWork(doc, { signal } = {}) {
    const head = doc.paragraphs.map((p) => p.text.replace(/^[\s　]+/, '')).join('\n').slice(0, 3000);
    const answers = await this.adapter().judge(head, this.questions('work'), { signal });
    const pick = (key, fallback) => {
      const a = answers[key];
      const o = a && (JV.Schema.byLabel('work', key, a.choice) || JV.Schema.byId('work', key, a.choice));
      return o ? o.id : fallback;
    };
    return { era: pick('era', 'modern'), narration: pick('narration', 'third'), raw: answers };
  },

  /** 場面判定の state：時代・前の場面・直前2段落・現段落 */
  sceneState(doc, unit, work, prevScene) {
    const lab = (key, id) => { const o = id && JV.Schema.byId('scene', key, id); return o ? o.label : '不明'; };
    const era = JV.Schema.byId('work', 'era', work.era);
    return {
      era: era ? era.label : '近代日本',
      previous_scene: { location: lab('location', prevScene && prevScene.location), time: lab('time', prevScene && prevScene.time) },
      context_before: JV.Reader.contextBefore(unit),
      current: doc.units[unit].text,
    };
  },

  async judgeScene(doc, unit, work, prevScene, { signal } = {}) {
    const state = this.sceneState(doc, unit, work, prevScene);
    const t0 = performance.now();
    const answers = await this.adapter().judge(state, this.questions('scene'), { signal });
    return { answers, ms: Math.round(performance.now() - t0), source: this.adapter().name };
  },

  /** デバッグ表示用：判定結果と確率を短く */
  describe(answers) {
    const lines = [];
    for (const [key, a] of Object.entries(answers || {})) {
      if (a.type === 'noul' || 'noul' in a) { lines.push(`${key}: ${Number(a.noul).toFixed(2)}`); continue; }
      if (a.type === 'score' || !('choice' in a)) { lines.push(`${key}: ${Number(a.score).toFixed(2)}`); continue; }
      const top = Object.entries(a.probabilities || {}).sort((x, y) => y[1] - x[1]).slice(0, 3)
        .map(([k, p]) => `${k} ${p.toFixed(2)}`).join('  ');
      lines.push(`${key}: ${top}`);
    }
    return lines.join('\n');
  },
};

/* =====================================================================
 * 読書画面：本文の描画
 * ===================================================================== */
JV.Reader = {
  doc: null,

  render(doc) {
    this.doc = doc;
    const root = document.getElementById('text');
    root.textContent = '';
    const frag = document.createDocumentFragment();
    let lastChapter = -1;
    for (const p of doc.paragraphs) {
      if (p.chapter !== lastChapter) {
        lastChapter = p.chapter;
        const title = doc.chapters[p.chapter] && doc.chapters[p.chapter].title;
        if (title) {
          const h = document.createElement('h2');
          h.className = 'chapter-title';
          h.dataset.chapter = p.chapter;
          h.textContent = title;
          frag.appendChild(h);
        }
      }
      if (p.breakBefore) {
        const b = document.createElement('div');
        b.className = 'scene-break';
        b.textContent = '◇';
        frag.appendChild(b);
      }
      const el = document.createElement('p');
      el.className = 'para';
      el.dataset.p = p.i;
      for (const si of p.segs) {
        const seg = doc.segments[si];
        const span = document.createElement('span');
        span.className = 'seg';
        span.dataset.s = seg.i;
        span.dataset.u = seg.unit;
        span.textContent = seg.text;
        el.appendChild(span);
      }
      frag.appendChild(el);
    }
    const end = document.createElement('div');
    end.className = 'end-mark';
    end.textContent = '（おわり）';
    frag.appendChild(end);
    root.appendChild(frag);

    document.getElementById('work-title').textContent = doc.title + (doc.author ? `　${doc.author}` : '');
    this.setChapterName(0);
  },

  setChapterName(ci) {
    const ch = this.doc && this.doc.chapters[ci];
    document.getElementById('chapter-name').textContent = ch && ch.title ? ch.title : '';
  },

  /** 判定単位 u の断片に印をつける（デバッグ表示時に枠線） */
  markCurrent(u) {
    document.querySelectorAll('#text .seg.current').forEach((el) => el.classList.remove('current'));
    document.querySelectorAll(`#text .seg[data-u="${u}"]`).forEach((el) => el.classList.add('current'));
  },

  /** 判定単位 u の直前2段落（場面判定の context_before 用） */
  contextBefore(u, n = 2) {
    const unit = this.doc.units[u];
    const start = Math.max(0, unit.paraStart - n);
    return this.doc.paragraphs.slice(start, unit.paraStart).map((p) => p.text.replace(/^[\s　]+/, '')).join('\n');
  },
};

/* =====================================================================
 * アプリ全体
 * ===================================================================== */
JV.App = {
  SAMPLES: [
    { file: 'samples/ame_no_teishaba.txt', label: '雨の停車場', note: '青空文庫形式・Shift_JIS' },
    { file: 'samples/umibe_no_kissaten.md', label: '海辺の喫茶店', note: 'Markdown' },
    { file: 'samples/mori_no_michi.txt', label: '森の道', note: 'テキスト' },
  ],

  init() {
    JV.Settings.load();
    document.body.classList.add('novel');
    JV.Stage.init();
    this.applySettings();
    JV.Assets.loadManifest().then((ok) => {
      const m = JV.Assets.manifest;
      JV.Debug.set('assets', ok
        ? `素材: 背景 ${Object.keys(m.bg).length}・シルエット ${Object.keys(m.sil).length}・群衆 ${m.crowd.length}${JV.Assets.manifestSkipped.length ? `（名前の規則外 ${JV.Assets.manifestSkipped.length}）` : ''}`
        : `素材: 仮素材のみ（manifest.json を読めません: ${JV.Assets.manifestError}）`);
    });
    this.renderSamples();
    this.renderRecent();
    this.setupDrop();
    window.addEventListener('popstate', () => { if (!location.hash) this.showHome(); });
    // デバッグ表示の切り替え（D キー。設定画面からも切り替えられる）
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('settings').classList.contains('hidden')) { JV.SettingsUI.close(); return; }
      if (e.key.toLowerCase() === 'd' && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
        JV.Settings.set('debug', !JV.Settings.get('debug'));
        JV.Debug.render();
      }
    });
    JV.Debug.render();
  },

  toggleEffects() {
    JV.Settings.set('effects', !JV.Settings.get('effects'));
    this.applyEffects();
    if (!this.doc || document.getElementById('reader').classList.contains('hidden')) return;
    if (JV.Settings.get('effects')) {
      // オフの間の場面は見ていないので、いまの位置から組み立て直す
      JV.Director.reset();
      JV.Stage.reset();
      JV.StopDetector.fire(true);
    } else JV.Judge.abortExcept(new Set());
  },

  /** 設定を画面に反映（文字サイズ・シルエット・デバッグなど） */
  applySettings() {
    document.documentElement.style.setProperty('--font-size', `${Number(JV.Settings.get('fontSize')) || 18}px`);
    this.applyEffects();
    JV.Debug.render();
    const a = JV.Judge.adapter();
    const route = JV.Settings.get('route');
    const status = a === JV.Adapters.mock
      ? (route === 'mock' ? '判定：モック' : `判定：モック（${JV.Adapters.remote.ROUTES[route].label} は未設定）`)
      : `判定：${JV.Adapters.remote.ROUTES[route].label}・${JV.Settings.get('model')}`;
    const el = document.getElementById('route-status');
    if (el) el.textContent = status;
  },

  /** 判定器に関わる設定が変わったら、作品判定からやり直す */
  onSettingsClosed(judgeChanged) {
    if (!this.doc || document.getElementById('reader').classList.contains('hidden')) return;
    if (judgeChanged) {
      JV.Judge.abortExcept(new Set());
      JV.Judge.memory.clear();
      this.startWorkJudgment();
    }
    JV.StopDetector.fire(true);
  },

  applyEffects() {
    const on = JV.Settings.get('effects');
    document.body.classList.toggle('effects-off', !on);
    document.body.classList.toggle('no-silhouettes', !JV.Settings.get('silhouettes'));
    const b = document.getElementById('effects-toggle');
    b.setAttribute('aria-pressed', String(on));
    b.textContent = on ? '演出 オン' : '演出 オフ';
  },

  /** スクロール停止時：画面中央の判定単位が変わったときだけ呼ばれる */
  onStop({ unit }) {
    const doc = this.doc;
    const u = doc.units[unit];
    this.currentUnit = unit;
    JV.Reader.markCurrent(unit);
    JV.Reader.setChapterName(u.chapter);
    JV.Debug.set('unit', `単位 #${unit}（段落 ${u.paraStart}${u.paraEnd !== u.paraStart ? `〜${u.paraEnd}` : ''}・${u.text.length}字・章 ${u.chapter}）\n${u.text.slice(0, 60).replace(/\n/g, ' / ')}${u.text.length > 60 ? '…' : ''}`);
    this.saveProgress(unit);
    if (JV.Settings.get('effects')) this.judgeAndShow(unit);
  },

  /** 作品を開いたときに1回だけ：時代と語りの人称 */
  startWorkJudgment() {
    const doc = this.doc;
    this.work = { era: 'modern', narration: 'third' };
    this.workReady = this.hashReady
      .then(() => JV.Judge.work(doc))
      .then((w) => {
        if (this.doc !== doc) return;
        this.work = w;
        JV.Debug.set('work', `作品: ${JV.Schema.byId('work', 'era', w.era).label}・${JV.Schema.byId('work', 'narration', w.narration).label}${w.cached ? '（キャッシュ）' : ''}`);
      })
      .catch((err) => { JV.Debug.set('work', `作品判定エラー: ${err.message || err}（近代日本・三人称として扱う）`); });
  },

  /**
   * 停止した単位を判定して見せ、後ろの3単位を裏で先読みする。
   * 新しい停止が来たら、その単位と先読み範囲以外の進行中リクエストは中断する。
   */
  async judgeAndShow(unit) {
    const doc = this.doc;
    const ahead = [];
    for (let i = 1; i <= JV.Judge.PREFETCH && unit + i < doc.units.length; i++) ahead.push(unit + i);
    JV.Judge.abortExcept(new Set([unit, ...ahead]));
    try {
      await this.workReady;
      if (this.doc !== doc) return;
      const r = await JV.Judge.scene(doc, unit, this.work, JV.Director.scene);
      if (this.doc !== doc || this.currentUnit !== unit || !JV.Settings.get('effects')) return;
      this.present(unit, r);
      // 先読み：いま決まった場面を「前の場面」として渡す
      const prev = JV.Director.scene;
      for (const n of ahead) {
        JV.Judge.scene(doc, n, this.work, prev).catch((err) => {
          if (!JV.util.isAbort(err)) JV.Debug.set('prefetch', `先読みエラー #${n}: ${err.message || err}`);
        });
      }
    } catch (err) {
      if (JV.util.isAbort(err)) return;
      JV.Debug.set('judge', `判定エラー: ${err.message || err}（前の絵を維持）`);
    }
  },

  /** 判定結果 → 場面を決めて演出 */
  present(unit, r) {
    const u = this.doc.units[unit];
    const plan = JV.Director.decide(r.answers, {
      chapter: u.chapter,
      era: this.work.era,
      hideNarrator: this.work.narration === 'first' && JV.Settings.get('hideNarrator'),
    });
    if (JV.Settings.get('effects')) JV.Stage.show(plan);
    const changes = [plan.chapter && '章替わり', plan.tone && '色調・天候', plan.figures && '人物'].filter(Boolean);
    const src = r.cached ? `キャッシュ(${r.cached === 'db' ? 'IndexedDB' : 'メモリ'})` : `${r.ms}ms`;
    const st = JV.Judge.stats;
    JV.Debug.set('judge', `判定 #${unit}（${r.source}・${src}）\n${JV.Judge.describe(r.answers)}\n→ ${[...plan.why, ...changes].join(' / ') || '変化なし'}`);
    JV.Debug.set('stats', `呼び出し ${st.calls}・メモリ ${st.memoryHits}・DB ${st.dbHits}・中断 ${st.aborted}・判定中 ${JV.Judge.inflight.size}`);
  },

  /** 読んだ位置を最近読んだ作品に記録（1秒に1回まで） */
  saveProgress(unit) {
    this.progressUnit = unit;
    if (this.progressTimer) return;
    this.progressTimer = setTimeout(async () => {
      this.progressTimer = 0;
      const hash = this.hash;
      if (!hash) return;
      const rec = await JV.Store.get('works', hash);
      if (rec) { rec.lastUnit = this.progressUnit; rec.updatedAt = Date.now(); JV.Store.put('works', rec); }
    }, 1000);
  },

  async renderRecent() {
    const works = ((await JV.Store.all('works')) || []).sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 10);
    const sec = document.getElementById('recent-section');
    const ul = document.getElementById('recent-list');
    ul.textContent = '';
    sec.classList.toggle('hidden', works.length === 0);
    for (const w of works) {
      const li = document.createElement('li');
      li.className = 'recent-item';
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="name"></span><span class="meta"></span>';
      b.children[0].textContent = w.title + (w.author ? `　${w.author}` : '');
      const d = new Date(w.updatedAt);
      const pct = w.unitCount ? Math.round(((w.lastUnit || 0) + 1) / w.unitCount * 100) : 0;
      b.children[1].textContent = `${d.getMonth() + 1}/${d.getDate()}・${pct}%`;
      b.onclick = () => this.openText(w.text, w.name, { resumeUnit: w.lastUnit });
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.title = '履歴と判定キャッシュを削除';
      del.setAttribute('aria-label', `${w.title} を履歴から削除`);
      del.textContent = '×';
      del.onclick = async () => { await JV.Store.del('works', w.hash); await JV.Store.clearJudgments(w.hash); this.renderRecent(); };
      li.append(b, del);
      ul.appendChild(li);
    }
  },

  renderSamples() {
    const ul = document.getElementById('sample-list');
    ul.textContent = '';
    for (const s of this.SAMPLES) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span></span><span class="meta"></span>';
      b.children[0].textContent = s.label;
      b.children[1].textContent = s.note;
      b.onclick = () => this.openSample(s);
      li.appendChild(b);
      ul.appendChild(li);
    }
  },

  setupDrop() {
    const zone = document.getElementById('drop-zone');
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    ['dragenter', 'dragover'].forEach((ev) => zone.addEventListener(ev, (e) => { stop(e); zone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach((ev) => zone.addEventListener(ev, (e) => { stop(e); zone.classList.remove('dragover'); }));
    zone.addEventListener('drop', (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) this.openFile(f);
    });
    // ゾーン外へのドロップでブラウザがファイルを開いてしまうのを防ぐ
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());
  },

  onFileInput(input) {
    const f = input.files && input.files[0];
    if (f) this.openFile(f);
    input.value = '';
  },

  async openFile(file) {
    try {
      const buf = await file.arrayBuffer();
      if (JV.Zip.isZip(buf)) {
        const { name, bytes } = await JV.Zip.extractText(buf);
        this.openText(JV.Encoding.decode(bytes), name);
        return;
      }
      this.openText(JV.Encoding.decode(buf), file.name);
    } catch (err) {
      this.showError(`ファイルを読み込めませんでした：${err.message || err}`);
    }
  },

  async onUrlSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('url-input');
    const btn = document.getElementById('url-submit');
    const url = input.value.trim();
    if (!url) return;
    btn.disabled = true;
    btn.textContent = '読み込み中…';
    this.hideError();
    try {
      const { text, name } = await JV.Aozora.load(url);
      input.value = '';
      this.openText(text, name);
    } catch (err) {
      this.showError(err.message || String(err));
    } finally {
      btn.disabled = false;
      btn.textContent = '読み込む';
    }
  },

  async openSample(s) {
    try {
      const res = await fetch(s.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      this.openText(JV.Encoding.decode(buf), s.file.split('/').pop());
    } catch (err) {
      this.showError(`サンプルを読み込めませんでした（file:// で開いている場合は、ローカルサーバー経由で開くかファイルを直接選んでください）：${err.message || err}`);
    }
  },

  openText(text, name, { resumeUnit = null } = {}) {
    const doc = JV.Parser.parse(text, name);
    if (!doc.paragraphs.length) { this.showError('本文が見つかりませんでした。'); return; }
    this.doc = doc;
    this.hash = '';
    this.hideError();
    JV.Reader.render(doc);
    JV.Debug.clear();
    JV.Director.reset();
    JV.Stage.reset();
    // 作品ハッシュ → キャッシュの切り替えと、最近読んだ作品への登録
    JV.Judge.setWork('');
    this.hashReady = JV.Store.hash(text).then(async (hash) => {
      if (this.doc !== doc) return;
      this.hash = hash;
      JV.Judge.setWork(hash);
      const old = await JV.Store.get('works', hash);
      await JV.Store.put('works', {
        hash, name, text, title: doc.title, author: doc.author, format: doc.format,
        unitCount: doc.units.length, lastUnit: old ? old.lastUnit : 0, updatedAt: Date.now(),
      });
    });
    this.startWorkJudgment();
    this.showReader();
    if (resumeUnit > 0 && resumeUnit < doc.units.length) {
      const el = document.querySelector(`#text .seg[data-u="${resumeUnit}"]`);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2 + 4);
    }
    JV.StopDetector.attach(document.getElementById('text'), (e) => this.onStop(e));
  },

  showReader() {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('reader').classList.remove('hidden');
    if (location.hash !== '#read') history.pushState(null, '', '#read');
    window.scrollTo(0, 0);
  },

  goHome() {
    if (location.hash === '#read') history.back();
    else this.showHome();
  },

  showHome() {
    JV.StopDetector.detach();
    JV.Judge.abortExcept(new Set());
    document.getElementById('reader').classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
    window.scrollTo(0, 0);
    this.renderRecent();
  },

  showError(msg) {
    const el = document.getElementById('home-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  },
  hideError() { document.getElementById('home-error').classList.add('hidden'); },
};

if (location.hash) history.replaceState(null, '', location.pathname + location.search);
JV.App.init();
</script>
