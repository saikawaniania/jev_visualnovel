# Netlify：ビューア（viewer/）を公開し、/v1/systemone を TypeSafe への中継関数につなぐ。
# 環境変数（Site configuration → Environment variables）に次の2つを設定すること：
#   TYPESAFE_API_KEY   TypeSafe の API キー
#   RELAY_PASSPHRASE   中継の合言葉（ビューアの設定画面に同じものを入れた人だけが使える）
[build]
  publish = "viewer"
  functions = "netlify/functions"
  # 素材（viewer/assets/bg・sil）の一覧をデプロイのたびに作り直す。画像をアップロードするだけで反映される
  command = "node viewer/tools/build-manifest.mjs"
